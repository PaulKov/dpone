# Reference Airflow/Argo values for OpenExchangeRates rollout.

dpone:
  manifestPath: /opt/airflow/dags/repo/examples/batch/landing_openexchangerates_api.batch.yaml
  packageTarget: /opt/airflow/.dpone-pkgs

openexchangerates:
  manifestPath: /opt/airflow/dags/repo/examples/batch/landing_openexchangerates_api.batch.yaml
  schedule: "5 4 * * *"
  selectors:
    - default.historical_rates_daily
  vaultPath: api/openexchangerates
  taskGroup: openexchangerates__api

airflow:
  extraVolumes:
    - name: dpone-runtime
      emptyDir: {}
  extraVolumeMounts:
    - name: dpone-runtime
      mountPath: /opt/airflow/.dpone-pkgs
  extraEnv:
    - name: DPONE_PROJECT_DIR
      value: /opt/airflow/dags/repo
    - name: DPONE_PACKAGE_TARGET
      value: /opt/airflow/.dpone-pkgs
    - name: DPONE_LOG_LEVEL
      value: INFO
  scheduler:
    command: ["dpone-runtime-exec", "airflow", "scheduler"]
  worker:
    command: ["dpone-runtime-exec", "airflow", "celery", "worker"]
  triggerer:
    command: ["dpone-runtime-exec", "airflow", "triggerer"]
