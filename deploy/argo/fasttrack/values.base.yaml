# Reference Airflow/Argo values for Fasttrack rollout.
# Adjust field names to your chart if it differs, but keep the env/command semantics.

dpone:
  manifestPath: /opt/airflow/dags/repo/examples/batch/landing_fasttrack_api.batch.yaml
  packageTarget: /opt/airflow/.dpone-pkgs

fasttrack:
  manifestPath: /opt/airflow/dags/repo/examples/batch/landing_fasttrack_api.batch.yaml
  schedule: "0 1 * * *"
  selectors:
    - default.cascade_transactions
    - default.chat_sessions
    - default.flex_cms_ratings
  vaultPath: api/fasttrack
  taskGroup: fasttrack__api

airflow:
  extraVolumes:
    - name: dpone-runtime
      emptyDir: {}
  extraVolumeMounts:
    - name: dpone-runtime
      mountPath: /opt/airflow/.dpone-pkgs
  extraEnv:
    - name: DPONE_PROJECT_DIR
      value: /opt/airflow/dags/repo
    - name: DPONE_PACKAGE_TARGET
      value: /opt/airflow/.dpone-pkgs
    - name: DPONE_LOG_LEVEL
      value: INFO
  scheduler:
    command: ["dpone-runtime-exec", "airflow", "scheduler"]
  worker:
    command: ["dpone-runtime-exec", "airflow", "celery", "worker"]
  triggerer:
    command: ["dpone-runtime-exec", "airflow", "triggerer"]
