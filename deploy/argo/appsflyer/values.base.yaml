# Reference Airflow/Argo values for AppsFlyer rollout.
# Adjust field names to your chart if it differs, but keep the env/command semantics.

dpone:
  manifestPath: /opt/airflow/dags/repo/examples/batch/landing_appsflyer_api.batch.yaml
  packageTarget: /opt/airflow/.dpone-pkgs

appsflyer:
  manifestPath: /opt/airflow/dags/repo/examples/batch/landing_appsflyer_api.batch.yaml
  schedule: "1 4 * * *"
  selectors:
    - app.daily_report
    - app.installs_report
    - app.in_app_events_report
    - app.uninstall_events_report
    - app.installs_retarget
    - app.in_app_events_retarget
    - app.organic_installs_report
    - app.organic_in_app_events_report
    - app.organic_uninstall_events_report
  vaultPath: api/appsflyer
  taskGroup: appsflyer__api

airflow:
  extraVolumes:
    - name: dpone-runtime
      emptyDir: {}
  extraVolumeMounts:
    - name: dpone-runtime
      mountPath: /opt/airflow/.dpone-pkgs
  extraEnv:
    - name: DPONE_PROJECT_DIR
      value: /opt/airflow/dags/repo
    - name: DPONE_PACKAGE_TARGET
      value: /opt/airflow/.dpone-pkgs
    - name: DPONE_LOG_LEVEL
      value: INFO
  scheduler:
    command: ["dpone-runtime-exec", "airflow", "scheduler"]
  worker:
    command: ["dpone-runtime-exec", "airflow", "celery", "worker"]
  triggerer:
    command: ["dpone-runtime-exec", "airflow", "triggerer"]
