# Reference Airflow/Argo values for Mindbox rollout.
# Adjust field names to your chart if it differs, but keep the env/command semantics.

dpone:
  manifestPath: /opt/airflow/dags/repo/examples/batch/landing_mindbox_api.batch.yaml
  packageTarget: /opt/airflow/.dpone-pkgs

mindbox:
  manifestPath: /opt/airflow/dags/repo/examples/batch/landing_mindbox_api.batch.yaml
  schedule: "20 4 * * *"
  selectors:
    - app.getclients
    - app.getorders
    - app.getmailings
    - app.getmessagingreport
    - app.getactions
    - app.operationslogs
  vaultPath: api/mindbox
  taskGroup: mindbox__api

airflow:
  extraVolumes:
    - name: dpone-runtime
      emptyDir: {}
  extraVolumeMounts:
    - name: dpone-runtime
      mountPath: /opt/airflow/.dpone-pkgs
  extraEnv:
    - name: DPONE_PROJECT_DIR
      value: /opt/airflow/dags/repo
    - name: DPONE_PACKAGE_TARGET
      value: /opt/airflow/.dpone-pkgs
    - name: DPONE_LOG_LEVEL
      value: INFO
  scheduler:
    command: ["dpone-runtime-exec", "airflow", "scheduler"]
  worker:
    command: ["dpone-runtime-exec", "airflow", "celery", "worker"]
  triggerer:
    command: ["dpone-runtime-exec", "airflow", "triggerer"]
