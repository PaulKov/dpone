# yaml-language-server: $schema=../../src/dpone/schema/etl-batch-manifest.schema.json
kind: dpone.batch.v1

defaults:
  name: api_to_mssql_example
  source:
    type: api
    api_type: cbr
    options:
      resource: rates
  sink:
    type: mssql
    connection_id: mssql_dwh
    table:
      schema: dbo
      name: rates
    strategy:
      mode: incremental_append

quality:
  gates:
    - id: source_target_rows
      type: row_count_reconciliation
      severity: error
      tolerance:
        mode: pct
        value: 0.1

schemas:
  api:
    tables:
      - rates
