# yaml-language-server: $schema=../../src/dpone/schema/etl-batch-manifest.schema.json
kind: dpone.batch.v1

defaults:
  name: api_to_kafka_example
  source:
    type: api
    api_type: cbr
    options:
      resource: rates
  sink:
    type: kafka
    connection_id: kafka_target
    topic: dwh.rates
    strategy:
      mode: incremental_append
    options:
      message_format: json
      envelope: dpone
      key:
        mode: hash_row
      delivery:
        mode: at_least_once

quality:
  gates:
    - id: source_target_rows
      type: row_count_reconciliation
      severity: error
      tolerance:
        mode: pct
        value: 0.1

schemas:
  api:
    tables:
      - rates
