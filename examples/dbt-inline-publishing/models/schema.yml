version: 2

groups:
  - name: pricing
    owner:
      name: pricing-data

sources:
  - name: pricing_raw
    database: DWH_Stage
    schema: pricing_raw
    tables:
      - name: competitive_price_inputs

models:
  - name: competitive_pricing
    description: Current competitive price calculation ready for ClickHouse delivery.
    config:
      contract:
        enforced: true
    columns:
      - name: date_id
        data_type: date
        constraints:
          - type: not_null
        data_tests: [not_null]
      - name: product_id
        data_type: bigint
        constraints:
          - type: not_null
        data_tests: [not_null]
      - name: calculated_price
        data_type: decimal(18,2)
        data_tests: [not_null]
      - name: price_source
        data_type: nvarchar(100)

  - name: competitive_pricing_history
    description: Incremental competitive pricing history.
    config:
      contract:
        enforced: true
    data_tests:
      - unique:
          column_name: "cast(product_id as varchar) + ':' + cast(date_id as varchar)"
    columns:
      - name: date_id
        data_type: date
        constraints:
          - type: not_null
        data_tests: [not_null]
      - name: product_id
        data_type: bigint
        constraints:
          - type: not_null
        data_tests: [not_null]
      - name: calculated_price
        data_type: decimal(18,2)
      - name: price_source
        data_type: nvarchar(100)
