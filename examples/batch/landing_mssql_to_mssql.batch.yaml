# yaml-language-server: $schema=../../src/dpone/schema/etl-batch-manifest.schema.json
kind: dpone.batch.v1
convention: landing_raw_v1

vars:
  src_database: demo_source
  src_system: demo_mssql
  owner_team: data-platform-team
  owner_contact: data-platform@example.com
  sla: "hourly"

defaults:
  source:
    type: mssql
    connection_type: vault
    connection_id: mssql-source
    vault_path: mssql/demo-source
    options:
      incremental_column: updated_at
      batch_size: 50000
  sink:
    type: mssql
    connection_type: vault
    connection_id: mssql-dwh
    vault_path: mssql/demo-dwh
    staging: {schema: stg}
    strategy:
      mode: incremental_merge
      unique_key: [id]
    options:
      bulk:
        mode: bcp
        bcp:
          batch_size: 100000
  state:
    type: mssql
    connection_id: mssql-dwh
    connection_type: vault
    vault_path: mssql/demo-dwh
    table: {schema: etl_state, name: etl_xmin_state}

schemas:
  dbo:
    tables:
      - customer_events
