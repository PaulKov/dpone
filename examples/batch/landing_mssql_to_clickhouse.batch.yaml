# yaml-language-server: $schema=../../src/dpone/schema/etl-batch-manifest.schema.json
kind: dpone.batch.v1
convention: landing_raw_v1

vars:
  src_database: demo_source
  src_system: demo_mssql
  owner_team: data-platform-team
  owner_contact: data-platform@example.com
  sla: "daily"

defaults:
  source:
    type: mssql
    connection_type: vault
    connection_id: mssql-source
    vault_path: mssql/demo-source
    options:
      incremental_column: event_dtm
      batch_size: 100000
      mssql_export_mode: bcp
  sink:
    type: clickhouse
    connection_type: vault
    connection_id: clickhouse-landing
    vault_path: clickhouse/demo-landing
    strategy: {mode: incremental_append}
    options:
      log_sample_rows: 5

schemas:
  dbo:
    tables:
      - events
