# yaml-language-server: $schema=../../src/dpone/schema/etl-batch-manifest.schema.json
kind: dpone.batch.v1
convention: landing_raw_v1

vars:
  host: kafka_example_com
  sla: daily
  owner_contact: data-platform@example.com
  owner_team: data-platform-team
  src_system: demo_kafka
  src_database: demo_topic

defaults:
  source:
    type: api
    api_type: rest
    connection_type: vault
    connection_id: rest-demo
    vault_path: api/example_provider/rest
    options:
      resource: orders
      method: GET
      endpoint: https://api.example.com/orders
      records_path: data
      schema: {id: bigint, amount: numeric(18,2), updated_at: timestamp}
  sink:
    type: kafka
    connection_type: vault
    connection_id: kafka-demo
    vault_path: kafka/demo
    topic: api__orders
    strategy: {mode: incremental_append, unique_key: id}
    options:
      message_format: json
      envelope: dpone
      key: {mode: unique_key}
      delivery: {mode: at_least_once, compression_type: zstd}

schemas:
  app:
    tables: [orders]
