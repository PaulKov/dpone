# yaml-language-server: $schema=../../src/dpone/schema/etl-batch-manifest.schema.json
kind: dpone.batch.v1
convention: landing_raw_v1

vars:
  src_database: demo_source
  src_system: demo_mysql
  owner_team: data-platform-team
  owner_contact: data-platform@example.com
  sla: "daily"

defaults:
  source:
    type: mysql
    connection_type: vault
    connection_id: mysql-demo
    vault_path: mysql/demo-source
    options:
      batch_size: 100000
      incremental_column: updated_at
      export_format: csv
      compress_export: false
  sink:
    type: kafka
    connection_type: vault
    connection_id: kafka-demo
    vault_path: kafka/demo
    topic: landing.mysql.orders
    strategy: {mode: incremental_append}
    options:
      message_format: json
      envelope: dpone
      key: {mode: unique_key}
      delivery: {mode: at_least_once}

schemas:
  app:
    tables:
      - orders
