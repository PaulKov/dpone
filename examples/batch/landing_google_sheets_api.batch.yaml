# yaml-language-server: $schema=../../src/dpone/schema/etl-batch-manifest.schema.json
kind: dpone.batch.v1

convention: landing_raw_v1

vars:
  src_system: google_sheets
  src_database: api
  host: sheets_googleapis_com
  owner_team: analytics-engineering
  owner_contact: analytics-engineering@example.com
  sla: manual

defaults:
  source:
    type: api
    api_type: google_sheets
    connection_type: vault
    connection_id: api__google_sheets
    vault_path: api/google_sheets
    options:
      resource: "{{ src_table }}"
      spreadsheet_url: https://docs.google.com/spreadsheets/d/1EXAMPLE1234567890/edit#gid=0
      worksheet_title: Sheet1
      header_row: 1
      skip_rows: 0
      add_metadata_columns: true
      value_render_option: UNFORMATTED_VALUE
      date_time_render_option: FORMATTED_STRING
      timeout: 60
      max_retries: 3
      rate_limit_delay: 0.2

  sink:
    type: bigquery
    connection_type: vault
    connection_id: bigquery-demo
    vault_path: gcp/demo-project-{{ env_code }}/bq/example-etl-service
    staging:
      schema: stg
    strategy:
      mode: full_refresh
    options:
      log_sample_rows: 5

  bigquery_proxy:
    proxy_enable: true

schemas:
  app:
    tables:
      - worksheet_rows
