# yaml-language-server: $schema=../../src/dpone/schema/etl-batch-manifest.schema.json
kind: dpone.batch.v1
convention: landing_raw_v1

vars:
  src_database: demo_source
  src_system: demo_postgres
  owner_team: data-platform-team
  owner_contact: data-platform@example.com
  sla: "daily"

defaults:
  source:
    type: postgres
    connection_type: vault
    connection_id: postgres-demo
    vault_path: postgres/demo-source
    options:
      batch_size: 100000
      incremental_column: updated_at
      export_format: csv
      compress_export: false
  sink:
    type: postgres
    connection_type: vault
    connection_id: postgres-demo-target
    vault_path: postgres/demo-target
    staging: {schema: stg}
    strategy:
      mode: incremental_merge
      unique_key: id
      merge_policy: delete_insert
  state:
    type: postgres
    connection_id: postgres-demo-target
    connection_type: vault
    vault_path: postgres/demo-target
    table: {schema: etl_state, name: dpone_state}

schemas:
  public:
    tables:
      - orders
