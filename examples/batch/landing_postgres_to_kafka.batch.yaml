# yaml-language-server: $schema=../../src/dpone/schema/etl-batch-manifest.schema.json
kind: dpone.batch.v1
convention: landing_raw_v1

vars:
  host: kafka_example_com
  sla: daily
  owner_contact: data-platform@example.com
  owner_team: data-platform-team
  src_system: demo_kafka
  src_database: demo_topic

defaults:
  source:
    type: postgres
    connection_type: vault
    connection_id: postgres-demo
    vault_path: postgres/demo-source
    table: {schema: public, name: orders}
    options: {batch_size: 100000, export_format: csv}
  sink:
    type: kafka
    connection_type: vault
    connection_id: kafka-demo
    vault_path: kafka/demo
    topic: dwh__orders
    strategy: {mode: incremental_append, unique_key: id}
    options:
      message_format: json
      key: {mode: unique_key}
      delivery: {mode: at_least_once, compression_type: zstd, linger_ms: 20, batch_num_messages: 10000}

schemas:
  public:
    tables: [orders]
