# yaml-language-server: $schema=../../src/dpone/schema/etl-batch-manifest.schema.json
kind: dpone.batch.v1
convention: landing_raw_v1

vars:
  host: kafka_example_com
  sla: daily
  owner_contact: data-platform@example.com
  owner_team: data-platform-team
  src_system: demo_kafka
  src_database: demo_topic

defaults:
  source:
    type: kafka
    connection_type: vault
    connection_id: kafka-demo
    vault_path: kafka/demo
    topic: orders_events
    options: {group_id: dpone.orders.batch, read_mode: offsets, offset_storage: dpone, message_format: json}
  sink:
    type: bigquery
    connection_type: vault
    connection_id: bq-demo-dwh
    vault_path: gcp/demo-dwh/bq/service-account
    table: {schema: landing__demo_kafka__demo_topic, name: kafka__orders_events}
    strategy: {mode: incremental_append}

schemas:
  kafka:
    tables: [orders_events]
