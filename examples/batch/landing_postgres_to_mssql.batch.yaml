# yaml-language-server: $schema=../../src/dpone/schema/etl-batch-manifest.schema.json
kind: dpone.batch.v1
convention: landing_raw_v1

vars:
  src_database: demo_source
  src_system: demo_postgres
  owner_team: data-platform-team
  owner_contact: data-platform@example.com
  sla: "daily"

defaults:
  source:
    type: postgres
    connection_type: vault
    connection_id: postgres-demo
    vault_path: postgres/demo-source
    options:
      batch_size: 100000
      # Public authoring stays portable. The route contract projects this CSV
      # declaration to dpone's internal MSSQL-delimited wire at runtime.
      export_format: csv
      compress_export: false
  sink:
    type: mssql
    connection_type: vault
    connection_id: mssql-demo-dwh
    vault_path: mssql/demo-dwh
    staging: {schema: stg}
    strategy: {mode: full_refresh}
    options:
      bulk:
        mode: bcp
        bcp:
          field_terminator: "\t"
          row_terminator: "\n"
          batch_size: 100000
          packet_size: 65535
  state:
    type: mssql
    connection_id: mssql-demo-dwh
    connection_type: vault
    vault_path: mssql/demo-dwh
    atomicity: target_atomic
    provisioning: external

schemas:
  public:
    tables:
      - orders
