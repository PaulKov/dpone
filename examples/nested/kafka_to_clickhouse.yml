# yaml-language-server: $schema=../../src/dpone/schema/etl-flow-manifest.schema.json
kind: dpone.flow.v1
authoring:
  mode: flow
  source: examples/nested/kafka_to_clickhouse.yml
metadata:
  id: nested_orders_kafka_to_clickhouse
  domain: examples

processes:
  - name: nested_orders_kafka_to_clickhouse
    source:
      type: kafka
      connection_ref: kafka_cluster
      table: {schema: kafka, name: orders_events}
      topic: orders_events
      options:
        group_id: dpone.nested.orders
        message_format: json
        read_mode: offsets
    sink:
      type: clickhouse
      connection_ref: clickhouse_dwh
      table: {schema: landing, name: orders}
      strategy: {mode: incremental_append}
      options:
        sink_type: clickhouse
        nested_fast_path:
          enabled: true
        lineage:
          enabled: true
          preset: hierarchical
        normalization:
          nested:
            enabled: true
            materialization: spill_to_disk
            spill_output_format: json_each_row
            child_snapshot_store:
              enabled: true
              backend: json
              path: .dpone/state/clickhouse_nested_child_snapshots.json
            atomicity:
              mode: eventual_consistency
              on_failure: rollback_staged
            child_quality:
              duplicate_child_key: fail
              orphan_child_rows: fail
            paths:
              debug_blob: ignore
            guardrails:
              max_child_tables: 16
              max_rows_per_root: 10000
              max_array_length: 1000
