services:
  keeper:
    image: clickhouse/clickhouse-server:24.8.14.39
    command: ["clickhouse-keeper", "--config-file=/etc/clickhouse-keeper/keeper.xml"]
    volumes:
      - ./config/keeper/keeper.xml:/etc/clickhouse-keeper/keeper.xml:ro
  node1:
    image: clickhouse/clickhouse-server:24.8.14.39
    hostname: node1
    depends_on: [keeper]
    environment: {CLICKHOUSE_SKIP_USER_SETUP: "1", DPONE_TEST_REPLICA: node1}
    ports: ["127.0.0.1:39100:9000"]
    volumes:
      - ./config/strict-recovery.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
  node2:
    image: clickhouse/clickhouse-server:24.8.14.39
    hostname: node2
    depends_on: [keeper]
    environment: {CLICKHOUSE_SKIP_USER_SETUP: "1", DPONE_TEST_REPLICA: node2}
    ports: ["127.0.0.1:49100:9000"]
    volumes:
      - ./config/strict-recovery.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
  node3:
    image: clickhouse/clickhouse-server:24.8.14.39
    hostname: node3
    depends_on: [keeper]
    environment: {CLICKHOUSE_SKIP_USER_SETUP: "1", DPONE_TEST_REPLICA: node3}
    ports: ["127.0.0.1:59100:9000"]
    volumes:
      - ./config/strict-recovery.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
