dpone_runtime_fixture:
  target: runtime_fixture
  outputs:
    runtime_fixture:
      type: sqlserver
      driver: ODBC Driver 18 for SQL Server
      server: "{{ env_var('DPONE_DBT_FIXTURE_MSSQL_HOST') }}"
      port: "{{ env_var('DPONE_DBT_FIXTURE_MSSQL_PORT', '1433') | int }}"
      database: "{{ env_var('DPONE_DBT_FIXTURE_MSSQL_DATABASE') }}"
      schema: dpone_fixture
      authentication: sql
      user: "{{ env_var('DPONE_DBT_FIXTURE_MSSQL_USER') }}"
      password: "{{ env_var('DPONE_DBT_FIXTURE_MSSQL_PASSWORD') }}"
      encrypt: true
      trust_cert: true
      threads: 1
