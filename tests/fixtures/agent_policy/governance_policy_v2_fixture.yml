schema: dpone.github-governance-policy.v2
schema_version: 2
github_api_version: "2026-03-10"
branch_governance:
  owner: PaulKov
  last_reviewed: "2026-07-18"
  mode: solo_maintainer
  purpose: Fixture for non-live SS-46 governance projection tests.
  ruleset:
    id: 18806829
    version_id: 9001
    name: protect-master
    target: branch
    source_type: Repository
    source: PaulKov/dpone
    enforcement: active
    conditions:
      include:
        - refs/heads/master
      exclude: []
    bypass_actors:
      - actor_id: 1
        actor_type: RepositoryRole
        bypass_mode: always
    pull_request:
      required: true
      allowed_merge_methods:
        - merge
        - squash
      dismiss_stale_reviews_on_push: true
      require_code_owner_review: false
      require_last_push_approval: false
      required_approving_review_count: 0
      required_review_thread_resolution: true
    required_status_checks:
      strict: true
      checks:
        - context: Agent PR receipt
          integration_id: 15368
          producer:
            kind: github_actions_workflow
            workflow_path: .github/workflows/agent-pr-receipt.yml
            workflow_id: 111
        - context: Analyze Python
          integration_id: 15368
          producer:
            kind: github_actions_workflow
            workflow_path: .github/workflows/ci.yml
            workflow_id: 222
    protected_actions:
      block_deletion: true
      block_force_push: true
  owner_attestation:
    required_when_no_independent_reviewer: true
    evidence_required:
      - PR summary states the owner decision.
release_trust:
  repository:
    name_with_owner: PaulKov/dpone
    repository_id: 42
    canonical_remote_url: https://github.com/PaulKov/dpone.git
    protected_base_ref: refs/heads/master
    candidate_workflow_path: .github/workflows/release.yml
  tag_ruleset:
    id: 77
    version_id: 88
    name: protect-release-tags
    target: tag
    source_type: Repository
    source: PaulKov/dpone
    enforcement: active
    conditions:
      include:
        - refs/tags/v*.*.*
      exclude: []
    bypass_actors: []
    protected_actions:
      block_update: true
      block_deletion: true
  trusted_controller:
    repository: PaulKov/dpone-release-controller
    repository_id: 99
    workflow_path: .github/workflows/publish.yml
    workflow_id: 1001
    workflow_sha: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
    github_app_id: 2002
    environments:
      attest: release-attest
      pypi: pypi
      github_release: github-release
  immutable_releases:
    required: true
  publication_control:
    max_pending_attempts_per_release: 32
    lease_ttl_seconds: 300
    lease_renewal_interval_seconds: 60
  pypi:
    index_url: https://pypi.org/
    upload_url: https://upload.pypi.org/legacy/
    projects:
      - dpone
      - dpone-native-accel
      - dpone-airflow-pack
      - apache-airflow-providers-dpone
    trusted_publisher:
      repository_owner: PaulKov
      repository_owner_id: 3003
      repository: dpone-release-controller
      workflow: publish.yml
      environment: pypi
  evidence:
    store_id: fixture-store-1
    pre_mutation_retention_days: 365
    external_commit_retention_days: 2557
    incident_hold_supported: true
