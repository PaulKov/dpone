.uv_job_template:
  image: $UV_IMAGE
  variables:
    UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  cache:
    policy: pull
    key: "uv-${CI_PROJECT_ID}"
    paths:
      - .cache/uv/

.vault_jwt_job_template:
  variables:
    ENV_CODE: "dev"
    VAULT_AUTH_METHOD: "jwt"
    VAULT_AUTH_PATH: "jwt_v2"
  id_tokens:
    VAULT_ID_TOKEN:
      aud: $VAULT_JWT_AUDIENCE

.uv_dev_job_template:
  extends: .uv_job_template
  before_script:
    - set -euxo pipefail
    - uv --version
    - python --version
    - uv sync --group dev

.uv_dev_postgres_job_template:
  extends: .uv_job_template
  before_script:
    - set -euxo pipefail
    - uv --version
    - python --version
    - uv sync --group dev --extra postgres

.uv_dev_clickhouse_job_template:
  extends: .uv_job_template
  before_script:
    - set -euxo pipefail
    - uv --version
    - python --version
    - uv sync --group dev --extra clickhouse

.uv_dev_vault_job_template:
  extends:
    - .uv_job_template
    - .vault_jwt_job_template
  before_script:
    - set -euxo pipefail
    - uv --version
    - python --version
    - |
      test -n "${VAULT_ADDR:-}"
      test -n "${VAULT_ID_TOKEN:-}"
      if [ -z "${VAULT_AUTH_ROLE:-}" ]; then
        case "${ENV_CODE:-dev}" in
          dev)
            test -n "${VAULT_AUTH_ROLE_DEV:-}"
            export VAULT_AUTH_ROLE="${VAULT_AUTH_ROLE_DEV}"
            ;;
          prod)
            test -n "${VAULT_AUTH_ROLE_PROD:-}"
            export VAULT_AUTH_ROLE="${VAULT_AUTH_ROLE_PROD}"
            ;;
          *)
            echo "Unsupported ENV_CODE='${ENV_CODE:-}'. Expected dev or prod." >&2
            exit 1
            ;;
        esac
      fi
      test -n "${VAULT_AUTH_ROLE:-}"
    - python tools/ci/vault_jwt_preflight.py
    - uv sync --group dev --extra vault -P vault-kv-client

