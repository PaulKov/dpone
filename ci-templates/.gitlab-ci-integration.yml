integration_clickhouse_export:
  extends:
    - .uv_dev_clickhouse_job_template
    - .rules_schedule_main_mr_manual
  stage: integration-test
  before_script:
    - set -euxo pipefail
    - uv --version
    - python --version
    - uv sync --group dev --extra clickhouse --extra gcp
  services:
    - name: clickhouse/clickhouse-server:24.8
      alias: clickhouse
    - name: minio/minio:latest
      alias: minio
      command: ["server", "/tmp/minio-data", "--address", ":9001", "--console-address", ":9002"]
      variables:
        MINIO_ROOT_USER: minioadmin
        MINIO_ROOT_PASSWORD: minioadmin
        HEALTHCHECK_TCP_PORT: "9001"
  variables:
    CI_DEBUG_SERVICES: "true"
    CLICKHOUSE_DB: dpone_it
    CLICKHOUSE_USER: default
    CLICKHOUSE_PASSWORD: dpone
    DPONE_RUN_INTEGRATION: "1"
    DPONE_RUN_INTEGRATION_EXTENDED: "1"
    DPONE_IT_CH_HOST: clickhouse
    DPONE_IT_CH_PORT: "9000"
    DPONE_IT_CH_DATABASE: dpone_it
    DPONE_IT_CH_USER: default
    DPONE_IT_CH_PASSWORD: dpone
    DPONE_IT_CH_CONNECT_TIMEOUT: "90"
    DPONE_IT_CH_POLL_INTERVAL: "2"
    DPONE_IT_MINIO_HOST: minio
    DPONE_IT_MINIO_PORT: "9001"
    DPONE_IT_MINIO_INTERNAL_URL: "http://minio:9001"
    DPONE_IT_MINIO_ACCESS_KEY: minioadmin
    DPONE_IT_MINIO_SECRET_KEY: minioadmin
    DPONE_IT_MINIO_BUCKET: dpone-it
  script:
    - |
      set -euo pipefail
      echo "Resolving minio service host"
      getent hosts minio || true
      echo "Probing MinIO on service alias and loopback"
      for _ in $(seq 1 60); do
        curl -fsS http://minio:9001/minio/health/live >/dev/null && break
        curl -fsS http://127.0.0.1:9001/minio/health/live >/dev/null && break
        sleep 1
      done
      curl -fsS http://minio:9001/minio/health/live >/dev/null
      uv run pytest -m integration_extended tests/integration/clickhouse/test_clickhouse_export_integration.py

