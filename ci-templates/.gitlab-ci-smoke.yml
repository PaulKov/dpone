snapshot_installed_integration:
  extends:
    - .uv_job_template
    - .rules_schedule_develop_or_mr_manual
  stage: smoke-test
  needs:
    - job: publish_dev_snapshot
      artifacts: true
  services:
    - name: postgres:16-alpine
      alias: postgres
      command: ["postgres"]
      variables:
        PGDATA: /tmp/postgres-data
        POSTGRES_DB: dpone_it
        POSTGRES_USER: dpone
        POSTGRES_PASSWORD: dpone
        POSTGRES_HOST_AUTH_METHOD: trust
        HEALTHCHECK_TCP_PORT: "5432"
    - name: clickhouse/clickhouse-server:24.8
      alias: clickhouse
  variables:
    CLICKHOUSE_DB: dpone_it
    DPONE_RUN_INTEGRATION: "1"
    DPONE_TEST_USE_INSTALLED_PACKAGE: "1"
    DPONE_IT_PG_HOST: postgres
    DPONE_IT_PG_PORT: "5432"
    DPONE_IT_PG_DATABASE: dpone_it
    DPONE_IT_PG_USER: dpone
    DPONE_IT_PG_PASSWORD: dpone
    DPONE_IT_PG_CONNECT_TIMEOUT: "60"
    DPONE_IT_PG_POLL_INTERVAL: "1"
    DPONE_IT_CH_HOST: clickhouse
    DPONE_IT_CH_PORT: "9000"
    DPONE_IT_CH_DATABASE: dpone_it
    DPONE_IT_CH_USER: default
    DPONE_IT_CH_PASSWORD: ""
    DPONE_IT_CH_CONNECT_TIMEOUT: "90"
    DPONE_IT_CH_POLL_INTERVAL: "2"
  script:
    - |
      set -euo pipefail
      echo "Installed-package integration tests against snapshot package"
      test -n "${DPONE_SNAPSHOT_VERSION:-}"
      test -n "${DPONE_PACKAGE_SPEC:-}"
      echo "Resolving postgres service host"
      getent hosts postgres || true
      python - <<'PY'
      import socket
      import time

      targets = [("postgres", 5432), ("127.0.0.1", 5432)]
      deadline = time.time() + 60
      last_error = None
      while time.time() < deadline:
          for host, port in targets:
              try:
                  with socket.create_connection((host, port), timeout=1):
                      print(f"postgres service is reachable at {host}:{port}")
                      raise SystemExit(0)
              except OSError as exc:
                  last_error = f"{host}:{port} -> {exc}"
          time.sleep(1)
      raise SystemExit(f"PostgreSQL service did not accept TCP connections: {last_error}")
      PY

      python -m venv /tmp/venv
      . /tmp/venv/bin/activate
      pip install --upgrade pip
      pip install pytest "$LIB_NAME[postgres,clickhouse]==$DPONE_SNAPSHOT_VERSION" --index-url "$PACK_REGISTRY" --extra-index-url "$PUBLIC_PYPI_SIMPLE"
      python -m pytest -m "integration and not integration_extended" tests/integration/postgres tests/integration/clickhouse
