install_test:
  extends:
    - .uv_job_template
    - .rules_release_tag
  stage: smoke-test
  script:
    - |
      set -euo pipefail
      TAG_VER="${CI_COMMIT_TAG#v}"
      echo "Smoke-test установки пакета из GitLab Package Registry (release only)"

      python -m venv /tmp/venv
      . /tmp/venv/bin/activate
      pip install --upgrade pip
      pip install "$LIB_NAME==$TAG_VER" --index-url "$PACK_REGISTRY"
      python tools/package_smoke.py --project-root "$CI_PROJECT_DIR"

wheel_smoke_test:
  extends:
    - .uv_job_template
    - .rules_main_and_mr
  stage: smoke-test
  dependencies:
    - build
  script:
    - |
      set -euo pipefail
      echo "Smoke-test установки из wheel (master/develop/MR)"
      ls -la dist

      python -m venv /tmp/venv
      . /tmp/venv/bin/activate
      pip install --upgrade pip
      pip install dist/*.whl
      python tools/package_smoke.py --project-root "$CI_PROJECT_DIR"

snapshot_install_smoke:
  extends:
    - .uv_job_template
    - .rules_develop_or_mr
  stage: smoke-test
  needs:
    - job: publish_dev_snapshot
      artifacts: true
  script:
    - |
      set -euo pipefail
      echo "Smoke-test установки dev snapshot из GitLab Package Registry"
      test -n "${DPONE_SNAPSHOT_VERSION:-}"
      test -n "${DPONE_PACKAGE_SPEC:-}"

      python -m venv /tmp/venv
      . /tmp/venv/bin/activate
      pip install --upgrade pip
      pip install "$DPONE_PACKAGE_SPEC" --index-url "$PACK_REGISTRY"
      python tools/package_smoke.py --project-root "$CI_PROJECT_DIR"

snapshot_runtime_install_smoke:
  extends:
    - .uv_job_template
    - .rules_develop_or_mr
  stage: smoke-test
  needs:
    - job: build
      artifacts: true
    - job: publish_dev_snapshot
      artifacts: true
  script:
    - |
      set -euo pipefail
      echo "Smoke-test dev install mode without image rebuild"
      test -n "${DPONE_SNAPSHOT_VERSION:-}"
      test -n "${DPONE_PACKAGE_SPEC:-}"

      python -m venv /tmp/venv
      . /tmp/venv/bin/activate
      pip install --upgrade pip
      pip install dist/*.whl

      export DPONE_INSTALL_MODE=snapshot
      export DPONE_PACKAGE_SPEC="$DPONE_PACKAGE_SPEC"
      export DPONE_PACKAGE_INDEX_URL="$PACK_REGISTRY"
      export DPONE_PACKAGE_TARGET=/tmp/dpone-runtime-site

      dpone-runtime-exec python tools/package_smoke.py --project-root "$CI_PROJECT_DIR"

snapshot_appsflyer_live_smoke:
  extends:
    - .uv_job_template
    - .vault_jwt_job_template
    - .rules_appsflyer_live_schedule_main_manual
  stage: smoke-test
  needs:
    - job: build
      artifacts: true
    - job: publish_dev_snapshot
      artifacts: true
  script:
    - |
      set -euo pipefail
      echo "Live AppsFlyer smoke via snapshot overlay install"
      test -n "${DPONE_SNAPSHOT_VERSION:-}"
      test -n "${DPONE_IT_AF_APP_IDS:-}"
      test -n "${VAULT_ADDR:-}"
      if [ -z "${VAULT_AUTH_ROLE:-}" ]; then
        case "${ENV_CODE:-dev}" in
          dev)
            test -n "${VAULT_AUTH_ROLE_DEV:-}"
            export VAULT_AUTH_ROLE="${VAULT_AUTH_ROLE_DEV}"
            ;;
          prod)
            test -n "${VAULT_AUTH_ROLE_PROD:-}"
            export VAULT_AUTH_ROLE="${VAULT_AUTH_ROLE_PROD}"
            ;;
          *)
            echo "Unsupported ENV_CODE='${ENV_CODE:-}'. Expected dev or prod." >&2
            exit 1
            ;;
        esac
      fi
      test -n "${VAULT_ID_TOKEN:-}"
      test -n "${VAULT_AUTH_ROLE:-}"
      python tools/ci/vault_jwt_preflight.py

      python -m venv /tmp/venv
      . /tmp/venv/bin/activate
      pip install --upgrade pip
      pip install dist/*.whl

      export DPONE_INSTALL_MODE=snapshot
      export DPONE_PACKAGE_SPEC="${LIB_NAME}[vault,gcp]==${DPONE_SNAPSHOT_VERSION}"
      export DPONE_PACKAGE_INDEX_URL="$PACK_REGISTRY"
      export DPONE_PACKAGE_EXTRA_INDEX_URL="$PUBLIC_PYPI_SIMPLE"
      export DPONE_PACKAGE_EXTRA_INDEX_URLS="https://pypi.org/simple"
      export DPONE_PACKAGE_TARGET=/tmp/dpone-runtime-site
      export DPONE_PROJECT_DIR="$CI_PROJECT_DIR"

      dpone-runtime-exec python tools/appsflyer_live_smoke.py --project-root "$CI_PROJECT_DIR" --mode manifest-run --format json

