schema_version: 1
task_id: "SS-REVIEW-KPO-INIT-FETCH-CONTRACT"
title: "Produce the complete pinned init-fetch deployment contract"
goal: "Emit an executable, secret-free init-fetch projection with a runnable image and structured pack bootstrap."
specification: "docs/feature-design-airflow-kpo-init-fetch-execution-v0731.md"
base_commit: "ef88ae7fbe678b748885eb52868604d5b653d02a"
integrator: "primary Codex task"

acceptance_criteria:
  - "Strict executable init_fetch is emitted only as deployment-set.v2 and airflow-deployment-index.v2."
  - "V1 schemas remain backward-compatible; no strict field is retroactively required."
  - "init_fetch requires runtime_image_ref whose digest equals runtime_image_digest."
  - "Deployment index carries exact release/deployment/workload descriptors with positive bytes and canonical digests."
  - "Registry and trust policy ConfigMap refs are bounded, digest-pinned and secret-free."
  - "The pack exposes structured runtime bootstrap data; init_fetch never depends on parsing inline shell."
  - "local_preview remains compatible and incomplete old init_fetch projections fail migration-required."
  - "Both generated JSON Schema and Python validation reject unknown or secret-bearing contract fields."

public_contract_impact:
  level: compatible
  surfaces: ["deployment-set", "airflow deployment index", "airflow pack", "runtime artifact delivery"]
  migration_required: true

