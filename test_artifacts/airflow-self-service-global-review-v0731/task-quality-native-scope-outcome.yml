schema_version: 1
task_id: "DPONE-QUALITY-NATIVE-SCOPE-OUTCOME"
title: "Evaluate quality gates over the native logical workload and preserve post-commit outcomes"
goal: "Eliminate false quality evidence on native resume/retry and stop public failures from replacing real post-commit counters with synthetic zeros."
specification: "docs/feature-design-quality-acceptance-fail-closed-v0731.md"
base_commit: "ef88ae7f"
integrator: "Codex main agent"

acceptance_criteria:
  - "Native quality scope is derived from planned, active, matching committed skipped, and deliberately reactivated partition identities."
  - "All-skipped resume evaluates matching committed source and target rows and never calls the sink."
  - "Partial retry combines committed skipped rows and current active rows; mixed full_refresh never double-counts reactivated partitions."
  - "Missing, stale, boolean, string, or negative contributing row counts make the aggregate unavailable instead of coercing or falling back."
  - "Logical-scope counts do not overwrite attempt-local LoadResult counters, and no aggregate typed hash is invented."
  - "Scope evidence exposes only a stable digest and aggregate counts, never raw partition identities, bounds, row data, SQL, credentials, or paths."
  - "Staged, legacy, and resume-only coordinators attach one typed QualityGateReceipt; processor execution remains exactly once."
  - "StagedQualityGateReceipt and report_from_staged_quality_receipt remain compatible facades."
  - "A quality failure after sink mutation carries a typed QualityGateFailureOutcome with actual safe counters, boundary, target/checkpoint/source state, retry classification, and attempts."
  - "Native post-commit failure preserves COMMITTED checkpoints and retries through sink-free resume validation."
  - "CLI JSON renders actual safe counters and additive failure_context for an enriched failure while preserving quality_gates, stable error code, redaction, and old-constructor behavior."

public_contract_impact:
  level: compatible
  surfaces:
    - "quality gate runtime receipt"
    - "native resume and retry quality semantics"
    - "QualityGateFailure optional typed outcome"
    - "dpone run structured failure output"
  migration_required: false

