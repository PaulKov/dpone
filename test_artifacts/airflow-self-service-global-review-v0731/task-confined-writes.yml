schema_version: 1
task_id: "SS-REVIEW-CONFINED-WRITES"
title: "Confine and CAS-guard self-service authoring writes"
goal: "Prevent external-path writes, symlink escapes, concurrent overwrite, unsafe rollback, and secret-bearing diffs."
specification: "test_artifacts/airflow-self-service-global-review-v0731/review-contract.md"
base_commit: "ef88ae7fbe678b748885eb52868604d5b653d02a"
integrator: "primary Codex task"

acceptance_criteria:
  - "fix rejects absolute/outside-root and symlink targets."
  - "scaffold rejects symlink path components."
  - "create/apply detects concurrent writes and does not overwrite them."
  - "rollback removes only bytes created by the same operation."
  - "conflict diffs are bounded and redacted."

public_contract_impact:
  level: compatible
  surfaces: ["init scaffold apply", "dpone fix apply", "conflict JSON"]
  migration_required: false

owned_paths:
  - "src/dpone/readiness/airflow_pipeline_source.py"
  - "src/dpone/readiness/airflow_scaffold_apply.py"
  - "src/dpone/readiness/airflow_authoring_fix.py"
  - "tests/test_airflow_self_service_security.py"
read_only_paths:
  - "src/dpone/manifest/authoring_migration_io.py"
  - "src/dpone/security_redaction.py"
  - "tests/test_airflow_self_service_cli.py"
forbidden_paths:
  - "pyproject.toml"
  - "uv.lock"
  - "CHANGELOG.md"
  - "mkdocs.yml"
  - ".github/workflows"

shared_file_owner: "integrator"
dependencies: []
required_checks:
  focused:
    - "uv run pytest tests/test_airflow_self_service_security.py -q"
    - "uv run pytest tests/test_airflow_self_service_cli.py -q"
  broad:
    - "uv run pytest tests/test_airflow_self_service_security.py tests/test_airflow_self_service_cli.py -q"
  live: []
required_outputs: [implementation, tests, documentation_impact, completion_report]
completion_statuses:
  allowed: [PASS, FAIL, SKIP, N/A, UNVERIFIED]
stop_conditions:
  - "Required edit falls outside owned_paths."
  - "Approved specification is missing or contradicted."
  - "Public-contract impact is larger than declared."
  - "A live check requires unapproved credentials or environment."
  - "Another writer owns the same semantic contract."
