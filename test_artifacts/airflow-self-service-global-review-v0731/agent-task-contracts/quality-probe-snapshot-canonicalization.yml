schema_version: 1
task_id: "SS-74"
title: "Canonical quality probe snapshot validation"
goal: >
  Prevent malformed row counts or typed hashes from producing a passed quality
  receipt whose safe evidence later drops the invalid metric.
specification: >
  Release-blocking correctness finding from the fresh quality review.
  QualityProbeSnapshot is the single typed boundary: explicit invalid values
  fail immediately, while values discovered from untyped runtime results are
  normalized to unavailable before the snapshot is created.
base_commit: "ef88ae7fbe678b748885eb52868604d5b653d02a"
integrator: "parent Codex agent"

acceptance_criteria:
  - "row_count accepts only non-negative int or None and rejects bool."
  - "typed_hash accepts only a non-empty string or None."
  - "Explicit malformed snapshots cannot reach QualityGateRunner."
  - "Malformed values read from runtime results normalize to unavailable and fail relevant gates closed."
  - "A passed report never loses a required row/hash metric during safe evidence projection."

public_contract_impact:
  level: compatible_correctness_fix
  surfaces:
    - QualityProbeSnapshot Python contract
    - quality gate receipt evidence
  migration_required: false

owned_paths:
  - src/dpone/governance/quality.py
  - src/dpone/runtime/governance/service.py
  - tests/test_quality_probe_snapshot_validation.py
read_only_paths:
  - src/dpone/runtime/governance/quality_execution_support.py
  - docs/feature-design-quality-acceptance-fail-closed-v0731.md
  - docs/feature-design-quality-checks-gates-adapter-v1.md
forbidden_paths:
  - src/dpone/runtime/native_transfer_quality_scope.py
  - src/dpone/runtime/native_transfer_artifacts.py
  - src/dpone/schema
  - docs
  - pyproject.toml
  - uv.lock
  - CHANGELOG.md
  - mkdocs.yml
  - .github/workflows

shared_file_owner: "parent Codex agent"

required_checks:
  focused:
    - "uv run pytest tests/test_quality_probe_snapshot_validation.py tests/test_quality_checks_gates_adapter.py tests/test_quality_gate_receipt_binding.py -q"
  broad:
    - "uv run ruff check <owned Python paths>"
    - "uv run ruff format --check <owned Python paths>"
    - "uv run mypy --config-file mypy.ini <owned source paths>"
  live:
    - "N/A: pure validation and mocked runtime result boundaries."

stop_conditions:
  - "A fix silently converts bool, float, string, mapping, or list to a valid metric."
  - "A fix changes native checkpoint/state shape."
  - "Another writer owns the same path."
