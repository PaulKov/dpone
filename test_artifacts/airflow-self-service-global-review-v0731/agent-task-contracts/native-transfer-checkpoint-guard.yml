schema_version: 1
task_id: "AIRFLOW-SS-37"
title: "Fail-closed native-transfer checkpoint guard"
goal: >
  Prevent automatic target replay after an armed or partially committed
  native-transfer checkpoint batch while preserving the primary exception and
  existing checkpoint/store schemas.
specification: "docs/feature-design-native-transfer-checkpoint-guard-v0732.md"
base_commit: "ef88ae7fbe678b748885eb52868604d5b653d02a"
integrator: "Codex parent"

acceptance_criteria:
  - "The complete armed checkpoint batch is durable before any target mutation."
  - "Unresolved or malformed route guards stop retries before sink I/O."
  - "Partial committed batches never downgrade exact durable commits or become ordinary automatic retries."
  - "Secondary reconciliation and marker failures never replace the original exception."
  - "One injected timestamp is used for each terminal checkpoint transition batch."
  - "Legacy checkpoints without a guard and failed_before_target remain retryable."
  - "No checkpoint status, serializer, store port, SQL schema or public connector API changes."

public_contract_impact:
  level: compatible
  surfaces:
    - native-transfer checkpoint diagnostics
    - native-transfer resume behavior
  migration_required: true

owned_paths:
  - src/dpone/runtime/native_transfer_checkpoint_lifecycle.py
  - src/dpone/runtime/native_transfer.py
  - src/dpone/runtime/native_transfer_plan_runtime.py
  - src/dpone/runtime/etl/payload_loader.py
  - src/dpone/runtime/governance/finalization.py
  - src/dpone/runtime/governance/legacy_acceptance.py
  - src/dpone/runtime/lineage/partition_resume.py
  - tests/test_native_transfer_checkpoint_partial_batch_failure.py
  - tests/test_native_transfer_checkpoint_guard.py
  - tests/test_native_transfer_runtime_service.py
  - tests/test_native_load_governance_finalization.py
  - tests/test_etl_processor_native_transfer_resume.py
read_only_paths:
  - docs/feature-design-native-transfer-checkpoint-guard-v0732.md
  - docs/feature-design-target-commit-terminal-failures.md
  - docs/adr/0022-target-commit-terminal-failures.md
  - src/dpone/runtime/lineage/partition_checkpoint.py
  - src/dpone/runtime/lineage/partition_checkpoint_store.py
forbidden_paths:
  - pyproject.toml
  - uv.lock
  - CHANGELOG.md
  - mkdocs.yml
  - .github/workflows
  - .codex/config.toml
  - docs/feature-design-airflow-pipeline-first-ux-p2.md

shared_file_owner: "integrator"

dependencies:
  - "Approved target-commit guard specification"
  - "ADR 0022 remains Proposed and explicitly out of scope"
required_checks:
  focused:
    - "uv run pytest tests/test_native_transfer_checkpoint_guard.py tests/test_native_transfer_checkpoint_partial_batch_failure.py -q"
    - "uv run pytest tests/test_native_transfer_runtime_service.py tests/test_native_load_governance_finalization.py tests/test_etl_processor_native_transfer_resume.py -q"
    - "uv run ruff check src/dpone/runtime/native_transfer_checkpoint_lifecycle.py src/dpone/runtime/native_transfer.py src/dpone/runtime/native_transfer_plan_runtime.py src/dpone/runtime/etl/payload_loader.py src/dpone/runtime/governance/finalization.py src/dpone/runtime/governance/legacy_acceptance.py src/dpone/runtime/lineage/partition_resume.py tests/test_native_transfer_checkpoint_guard.py tests/test_native_transfer_checkpoint_partial_batch_failure.py"
  broad:
    - "uv run python tools/agent_policy/select_checks.py --base-ref origin/master"
  live: []

required_outputs:
  - implementation
  - tests
  - documentation_impact
  - completion_report

completion_statuses:
  allowed:
    - PASS
    - FAIL
    - SKIP
    - N/A
    - UNVERIFIED

stop_conditions:
  - "Required edit falls outside owned_paths."
  - "Approved specification is missing or contradicted."
  - "Public-contract impact is larger than declared."
  - "Another writer owns the same semantic contract."
  - "A checkpoint schema/status/store migration appears necessary."
  - "A live check requires unapproved credentials or environment."
