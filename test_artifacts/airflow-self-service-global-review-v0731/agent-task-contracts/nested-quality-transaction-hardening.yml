  - src/dpone/runtime/etl/extracted_payload_load.py
  - src/dpone/runtime/etl/payload_loader.py
  - src/dpone/runtime/etl/nested_load.py
  - src/dpone/runtime/normalization/load_package.py
  - tests/test_nested_normalization_contracts.py
  - tests/test_nested_normalization_industrial_layer.py
  - tests/test_nested_normalization_spill.py
  - tests/test_nested_normalization_spill_large.py
read_only_paths:
