schema_version: 1
task_id: "SS-56"
title: "Nested load quality authority and failure preservation"
goal: >
  Fix the reproduced nested-normalization regression so a package of root and
  child tables has one correctly scoped quality/commit authority, cannot mutate
  only the root and then fail by replaying an already-consumed authority, and
  never masks the primary failure while recording audit state.
specification: >
  Isolated release-blocking bug fix. Impact and validation plan are captured in
  test_artifacts/airflow-self-service-global-review-v0731/review-report.md under
  SS-55 and in this task contract. No new public DSL or architecture is allowed.
base_commit: "ef88ae7fbe678b748885eb52868604d5b653d02a"
integrator: "parent Codex agent"

acceptance_criteria:
  - "Existing nested-normalization positive contracts pass for root plus child tables."
  - "Quality authority is scoped and consumed exactly once at the nested package mutation boundary."
  - "A child-table failure cannot leave an unaudited partial success or cause root duplication on retry."
  - "Inert and non-empty quality policies behave deterministically for in-memory and spill paths."
  - "The real LoadIdentityService.mark_failed(record, exc) signature is honored and the primary exception is preserved."
  - "Tests use signature-exact spies or the real service; permissive mocks must not hide API mismatches."

public_contract_impact:
  level: compatible
  surfaces:
    - nested normalization runtime ordering
    - quality gate receipt scope
    - audit failure semantics
    - retry and replay behavior
  migration_required: false

owned_paths:
