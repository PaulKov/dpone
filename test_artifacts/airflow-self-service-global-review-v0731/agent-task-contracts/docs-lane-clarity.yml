schema_version: 1
task_id: "AIRFLOW-SS-35"
title: "Make the beginner and operator Airflow lanes truthful"
goal: >
  Correct the reviewed documentation contradictions between local preview,
  local safe-sample handoff, strict-v2 executable rehearsal, production parse
  canary and production certification without changing runtime behavior.
specification: "docs/airflow-self-service-architecture.md"
base_commit: "ef88ae7fbe678b748885eb52868604d5b653d02a"
integrator: "Codex parent"

acceptance_criteria:
  - "The first-four-command offline preview is distinguished from the platform-enabled fifth safe-run command."
  - "No page calls a deployment production runnable when attestation/runtime certification is unavailable."
  - "Preview v1 and strict executable v2 use consistent terminology."
  - "Candidate installation examples pin version 0.73.2 and the documented evidence path matches CLI behavior."
  - "Certification UNVERIFIED exit semantics are consistent with CLI tests."
  - "The indexed-v2 path is the default self-service plane; the runner-pack path is labeled advanced/legacy compatibility."
  - "Focused docs contract tests prevent the corrected claims from drifting."

public_contract_impact:
  level: none
  surfaces:
    - documentation
  migration_required: false

owned_paths:
  - docs/getting-started/first-airflow-dag.md
  - docs/airflow-self-service-architecture.md
  - docs/runtime-image.md
  - docs/airflow-cache-sync.md
  - docs/airflow-provider-cache-migration.md
  - docs/airflow-self-service-evidence.md
  - docs/airflow-self-service.md
  - docs/managed-ux.md
  - docs/gitops-airflow-runner-pack.md
  - docs/errors/DPONE_SAFE_SAMPLE_CERTIFIED_COPY_EXECUTOR_NOT_CONFIGURED.md
  - tests/test_docs_language_contracts.py
  - tests/test_release_smoke_contracts.py
read_only_paths:
  - docs/airflow-pack-provider.md
  - docs/cli-reference.md
  - packages/apache-airflow-providers-dpone/README.md
  - tests/test_airflow_self_service_cli.py
  - tests/test_self_service_certification.py
forbidden_paths:
  - src
  - packages
  - pyproject.toml
  - uv.lock
  - CHANGELOG.md
  - mkdocs.yml
  - .github/workflows
  - .codex/config.toml

shared_file_owner: "integrator"

dependencies:
  - "Fresh docs/UX review from Curie the 2nd"
required_checks:
  focused:
    - "uv run pytest tests/test_docs_language_contracts.py tests/test_release_smoke_contracts.py -q"
  broad:
    - "uv run dpone docs check-docs"
    - "uv run mkdocs build --strict"
  live: []

required_outputs:
  - implementation
  - tests
  - documentation_impact
  - completion_report

completion_statuses:
  allowed:
    - PASS
    - FAIL
    - SKIP
    - N/A
    - UNVERIFIED

stop_conditions:
  - "Required edit falls outside owned_paths."
  - "Approved specification is missing or contradicted."
  - "A documentation correction would require changing runtime behavior."
  - "Public-contract impact is larger than declared."
  - "A live check requires unapproved credentials or environment."
  - "Another writer owns the same semantic contract."
