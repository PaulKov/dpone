schema_version: 1
task_id: "SS-71"
title: "Strict resolved endpoint factory isolation"
goal: >
  Keep strict-v2 source and sink construction independent from the legacy
  ambient CredentialsManager while preserving the deprecated legacy factory
  API for explicit compatibility mode.
specification: >
  Release-blocking dependency-injection defect under approved ADR 0027.
  Strict endpoint construction consumes only ResolvedBindingConnection values
  from the runtime composition root. Legacy credential discovery remains lazy
  and is reachable only through the explicit legacy create methods.
base_commit: "ef88ae7fbe678b748885eb52868604d5b653d02a"
integrator: "parent Codex agent"

acceptance_criteria:
  - "Strict source and sink construction never imports the legacy connector factory."
  - "Importing legacy factories does not instantiate CredentialsManager."
  - "SourceFactory.create_resolved and SinkFactory.create_resolved remain compatible facades."
  - "Legacy create methods instantiate CredentialsManager only on first explicit use."
  - "Resolved endpoint construction performs no credential discovery."

public_contract_impact:
  level: compatible
  surfaces:
    - strict runtime endpoint composition
    - legacy SourceFactory and SinkFactory Python API
  migration_required: false

owned_paths:
  - src/dpone/runtime/bootstrap_sources_sinks.py
  - src/dpone/runtime/credentials/connector_factory.py
  - src/dpone/runtime/credentials/factory.py
  - src/dpone/runtime/credentials/resolved_endpoint_factory.py
  - tests/test_runtime_connection_composition_root.py
read_only_paths:
  - docs/adr/0027-single-runtime-connection-authority.md
  - docs/feature-design-runtime-connection-authority-and-hygiene-v0732.md
forbidden_paths:
  - pyproject.toml
  - uv.lock
  - CHANGELOG.md
  - mkdocs.yml
  - .github/workflows

shared_file_owner: "parent Codex agent"

required_checks:
  focused:
    - "uv run pytest tests/test_runtime_connection_composition_root.py tests/test_runtime_api_resolved_factory.py -q"
  broad:
    - "uv run ruff check <owned Python paths>"
    - "uv run ruff format --check <owned Python paths>"
    - "uv run mypy --config-file mypy.ini <owned source paths>"
  live:
    - "N/A: connector instances are replaced by test doubles; no approved live route is required."

stop_conditions:
  - "A fix changes legacy credential resolution behavior."
  - "A fix performs credential discovery outside the runtime composition root."
  - "Another writer owns the same path."
