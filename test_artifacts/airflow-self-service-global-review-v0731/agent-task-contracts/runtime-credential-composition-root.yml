schema_version: 1
task_id: "SS-55B"
title: "Runtime credential composition root and connector authority"
goal: >
  Make normal dpone run consume the verified strict-v2 runtime connection
  context and construct source, sink, API, and state capabilities from one
  workload-scoped resolver before any data I/O.
specification: >
  Implement the APPROVED runtime-connection authority specification and ADR
  0027 on top of SS-55A's six-artifact handoff. Strict indexed-v2 must never
  fall back to legacy connection_id, connection_type, vault_path, ambient
  CredentialsManager, or a default Vault reader.
base_commit: "ef88ae7fbe678b748885eb52868604d5b653d02a"
integrator: "parent Codex agent"

acceptance_criteria:
  - "DPONE_RUNTIME_CONNECTION_CONTEXT is loaded no-follow, bounded, schema/checksum validated, and confined to the verified init-fetch worktree."
  - "One WorkloadScopedCredentialResolver is constructed per workload execution from exact binding-set, registry, and credential-runtime snapshots."
  - "Every unique required source, sink, API, and state connection_ref is resolved and typed before source/sink/state I/O."
  - "Canonical plus legacy authority for the same capability fails with DPONE_RUNTIME_CONNECTION_AUTHORITY_CONFLICT before I/O."
  - "Strict-v2 canonical-only manifests build runtime endpoints successfully without connection_id, connection_type, or vault_path."
  - "Strict-v2 never invokes _default_vault_kv_reader, CredentialsManager, Airflow BaseHook, or environment credential discovery."
  - "Endpoint/API/state factories accept immutable ResolvedBindingConnection or CredentialsConfig through explicit dependency injection."
  - "Local legacy execution remains explicit-only for the documented compatibility window and emits one deprecation warning per process."
  - "Resolution receipts expose only connection_ref, resolver and safe version metadata; secrets and registry/Vault topology remain absent."
  - "An end-to-end test covers index projection through init-fetch/launcher context into dpone run, hydrator, and mocked connector construction."

public_contract_impact:
  level: compatible
  surfaces:
    - dpone run runtime hydration
    - strict-v2 connection authority
    - source/sink/API/state factory dependency injection
    - credential resolution evidence
  migration_required: false

