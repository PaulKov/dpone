acceptance_criteria:
  - "Choose one DRY migration for the existing governance policy and cover every current consumer atomically."
  - "Define bounded stable governance snapshots A, B, and closure C with start/end metadata and coherent protected-base ancestry semantics."
  - "Select a trusted privileged composition root outside candidate-controlled code and publish an exact job/permission/input/output matrix."
  - "Acquire publication serialization before the first provider mutation and define queue, cancellation, recovery, candidate, authorization, and attempt identities."
  - "Define schema-complete append-only receipt envelopes, canonical domain-separated IDs, producer tagged unions, durable store, retention, and incident hold."
  - "Use AUTHORIZED before publication and reserve final PASS for CLOSED."
  - "Require Trusted Publisher plus Integrity API provenance for v2 closure; token bootstrap is LEGACY_UNVERIFIED only."
  - "Make draft staging depend on verified deterministic public bundle/attestation handoff."
  - "Clarify provider-exact GitHub immutable release semantics and preserve/deprecate every existing supply-chain artifact explicitly."
  - "Use only valid feature lifecycle vocabulary; live IDs remain UNVERIFIED and block policy activation, not design review."

