schema_version: 1
task_id: "SS-55A"
title: "Carry pinned runtime credential context through indexed-v2 init-fetch"
goal: >
  Close the first half of the confirmed production credential-authority gap by
  materializing binding-set, connection-registry, and credential-runtime as
  exact immutable artifacts, carrying their descriptors through the provider
  wire and runtime init-fetch plan, verifying all six artifacts, and exposing
  one provider-owned verified runtime-context path to dpone run.
specification: "docs/feature-design-runtime-connection-authority-and-hygiene-v0732.md"
base_commit: "ef88ae7fbe678b748885eb52868604d5b653d02a"
integrator: "parent Codex thread 019f75e3-7590-72c1-8a56-4221c1b87d9a"

acceptance_criteria:
  - "Indexed-v2 deployment output contains exact descriptors and immutable snapshots for binding-set, connection-registry, and credential-runtime."
  - "The provider delivery context and runtime init-fetch plan preserve all three descriptors without exposing registry or Vault locator bodies in serialized DAG metadata."
  - "Init-fetch downloads and verifies exactly deployment, release, workload pack, binding-set, connection-registry, and credential-runtime by pinned digest; it never downloads current."
  - "The ready receipt binds all six artifact digests to the pinned release/deployment identity."
  - "The verified launcher exposes only one non-secret provider-owned path to the verified runtime connection context."
  - "A missing, mismatched, unpinned, extra, or replaced credential-context artifact fails closed before dpone run."
  - "Legacy .ref projection files remain readable for the approved one-minor compatibility window but are not accepted as strict-v2 runtime authority."
  - "Focused tests prove the index-to-plan-to-receipt-to-launcher handoff and preserve all existing init-fetch tests."

public_contract_impact:
  level: compatible
  surfaces:
    - "dpone.deployment-set.v2 generated artifacts"
    - "dpone.airflow-deployment-index.v2"
    - "dpone.airflow-init-fetch-plan.v1"
    - "dpone.airflow-init-fetch-ready.v1"
    - "verified runtime launcher environment"
  migration_required: false

