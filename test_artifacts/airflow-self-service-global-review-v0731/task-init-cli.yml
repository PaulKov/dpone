schema_version: 1
task_id: "SS-REVIEW-INIT-CLI"
title: "Reject target-inapplicable init options before side effects"
goal: "Give project, pipeline, and legacy init distinct parser surfaces without breaking legacy init."
specification: "test_artifacts/airflow-self-service-global-review-v0731/review-contract.md"
base_commit: "ef88ae7fbe678b748885eb52868604d5b653d02a"
integrator: "primary Codex task"

acceptance_criteria:
  - "Project/pipeline reject irrelevant options with argparse exit 2 before writes."
  - "Pipeline name is parser-required."
  - "Legacy dpone init options remain accepted when no beginner target is selected."

public_contract_impact:
