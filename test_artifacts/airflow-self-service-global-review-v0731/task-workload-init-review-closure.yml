schema_version: 1
task_id: "SS-REVIEW-WORKLOAD-INIT-CLOSURE"
title: "Close workload-init rollback, symlink, and catalog ownership defects"
goal: "Make workload init plan-first, non-destructive, and truthful when several compensations fail."
specification: "docs/feature-design-self-service-filesystem-transactions-v0731.md"
base_commit: "ef88ae7fbe678b748885eb52868604d5b653d02a"
integrator: "primary Codex task"

acceptance_criteria:
  - "Rollback continues after each individual compensation failure."
  - "Every issue and recovery artifact is present in the unit-of-work receipt."
  - "A workload-set symlink conflicts before all mutations."
  - "An exact existing DAG declaration is a no-op and any difference is a conflict."
  - "User schedule, owner, retries, timezone, workloads, and unknown fields are never implicitly overwritten."

public_contract_impact:
  level: compatible
  surfaces: ["dpone workload init", "scaffold receipt", "domain catalog merge"]
  migration_required: false

owned_paths:
  - "src/dpone/readiness/airflow_scaffold_apply.py"
  - "src/dpone/readiness/workload_init_service.py"
  - "src/dpone/readiness/workload_init_catalog_merge.py"
  - "src/dpone/readiness/workload_init_unit_of_work.py"
  - "src/dpone/readiness/workload_init_*.py"
  - "tests/test_workload_init_cli.py"
  - "tests/test_workload_init_transaction_recovery.py"
read_only_paths:
  - "src/dpone/manifest/confined_files.py"
  - "src/dpone/manifest/confined_mutations.py"
  - "src/dpone/readiness/workload_init_catalog_storage.py"
forbidden_paths:
  - "src/dpone/manifest"
  - "docs"
  - "pyproject.toml"
  - "uv.lock"
  - "CHANGELOG.md"
  - "mkdocs.yml"
  - ".github/workflows"

shared_file_owner: "integrator"
dependencies: []
required_checks:
  focused:
    - "uv run pytest tests/test_workload_init_cli.py tests/test_workload_init_transaction_recovery.py -q"
  broad:
    - "uv run dpone docs check-import-rules"
    - "uv run dpone docs check-module-size --baseline docs/module_size_baseline.json"
  live: []
required_outputs: [implementation, tests, documentation_impact, completion_report]
completion_statuses:
  allowed: [PASS, FAIL, SKIP, N/A, UNVERIFIED]
stop_conditions:
  - "Required edit falls outside owned_paths."
  - "Approved specification is missing or contradicted."
  - "Public-contract impact is larger than declared."
  - "A shared storage primitive change is required."
  - "A live check requires unapproved credentials or environment."
  - "Another writer owns the same semantic contract."
