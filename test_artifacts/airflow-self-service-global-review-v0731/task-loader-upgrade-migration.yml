schema_version: 1
task_id: "SS-REVIEW-LOADER-UPGRADE-MIGRATION"
title: "Migrate dpone-owned generated loaders to fatal index guard"
goal: "Prevent existing generated dags/dpone.py files from silently loading zero DAGs after a fatal index error."
specification: "test_artifacts/airflow-self-service-global-review-v0731/review-contract.md"
base_commit: "ef88ae7fbe678b748885eb52868604d5b653d02a"
integrator: "primary Codex task"

acceptance_criteria:
  - "Known legacy dpone-owned loader fingerprints receive an idempotent plan/apply upgrade."
  - "User-modified loader files remain conflicts and are never overwritten."
  - "Missing/corrupt index after upgrade raises during DAG import."
  - "Fresh scaffold and upgraded scaffold share one canonical template."
  - "Migration behavior is covered in CLI tests and architecture ADR text."

public_contract_impact:
  level: compatible
  surfaces: ["dags/dpone.py generated loader", "dpone init project rerun"]
  migration_required: true

owned_paths:
  - "src/dpone/readiness/airflow_self_service_templates.py"
  - "src/dpone/readiness/airflow_self_service.py"
  - "tests/test_airflow_self_service_cli.py"
  - "docs/adr/0008-airflow-parse-safe-provider.md"
read_only_paths:
  - "src/dpone/readiness/airflow_scaffold_apply.py"
  - "packages/dpone-airflow-pack/src/dpone_airflow_pack/dag_loader.py"
  - "docs/getting-started/first-airflow-dag.md"
forbidden_paths:
  - "pyproject.toml"
  - "uv.lock"
  - "CHANGELOG.md"
  - "mkdocs.yml"
  - ".github/workflows"

shared_file_owner: "integrator"
dependencies: ["SS-REVIEW-PROVIDER-PARSE-HARDENING"]
required_checks:
  focused:
    - "uv run pytest tests/test_airflow_self_service_cli.py -q"
  broad:
    - "uv run pytest tests/test_airflow_self_service_cli.py tests/test_airflow_dag_loader.py -q"
  live: []
required_outputs: [implementation, tests, documentation_impact, completion_report]
completion_statuses:
  allowed: [PASS, FAIL, SKIP, N/A, UNVERIFIED]
stop_conditions:
  - "A user-modified loader would need to be overwritten."
  - "Required edit falls outside owned_paths."
  - "Approved specification is missing or contradicted."
  - "Public-contract impact is larger than declared."
  - "A live check requires unapproved credentials or environment."
  - "Another writer owns the same semantic contract."
