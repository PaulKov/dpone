schema_version: 1
task_id: "SS-REVIEW-RECOVERY-EVIDENCE"
title: "Expose no-clobber recovery outcomes"
goal: "Make scaffold/fix receipts truthful and preserve a discoverable recovery path whenever rollback cannot restore a pathname."
specification: "test_artifacts/airflow-self-service-global-review-v0731/review-contract.md"
base_commit: "ef88ae7fbe678b748885eb52868604d5b653d02a"
integrator: "primary Codex task"

acceptance_criteria:
  - "Confined rollback returns a structured removed/preserved/recovery outcome."
  - "A concurrent winner is never overwritten or deleted."
  - "Recovery artifact path is surfaced through structured error/receipt data."
  - "Partial scaffold failure marks prior work rolled back/preserved and remaining work not applied."
  - "Retry preserves both winner and recovery bytes."

public_contract_impact:
  level: compatible
  surfaces: ["dpone fix errors", "scaffold change receipt", "rollback journal"]
  migration_required: false

owned_paths:
  - "src/dpone/manifest/confined_mutations.py"
  - "src/dpone/manifest/authoring_migration_io.py"
  - "src/dpone/readiness/airflow_pipeline_source.py"
  - "src/dpone/readiness/airflow_scaffold_apply.py"
  - "src/dpone/readiness/airflow_authoring_fix.py"
  - "tests/test_authoring_filesystem_transactions.py"
  - "tests/test_airflow_self_service_security.py"
read_only_paths:
  - "src/dpone/readiness/airflow_self_service_models.py"
  - "docs/schemas/gitops/scaffold-rollback-journal.schema.json"
forbidden_paths:
  - "pyproject.toml"
  - "uv.lock"
  - "CHANGELOG.md"
  - "mkdocs.yml"
  - ".github/workflows"

shared_file_owner: "integrator"
dependencies: ["SS-REVIEW-CONFINED-WRITES"]
required_checks:
  focused:
    - "uv run pytest tests/test_authoring_filesystem_transactions.py tests/test_airflow_self_service_security.py -q"
  broad:
    - "uv run pytest tests/test_airflow_self_service_cli.py tests/test_authoring_filesystem_transactions.py tests/test_airflow_self_service_security.py -q"
  live: []
required_outputs: [implementation, tests, documentation_impact, completion_report]
completion_statuses:
  allowed: [PASS, FAIL, SKIP, N/A, UNVERIFIED]
stop_conditions:
  - "Required edit falls outside owned_paths."
  - "Approved specification is missing or contradicted."
  - "Public-contract impact is larger than declared."
  - "A live check requires unapproved credentials or environment."
  - "Public-contract impact becomes breaking."
  - "Another writer owns the same semantic contract."
