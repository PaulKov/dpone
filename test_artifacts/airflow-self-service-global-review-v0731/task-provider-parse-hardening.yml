schema_version: 1
task_id: "SS-REVIEW-PROVIDER-PARSE-HARDENING"
title: "Enforce cache-only bounded Airflow deployment parsing"
goal: "Close provider parse-boundary escapes, collision precedence defects, unbounded pack reads, false fallback success, and invalid SLO evidence."
specification: "test_artifacts/airflow-self-service-global-review-v0731/review-contract.md"
base_commit: "ef88ae7fbe678b748885eb52868604d5b653d02a"
integrator: "primary Codex task"

acceptance_criteria:
  - "Deployment-index DAG nodes can consume only cached:// workload refs selected by the pinned index."
  - "Raw paths remain available only on the explicit legacy repo-root path."
  - "Diagnostic handling never overwrites an occupied DAG id."
  - "Duplicate policy is decided before invalid handling can replace or misclassify an existing DAG."
  - "Index and pack byte limits are checked before full reads or hashes."
  - "Dependency-light fallback construction remains possible but execute fails closed."
  - "The 100 DAG / 500 workload SLO fixture is fingerprinted, cache-only, runnable, and loads all DAGs."

public_contract_impact:
  level: compatible
  surfaces: ["Airflow deployment-index loader", "duplicate/invalid policies", "pack parse limits"]
  migration_required: false

