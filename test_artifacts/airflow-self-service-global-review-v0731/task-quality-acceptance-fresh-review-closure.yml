schema_version: 1
task_id: "SS-REVIEW-QUALITY-ACCEPTANCE-FRESH-CLOSURE"
title: "Close acceptance snapshot and native checkpoint/report findings"
goal: "Prevent false acceptance evidence, premature success reports and committed checkpoint downgrades."
specification: "docs/feature-design-quality-acceptance-fail-closed-v0731.md"
base_commit: "ef88ae7fbe678b748885eb52868604d5b653d02a"
integrator: "primary Codex task"

acceptance_criteria:
  - "Explicit metric selectors are validated independently against source, staged and target schemas."
  - "Every probe result is rebuilt into one canonical request-owned snapshot."
  - "Required incomplete, negative, boolean, warning-bearing or malformed snapshots fail closed."
  - "Probe-controlled dataset, kind, columns, warnings and extra metric keys never enter durable evidence."
  - "Native prepare never publishes a passing report."
  - "Checkpoint commit and report publication are separate ordered operations."
  - "A matching COMMITTED checkpoint is terminal for secondary report/evidence failure handling."
  - "Checkpoint diagnostics contain stable safe codes, never raw exception text."
  - "The authoritative report JSON is published atomically after its companion artifacts."
  - "Resume and post-commit retry regressions use the real JSONL checkpoint store."
  - "Legacy dependency-injected governance doubles remain compatible while malformed acceptance still fails."

public_contract_impact:
  level: compatible
  surfaces:
    - "quality.acceptance runtime"
    - "acceptance evidence"
    - "native transfer checkpoints"
    - "dpone.native_transfer.runtime_report.v1"
    - "LoadResult reconciliation_metrics"
  migration_required: true

owned_paths:
  - "src/dpone/runtime/governance/acceptance_metrics.py"
  - "src/dpone/runtime/governance/acceptance_snapshot.py"
  - "src/dpone/runtime/governance/legacy_acceptance.py"
  - "src/dpone/runtime/governance/finalization.py"
  - "src/dpone/runtime/governance/service.py"
  - "src/dpone/runtime/etl/payload_loader.py"
  - "src/dpone/runtime/native_transfer.py"
  - "src/dpone/runtime/native_transfer_checkpoint_lifecycle.py"
  - "src/dpone/runtime/native_transfer_report.py"
  - "tests/test_quality_acceptance_runtime.py"
  - "tests/test_native_load_governance_finalization.py"
  - "tests/test_native_transfer_runtime_service.py"
  - "tests/test_etl_processor_native_transfer_resume.py"
  - "tests/test_partition_checkpoint_store.py"
read_only_paths:
  - "docs/feature-design-quality-acceptance-fail-closed-v0731.md"
  - "docs/adr/0022-target-commit-terminal-failures.md"
  - "src/dpone/runtime/etl/processor.py"
  - "src/dpone/runtime/etl/source_state.py"
  - "src/dpone/runtime/lineage/partition_checkpoint.py"
  - "src/dpone/runtime/lineage/partition_checkpoint_store.py"
  - "src/dpone/runtime/lineage/partition_checkpoint_sql_store.py"
forbidden_paths:
  - "pyproject.toml"
  - "uv.lock"
  - "CHANGELOG.md"
  - "mkdocs.yml"
  - ".github/workflows"
  - "docs/source-sink"

shared_file_owner: "integrator"
dependencies:
  - "SS-REVIEW-QUALITY-ACCEPTANCE-RUNTIME"
required_checks:
  focused:
    - "uv run pytest tests/test_quality_acceptance_runtime.py tests/test_native_load_governance_finalization.py tests/test_native_transfer_runtime_service.py tests/test_etl_processor_native_transfer_resume.py tests/test_partition_checkpoint_store.py -q"
    - "uv run ruff check src/dpone/runtime/governance src/dpone/runtime/etl/payload_loader.py src/dpone/runtime/native_transfer.py src/dpone/runtime/native_transfer_report.py tests/test_quality_acceptance_runtime.py tests/test_native_load_governance_finalization.py tests/test_native_transfer_runtime_service.py tests/test_etl_processor_native_transfer_resume.py tests/test_partition_checkpoint_store.py"
    - "uv run mypy --config-file mypy.ini src/dpone/runtime/governance src/dpone/runtime/etl/payload_loader.py src/dpone/runtime/native_transfer.py src/dpone/runtime/native_transfer_report.py"
  broad:
    - "uv run pytest -k 'acceptance or governance or native_transfer or partition_checkpoint' -q"
    - "uv run dpone docs check-import-rules"
    - "uv run dpone docs check-module-size --baseline docs/module_size_baseline.json"
  live: []
required_outputs:
  [implementation, tests, migration_impact, documentation_impact, completion_report]
completion_statuses:
  allowed: [PASS, FAIL, SKIP, N/A, UNVERIFIED]
stop_conditions:
  - "Approved specification is missing or contradicted."
  - "Public-contract impact is larger than declared."
  - "A live check requires unapproved credentials or environment."
  - "Another writer owns the same semantic contract."
  - "Required edit falls outside owned_paths."
  - "A complete target-side durable fence is required to satisfy this bounded correction."

