schema_version: 1
task_id: "SS-REVIEW-AUTHORING-MIGRATION-TRANSACTION"
title: "Bind migration fragments and root activation into one truthful transaction"
goal: "Prevent fragment races and deletion of identical user-owned fragments during migration rollback."
specification: "docs/feature-design-self-service-filesystem-transactions-v0731.md"
base_commit: "ef88ae7fbe678b748885eb52868604d5b653d02a"
integrator: "primary Codex task"

acceptance_criteria:
  - "Only a fragment created by this operation receives an ownership receipt."
  - "Rollback removes only the exact owned fragment."
  - "The fragment is revalidated immediately before root activation."
  - "A committed root with incomplete cleanup does not trigger fragment rollback."

public_contract_impact:
  level: compatible
  surfaces: ["dpone migrate authoring apply", "migration recovery receipt"]
  migration_required: false

owned_paths:
  - "src/dpone/manifest/authoring_migration_io.py"
  - "tests/test_authoring_filesystem_transactions.py"
  - "tests/test_authoring_migration_transaction.py"
read_only_paths:
  - "src/dpone/manifest/confined_files.py"
  - "src/dpone/manifest/confined_mutations.py"
  - "docs/adr/0023-confined-authoring-transaction-semantics.md"
forbidden_paths:
  - "src/dpone/readiness"
  - "pyproject.toml"
  - "uv.lock"
  - "CHANGELOG.md"
  - "mkdocs.yml"
  - ".github/workflows"

shared_file_owner: "integrator"
dependencies: ["SS-REVIEW-CONFINED-TRANSACTION-PRIMITIVE"]
required_checks:
  focused:
    - "uv run pytest tests/test_authoring_filesystem_transactions.py tests/test_authoring_migration_transaction.py -q"
  broad:
    - "uv run dpone docs check-import-rules"
    - "uv run dpone docs check-module-size --baseline docs/module_size_baseline.json"
  live: []
required_outputs: [implementation, tests, documentation_impact, completion_report]
completion_statuses:
  allowed: [PASS, FAIL, SKIP, N/A, UNVERIFIED]
stop_conditions:
  - "Required edit falls outside owned_paths."
  - "Approved specification is missing or contradicted."
  - "Public-contract impact is larger than declared."
  - "Confined mutation API cannot express the required committed outcome."
  - "A live check requires unapproved credentials or environment."
  - "Another writer owns the same semantic contract."
