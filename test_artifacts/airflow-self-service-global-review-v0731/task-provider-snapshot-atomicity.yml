  - "uv.lock"
  - "CHANGELOG.md"
  - "mkdocs.yml"
  - ".github/workflows"

shared_file_owner: "integrator"
dependencies: ["SS-REVIEW-PROVIDER-PARSE-HARDENING"]
required_checks:
  focused:
    - "uv run pytest tests/test_airflow_deployment_index_provider.py tests/test_airflow_dag_loader.py tests/test_airflow_pack_cache.py -q"
  broad:
    - "uv run pytest tests/test_airflow_provider_parse_slo.py tests/test_airflow_run_identity.py tests/test_airflow_runtime_adapter.py tests/test_airflow_deployment_index_provider.py tests/test_airflow_dag_loader.py tests/test_airflow_pack_cache.py -q"
  live: []
required_outputs: [implementation, tests, documentation_impact, completion_report]
completion_statuses:
  allowed: [PASS, FAIL, SKIP, N/A, UNVERIFIED]
stop_conditions:
