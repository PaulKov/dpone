schema_version: 1
task_id: "SS-REVIEW-CONFINED-TRANSACTION-PRIMITIVE"
title: "Make authoring replacement crash-safe and descriptor-confined"
goal: "Remove the authoritative-name gap, reject torn reads, and recover interrupted compare-and-replace without losing user bytes."
specification: "docs/feature-design-self-service-filesystem-transactions-v0731.md"
base_commit: "ef88ae7fbe678b748885eb52868604d5b653d02a"
integrator: "primary Codex task"

acceptance_criteria:
  - "Stable descriptor reads reject in-place mutation."
  - "Existing-file replacement uses a durable journal and certified atomic name exchange."
  - "Unsupported platforms fail before namespace mutation."
  - "Cleanup failure after the linearization point is reported as committed and recovery-required."
  - "Rollback removes only the exact operation-owned file."

public_contract_impact:
  level: compatible
  surfaces: ["self-service authoring apply", "migration apply", "catalog compare-and-swap"]
  migration_required: false

owned_paths:
  - "src/dpone/manifest/confined_files.py"
  - "src/dpone/manifest/confined_mutations.py"
  - "src/dpone/manifest/confined_atomic_exchange.py"
  - "src/dpone/manifest/confined_transaction_journal.py"
  - "tests/test_confined_file_safety.py"
  - "tests/test_confined_mutation_transactions.py"
read_only_paths:
  - "src/dpone/manifest/authoring_migration_io.py"
  - "src/dpone/readiness"
  - "docs/adr/0023-confined-authoring-transaction-semantics.md"
forbidden_paths:
  - "pyproject.toml"
  - "uv.lock"
  - "CHANGELOG.md"
  - "mkdocs.yml"
  - ".github/workflows"

shared_file_owner: "integrator"
dependencies: []
required_checks:
  focused:
    - "uv run pytest tests/test_confined_file_safety.py tests/test_confined_mutation_transactions.py -q"
  broad:
    - "uv run dpone docs check-import-rules"
    - "uv run dpone docs check-module-size --baseline docs/module_size_baseline.json"
  live: []
required_outputs: [implementation, tests, documentation_impact, completion_report]
completion_statuses:
  allowed: [PASS, FAIL, SKIP, N/A, UNVERIFIED]
stop_conditions:
  - "Required edit falls outside owned_paths."
  - "Approved specification is missing or contradicted."
  - "Public-contract impact is larger than declared."
  - "A live check requires unapproved credentials or environment."
  - "Another writer owns the same semantic contract."
