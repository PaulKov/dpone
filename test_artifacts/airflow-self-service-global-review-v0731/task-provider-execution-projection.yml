schema_version: 1
task_id: "SS-REVIEW-PROVIDER-EXECUTION-PROJECTION"
title: "Make strict init-fetch scheduler authority explicit"
goal: "Replace silent stripping of legacy pack execution fields with one versioned, fingerprinted and fail-closed provider execution projection."
specification: "docs/feature-design-airflow-kpo-init-fetch-execution-v0731.md"
base_commit: "ef88ae7fbe678b748885eb52868604d5b653d02a"
integrator: "primary Codex task"

acceptance_criteria:
  - "Generated workload packs contain dpone.airflow-provider-execution.v1."
  - "The strict v2 provider reads scheduler extensions only from provider_execution."
  - "Legacy top-level kpo_kwargs, pod_spec and runtime_command remain available only to the explicit legacy/local lane."
  - "A strict deployment referencing a pack without provider_execution fails before DAG installation with a migration-required code."
  - "Unknown or reserved fields in provider_execution fail with DPONE_INIT_FETCH_RESERVED_COLLISION."
  - "Only bounded scheduling, metadata and base-container resource fields are preserved."
  - "provider_execution participates in the workload pack fingerprint."
  - "Mapped packs retain their old-provider fail-closed guard."

public_contract_impact:
  level: "compatible migration"
  surfaces:
    - "gitops.airflow_pack provider_execution"
    - "strict indexed DponeTaskGroup materialization"
    - "workload pack fingerprint"
  migration_required: true

