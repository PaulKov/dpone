schema_version: 1
task_id: "SS-REVIEW-PUBLIC-CLI-ERROR-BOUNDARY"
title: "Make run and check public error channels recursively redacted"
goal: "Prevent runtime logs or self-service payloads from leaking secrets, physical paths or tracebacks and make unexpected check failures structured."
specification: "docs/feature-design-public-cli-error-boundary-v0731.md"
base_commit: "ef88ae7fbe678b748885eb52868604d5b653d02a"
integrator: "primary Codex task"

acceptance_criteria:
  - "A dependency-free redact_public_value recursively redacts sensitive values and POSIX/Windows absolute paths and is idempotent."
  - "Every Airflow self-service payload is rendered from one recursively redacted mapping."
  - "Unexpected check exceptions return DPONE_INTERNAL_CHECK_FAILED, one safe trace id and exit code 5 in text and JSON."
  - "Expected check exit codes 1, 3 and 4 remain unchanged."
  - "ETLProcessor re-raises the original exception but never passes raw exception text or str(load_config) to public runtime logging."
  - "The result consumed by end logging contains only redacted error text."
  - "No public stdout, stderr or captured logger message contains traceback frames, secrets, private keys, URI credentials or physical paths."
  - "No check error path performs cache, network, DB or secret I/O beyond the selected service call."

public_contract_impact:
  level: compatible
  surfaces: ["dpone run error output", "dpone check error output", "runtime error logs", "security redaction API"]
  migration_required: true

owned_paths:
  - "src/dpone/security_redaction.py"
  - "src/dpone/commands/airflow_self_service_output.py"
  - "src/dpone/commands/airflow_self_service_cmd.py"
  - "src/dpone/runtime/etl/processor.py"
  - "tests/test_cli_public_error_redaction.py"
  - "tests/test_output_text_redaction.py"
read_only_paths:
  - "docs/feature-design-public-cli-error-boundary-v0731.md"
  - "src/dpone/commands/run_cmd.py"
  - "src/dpone/readiness/error_contract.py"
  - "src/dpone/readiness/airflow_self_service_models.py"
  - "src/dpone/runtime/logging_core.py"
  - "src/dpone/runtime/etl_logging/etl_logger.py"
  - "tests/test_airflow_self_service_exit_codes.py"
  - "tests/test_cli_shim_and_main.py"
forbidden_paths:
  - "pyproject.toml"
  - "uv.lock"
  - "CHANGELOG.md"
  - "mkdocs.yml"
  - ".github/workflows"
  - "docs"
  - "packages"
  - "src/dpone/commands/run_cmd.py"

shared_file_owner: "integrator"
dependencies: []
required_checks:
  focused:
    - "uv run pytest tests/test_cli_public_error_redaction.py tests/test_output_text_redaction.py -q"
    - "uv run ruff check src/dpone/security_redaction.py src/dpone/commands/airflow_self_service_output.py src/dpone/commands/airflow_self_service_cmd.py src/dpone/runtime/etl/processor.py tests/test_cli_public_error_redaction.py tests/test_output_text_redaction.py"
    - "uv run mypy --config-file mypy.ini src/dpone/security_redaction.py src/dpone/commands/airflow_self_service_output.py src/dpone/commands/airflow_self_service_cmd.py src/dpone/runtime/etl/processor.py"
  broad:
    - "uv run pytest -k 'cli or command' -q"
    - "uv run pytest -k 'runtime or state or checkpoint or replay' -q"
    - "uv run dpone docs check-import-rules"
    - "uv run dpone docs check-module-size --baseline docs/module_size_baseline.json"
  live: []
required_outputs: [implementation, tests, documentation_impact, completion_report]
completion_statuses:
  allowed: [PASS, FAIL, SKIP, N/A, UNVERIFIED]
stop_conditions:
  - "Required edit falls outside owned_paths."
  - "Approved specification is missing or contradicted."
  - "Public-contract impact is larger than declared."
  - "A raw traceback or exception payload would need to become public evidence."
  - "A live check requires unapproved credentials or environment."
  - "Another writer owns the same semantic contract."

