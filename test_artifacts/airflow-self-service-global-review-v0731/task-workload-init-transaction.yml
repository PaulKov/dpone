schema_version: 1
task_id: "SS-REVIEW-WORKLOAD-INIT-TRANSACTION"
title: "Make workload init repository-confined and conflict-atomic"
goal: "Prevent symlink escape and false success when scaffold or catalog state changes during workload init apply."
specification: "test_artifacts/airflow-self-service-global-review-v0731/review-contract.md"
base_commit: "ef88ae7fbe678b748885eb52868604d5b653d02a"
integrator: "primary Codex task"

acceptance_criteria:
  - "Domain and ownership catalog reads/writes are descriptor-confined to the project root."
  - "Leaf and parent symlinks are rejected without changing external files."
  - "A scaffold apply conflict aborts before any catalog write and returns nonzero."
  - "Catalog updates use expected-state/CAS semantics and cannot overwrite concurrent changes."
  - "Existing idempotent workload init behavior remains compatible."

public_contract_impact:
  level: compatible
  surfaces: ["dpone workload init --apply", "domain catalog", "ownership catalog"]
  migration_required: false

owned_paths:
  - "src/dpone/readiness/workload_init_service.py"
  - "src/dpone/readiness/workload_init_catalog_merge.py"
  - "tests/test_workload_init_cli.py"
read_only_paths:
  - "src/dpone/manifest/confined_files.py"
  - "src/dpone/readiness/airflow_pipeline_source.py"
  - "src/dpone/readiness/airflow_scaffold_apply.py"
forbidden_paths:
  - "pyproject.toml"
  - "uv.lock"
  - "CHANGELOG.md"
  - "mkdocs.yml"
  - ".github/workflows"

shared_file_owner: "integrator"
dependencies: []
required_checks:
  focused:
    - "uv run pytest tests/test_workload_init_cli.py -q"
  broad:
    - "uv run pytest tests/test_workload_init_cli.py tests/test_airflow_self_service_security.py -q"
  live: []
required_outputs: [implementation, tests, documentation_impact, completion_report]
completion_statuses:
  allowed: [PASS, FAIL, SKIP, N/A, UNVERIFIED]
stop_conditions:
  - "Required edit falls outside owned_paths."
  - "Approved specification is missing or contradicted."
  - "Public-contract impact is larger than declared."
  - "A live check requires unapproved credentials or environment."
  - "Another writer owns the same semantic contract."
