schema_version: 1
task_id: DBT-PROGRAMME-05-REDACTION
title: Prevent secret fragments at bounded dbt output retention boundaries
goal: Restore the existing bounded redacted-output contract without expanding diagnostics
  or invocation policy.
specification: docs/feature-design-dbt-runtime-correctness-remediation-v1.md
base_commit: 46830976b214262c7772800523e832a5a6f6d78f
integrator: dbt-programme-coordinator
acceptance_criteria:
- Reproduce the retained-secret-prefix leak through public SubprocessDbtCommandRunner
  with injected process and supervisor; no monkey patches or private-method replacement.
- Redact complete secrets and fragments exposed by truncation/earlier replacements
  while preserving bounded memory, pipe draining, valid UTF-8 and output byte ceiling.
- Cover repeated and overlapping secrets, both pipes, multibyte text/secrets, retention/read
  boundaries, exact-limit and no-secret controls.
- Preserve public result/exit/truncation contracts and existing invocation environment;
  do not add live sinks, log passthrough, debug flags or diagnostic authority.
- Do not change timeout/cleanup precedence or scheduler intervals in this slice.
- Limit documentation to existing redaction/retention guarantees; send CHANGELOG proposal
  to coordinator.
- Run red-green focused checks, existing subprocess/runtime checks, required Python/docs
  gates and final independent fresh-context review.
public_contract_impact:
  level: none
  surfaces: []
  migration_required: false
owned_paths:
- test_artifacts/dbt-programme/stage-05
- src/dpone/adapters/dbt_subprocess.py
- tests/test_dbt_subprocess_redaction_boundaries.py
- docs/dbt-self-service-threat-model.md
integrator_owned_paths: []
read_only_paths:
- src/dpone/contracts
- src/dpone/runtime
- src/dpone/services
- src/dpone/ports
- tests/test_dbt_subprocess_supervision.py
- tests/test_dbt_runtime_execution.py
- packages
- tools
- AGENTS.md
- src/dpone/AGENTS.md
- tests/AGENTS.md
- docs/AGENTS.md
forbidden_paths:
- pyproject.toml
- uv.lock
- CHANGELOG.md
- mkdocs.yml
- .github/workflows
- tests/conftest.py
- src/dpone/schema
shared_file_owner: dbt-programme-coordinator
dependencies:
- DBT-PROGRAMME-05-ANALYSIS
required_checks:
  focused:
  - uv run --frozen pytest tests/test_dbt_subprocess_redaction_boundaries.py tests/test_dbt_subprocess_supervision.py
    tests/test_dbt_runtime_execution.py -q
  broad:
  - uv run --frozen ruff check .
  - uv run --frozen ruff format --check .
  - uv run --frozen mypy --config-file mypy.ini
  - uv run --frozen dpone docs check-import-rules
  - uv run --frozen dpone docs check-layer-metrics --baseline docs/layer_metrics_baseline.json
  - uv run --frozen python tools/agent_policy/select_checks.py --base-ref origin/master
  - uv run --frozen pytest -m "not integration_live" -n auto --dist loadfile
  - uv run --frozen dpone docs check-docs
  - uv run --frozen pytest tests/test_docs_language_contracts.py -q
  - uv run --frozen mkdocs build --strict
  live: []
required_outputs:
- implementation
- tests
- documentation_impact
- completion_report
completion_statuses:
  allowed:
  - PASS
  - FAIL
  - SKIP
  - N/A
  - UNVERIFIED
stop_conditions:
- Required edit falls outside owned_paths.
- Approved specification is missing or contradicted.
- Public-contract impact is larger than declared.
- A live check requires unapproved credentials or environment.
- Another writer owns the same semantic contract.
