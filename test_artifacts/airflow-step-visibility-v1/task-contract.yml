schema_version: 1
task_id: "DPONE-AIRFLOW-VISIBILITY-V1"
title: "Selector-safe Airflow step visibility"
goal: "Implement inline, task, and group materialization without duplicate process execution or false success."
specification: "docs/feature-design-airflow-step-visibility-v1.md"
base_commit: "649b2c36"
integrator: "current Codex task"

acceptance_criteria:
  - "Every newly built DAG-spec process node carries a validated selector and explicit visibility."
  - "Every selected node resolves one immutable selector-indexed process plan; provider code never rewrites shell commands."
  - "A multi-process workload executes exactly the selected process once per node."
  - "inline creates one fail-closed task; task creates flat internal tasks; group contains the same tasks in TaskGroup."
  - "Visible task warning and hard budgets are deterministic and enforced before publication."
  - "Old selected packs fail closed; legacy unselected packs retain compatibility."
  - "Airflow parse performs zero network, database, secret, Variable, Connection, or cache-refresh calls."

public_contract_impact:
  level: compatible
  surfaces:
    - manifest_schema
    - dag_spec
    - airflow_pack
    - airflow_provider
    - preview_explain
    - documentation
  migration_required: true

owned_paths:
  - src/dpone/gitops/airflow_step_visibility.py
  - src/dpone/gitops/airflow_dag_spec.py
  - src/dpone/gitops/airflow_dag_spec_policy.py
