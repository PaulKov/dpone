  - docs/engineering-standards.md
  - docs/airflow-industrial-self-service-specification.md
  - docs/adr/
  - src/dpone/manifest/
  - src/dpone/runtime/
forbidden_paths:
  - .cursor/
  - pyproject.toml
  - uv.lock
  - mkdocs.yml
  - .github/workflows/

shared_file_owner: "current Codex task"

dependencies:
  - "Airflow Authoring v1"
  - "formal Airflow provider facade"
  - "immutable release/deployment index"
required_checks:
  focused:
    - "uv run pytest tests/test_airflow_step_visibility.py tests/test_airflow_dag_spec_builder.py tests/test_airflow_dag_loader_contract.py tests/test_airflow_runtime_adapter.py tests/test_gitops_schema_contracts.py -q"
  broad:
    - "uv run python tools/agent_policy/select_checks.py --base-ref origin/master"
    - "uv run ruff check ."
    - "uv run ruff format --check ."
    - "uv run mypy --config-file mypy.ini"
    - "uv run dpone docs check-import-rules"
    - "uv run dpone docs check-layer-metrics --baseline docs/layer_metrics_baseline.json"
    - "uv run dpone docs check-module-size --baseline docs/module_size_baseline.json"
    - "uv run pytest -m 'not integration_live' -n auto --dist loadfile"
    - "uv run dpone docs check-docs"
    - "uv run mkdocs build --strict"
  live:
    - "Approved Airflow/Kubernetes MSSQL to ClickHouse route only; otherwise UNVERIFIED"

required_outputs:
  - implementation
  - tests
  - documentation_impact
  - validation_report
  - benchmark
  - completion_report

completion_statuses:
  allowed:
    - PASS
    - FAIL
    - SKIP
    - N/A
    - UNVERIFIED

stop_conditions:
  - "Required edit falls outside owned_paths."
  - "Approved specification is missing or contradicted."
  - "Public-contract impact is larger than declared."
  - "A live check requires unapproved credentials or environment."
  - "Another writer owns the same semantic contract."
