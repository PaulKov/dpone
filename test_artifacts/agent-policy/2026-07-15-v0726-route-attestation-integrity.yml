schema_version: 1
task_id: "DPONE-V0726-ROUTE-ATTESTATION"
title: "Bind production safe-sample trust to signed route attestations"
goal: >-
  Replace raw CLI-context route-ID trust with content-addressed, exact-identity
  Sigstore verification bound to the certified route and actual immutable
  release/deployment subject before any credential or data-system I/O.
specification: "docs/feature-design-route-attestation-integrity-v0726.md"
base_commit: "078ff2bc"
integrator: "codex/v0.72.6-route-attestation-integrity"

acceptance_criteria:
  - "Production live safe-sample requires a verified route-attestation decision and never consumes raw CLI-context route IDs."
  - "The signed claims bind route tuple, certification digest/profile/level, release, deployment, environment, authorization profile, and runtime image."
  - "Exact certificate identity/issuer, pinned trusted root, supported cosign version, validity, and revocation policy fail closed."
  - "No credential resolution, artifact fetch, DDL, source read, or sink write occurs before verification succeeds."
  - "Runtime evidence contains safe route-attestation lineage and no signature, certificate, trust-root, Vault, credential, or row data."
  - "The five-command beginner journey and non-live rehearsal remain unchanged."

public_contract_impact:
  level: deprecation
  surfaces:
    - cli
    - python_api
    - schemas
    - structured_errors
    - runtime_evidence
    - platform_runbook
  migration_required: true
  migration: "Platform automation must build/sign/mount route-attestation inputs; raw verified_safe_sample_route_ids no longer authorizes production."

