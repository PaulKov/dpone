  - docs/feature-design-ci-pr-gate-exact-sha-evidence.md
  - docs/adr/0048-exact-sha-readiness-evidence.md
  - docs/quality-metrics.md
  - tests/test_ci_shadow_pr3a_contracts.py
  - tests/test_ci_shadow_pr3a_label_probe.py
  - tests/test_ci_shadow_pr3a_pages_guard.py
  - tests/test_ci_shadow_pr3a_pages_recovery.py
  - tests/test_ci_shadow_pr3a_pages_recovery_shell.py
  - test_artifacts/agent-policy/dpone-ci-shadow-pr3a-spec.yml

read_only_paths:
  - .github/dependabot.yml
  - .github/workflows/ci.yml
  - .github/workflows/airflow-pack-compat.yml
  - .github/workflows/pages.yml
  - .github/workflows/dependency-review.yml
  - .agents/policy/workflow-security.yml
  - docs/adr/0046-component-aware-pr-gate-authority.md
  - docs/feature-design-standard.md
