schema_version: 1
task_id: "DPONE-CI-SHADOW-PR3A-SPEC"
title: "Freeze the executable PR 3A CI-hygiene child contract"
goal: >-
  Convert the merged parent PR 3A architecture row into a researched,
  reviewable, exact-path child specification without changing production
  workflows, Dependabot, permissions, merge authority, or release behavior.
specification: "docs/feature-design-ci-shadow-pr3a-ci-hygiene.md"
base_commit: "6fdbcf90f38a88d5aa1793213160e0eb0fb6939d"
integrator: "/root"

acceptance_criteria:
  - "Status is APPROVED because the maintainer authorized the exact reviewed head 67aa7ceca85f79ba95a01f7ddd9f8a54c2a861a3; merge still requires exact-head checks, owner attestation, and Agent PR receipt on the immutable APPROVED successor."
  - "The child freezes exact Dependabot schedules, labels, limits, groups, and the missing-label implementation-task/start and implementation-merge stop without blocking specification approval."
  - "The child freezes PR cancellation, a source-free queued nightly reusable-workflow caller, and exact matrix ceilings."
  - "The child freezes stable whole-workflow Pages ordering, a read-only current-master guard, attempt-1-only non-PR upload/verification/deploy, new-current-master-run-only recovery, job-scoped deploy authority, and native read-only PR plus exact-master Dependency Review with no manual or synthetic backfill."
  - "Executable tests validate exact label-probe argv/repository/query/host identity and current/stale/malformed/multiple/API-failed Pages guards, attempts 1/2 with prior/missing/current outputs, reversed completion, deploy/verify/full rerun prohibition, pre-dispatch positive-integer validation, explicit github.com label and Pages API host binding under a foreign GH_HOST, versioned dispatch response/new-run identity, provider-visible head_branch mapping, authenticated workflow source and exact action pin, provider-visible display-name/step correlation, zero/one/two exact-attempt deploy jobs, complete/incomplete Jobs pagination, skipped evidence, and removed/inverted-comparison mutations."
  - "The future implementation governance test parses the actual .github/workflows/pages.yml and rejects any missing, prior-attempt, removed, or inverted SHA/run_attempt binding, non-PR build rerun, artifact overwrite, or skipped deployment false-PASS."
  - "The child freezes a pinned, narrow, removable actionlint compatibility boundary for concurrency.queue."
  - "The child names the exact implementation allowlist and the byte-identical release-sensitive denylist."
  - "The child defines first-time Configure, Execute, Observe, Diagnose, Recover, Operate, rollback, and evidence journeys."
  - "The documentation plan assigns pinned-actionlint install/streams/waiver recovery to the runbook, exact version/per-path/removal guidance to developer docs, and exit/stdout/stderr contracts to testing docs."
  - "No production workflow, Dependabot file, workflow-security policy, source, package, protection, release, or live setting changes."

public_contract_impact:
  level: compatible
  surfaces:
    - "repository CI child architecture contract"
    - "PR 3A implementation and validation boundary"
    - "contributor and operator documentation plan"
  migration_required: false

owned_paths:
