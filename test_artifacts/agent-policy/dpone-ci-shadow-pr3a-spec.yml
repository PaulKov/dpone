shared_file_owner: "/root"

dependencies:
  - "Current master 6fdbcf90f38a88d5aa1793213160e0eb0fb6939d is the exact child-design base and contains PR 2 merge ec0323feba829d547e5f9c2d23acaac5b686f1a4."
  - "The approved parent specification remains the architecture authority until this child is separately approved."
  - "The missing live github-actions label blocks implementation-task start and implementation merge, not this design review or approval."

required_checks:
  focused:
    - "uv run pytest tests/test_ci_shadow_pr3a_contracts.py tests/test_ci_shadow_pr3a_label_probe.py tests/test_ci_shadow_pr3a_pages_guard.py tests/test_ci_shadow_pr3a_pages_recovery.py tests/test_ci_shadow_pr3a_pages_recovery_shell.py tests/test_ci_shadow_spec_contracts.py tests/agent_policy/test_task_contract.py tests/test_docs_language_contracts.py -q"
    - "uv run python tools/agent_policy/task_contract.py test_artifacts/agent-policy/dpone-ci-shadow-pr3a-spec.yml"
  broad:
    - "uv run python tools/agent_policy/select_checks.py --base-ref 6fdbcf90f38a88d5aa1793213160e0eb0fb6939d"
    - "Execute every selected non-live check and report unavailable live evidence as UNVERIFIED."
    - "uv run ruff check tests/test_ci_shadow_pr3a_contracts.py tests/test_ci_shadow_pr3a_label_probe.py tests/test_ci_shadow_pr3a_pages_guard.py tests/test_ci_shadow_pr3a_pages_recovery.py tests/test_ci_shadow_pr3a_pages_recovery_shell.py && uv run ruff format --check tests/test_ci_shadow_pr3a_contracts.py tests/test_ci_shadow_pr3a_label_probe.py tests/test_ci_shadow_pr3a_pages_guard.py tests/test_ci_shadow_pr3a_pages_recovery.py tests/test_ci_shadow_pr3a_pages_recovery_shell.py"
    - "uv run dpone docs check-docs"
    - "uv run dpone docs check-generated-references"
    - "uv run dpone docs update-dev-metrics --check"
    - "uv run mkdocs build --strict"
    - "git diff --cached --check"
  live:
    - "Read-only exact label query; github-actions may remain UNVERIFIED for design review/approval but blocks implementation-task start and implementation merge."

required_outputs:
  - implementation
  - tests
  - documentation_impact
  - completion_report

completion_statuses:
  allowed:
    - PASS
    - FAIL
    - SKIP
    - N/A
    - UNVERIFIED

stop_conditions:
  - "Required edit falls outside owned_paths."
  - "Approved specification is missing or contradicted."
  - "Public-contract impact is larger than declared."
  - "A live check requires unapproved credentials or environment."
  - "Another writer owns the same semantic contract."
  - "The exact base is not 6fdbcf90f38a88d5aa1793213160e0eb0fb6939d."
  - "Any production workflow, Dependabot, workflow-security policy, source, release, protection, or live GitHub setting changes."
  - "The child status is changed to APPROVED without exact-head maintainer review evidence."
