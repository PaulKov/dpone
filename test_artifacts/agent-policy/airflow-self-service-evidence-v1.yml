schema_version: 1
task_id: "DPONE-AIRFLOW-P4-SELF-SERVICE-EVIDENCE"
title: "Publish Airflow self-service usability and reference-deployment evidence"
goal: "Provide one fail-closed local projection for real five-user and two-deployment evidence."
specification: "docs/feature-design-airflow-self-service-evidence-v1.md"
base_commit: "6fc1289070eac73171a683656e5b99cdda56c042"
integrator: "Codex"

acceptance_criteria:
  - "Missing human or production evidence is UNVERIFIED, never PASS."
  - "Five-user metrics are derived from privacy-safe timestamps and bounded structured input."
  - "Reference deployments reuse exact release/deployment, route, Airflow run, correlation, and signer identities."
  - "Two distinct deployment and signer identities are required for reference PASS."

public_contract_impact:
  level: compatible
  surfaces:
    - "dpone certify self-service"
    - "dpone.self-service-usability-study.v1"
    - "dpone.self-service-certification.v1"
  migration_required: false

owned_paths:
  - "src/dpone/ops/self_service_certification*.py"
  - "src/dpone/commands/certify_cmd.py"
  - "src/dpone/services/ops/facades.py"
  - "src/dpone/gitops/schema_contracts.py"
  - "src/dpone/gitops/schema_self_service_certification_contracts.py"
  - "docs/schemas/gitops/self-service-*.schema.json"
  - "docs/feature-design-airflow-self-service-evidence-v1.md"
  - "docs/airflow-self-service-evidence.md"
  - "docs/getting-started/first-airflow-dag.md"
  - "docs/airflow-self-service.md"
  - "docs/airflow-self-service-architecture.md"
  - "docs/airflow-self-service-backlog.md"
  - "docs/cli-reference.md"
  - "docs/reference/gitops-schema-catalog.md"
  - "docs/airflow-self-service-public-contracts-v1.yaml"
  - "docs/reference/airflow-public-contracts.md"
  - "tests/test_self_service_certification.py"
  - "tests/test_gitops_schema_contracts.py"
  - "tests/test_docs_language_contracts.py"
  - "test_artifacts/airflow-self-service-evidence-v1/**"
  - "test_artifacts/agent-policy/airflow-self-service-evidence-v1.yml"

read_only_paths:
  - "src/dpone/contracts/airflow_deployment.py"
  - "src/dpone/contracts/airflow_run_identity.py"
  - "src/dpone/contracts/airflow_correlation.py"
  - "src/dpone/ops/route_certification_matrix_evidence.py"
  - "src/dpone/readiness/route_attestation_files.py"

forbidden_paths:
  - ".cursor/**"
  - "src/dpone/runtime/**"
  - "src/dpone/adapters/**"
  - "packages/**"
  - "pyproject.toml"
  - "uv.lock"
  - "CHANGELOG.md"
  - "mkdocs.yml"
  - ".github/workflows/**"

shared_file_owner: "Codex"

dependencies:
  - "existing release/deployment canonical identity helpers"
  - "existing route certification evidence reader"
  - "existing Airflow run identity and correlation parsers"
  - "CHANGELOG.md and mkdocs.yml are integrated separately by shared_file_owner"

required_checks:
  focused:
    - "uv run pytest tests/test_self_service_certification.py tests/test_gitops_schema_contracts.py -q"
  broad:
    - "uv run python tools/agent_policy/select_checks.py --base-ref origin/master"
    - "uv run ruff check ."
    - "uv run ruff format --check ."
    - "uv run mypy --config-file mypy.ini"
    - "uv run dpone docs check-import-rules"
    - "uv run dpone docs check-layer-metrics --baseline docs/layer_metrics_baseline.json"
    - "uv run dpone docs check-module-size --baseline docs/module_size_baseline.json"
    - "uv run pytest -m 'not integration_live' -n auto --dist loadfile"
    - "uv run dpone docs check-docs"
    - "uv run mkdocs build --strict"
  live:
    - "five consented first-time users"
    - "two approved independent production deployments"

required_outputs:
  - implementation
  - tests
  - schemas
  - documentation_impact
  - validation_report
  - completion_report

completion_statuses:
  allowed: [PASS, FAIL, SKIP, N/A, UNVERIFIED]

stop_conditions:
  - "Required edit falls outside owned_paths."
  - "Approved specification is missing or contradicted."
  - "Public-contract impact is larger than declared."
  - "A live check requires unapproved credentials or environment."
  - "Another writer owns the same semantic contract."
  - "A mocked or synthetic fixture would be reported as external PASS."
  - "A second route, signature, deployment, or Airflow evidence authority would be introduced."
