schema_version: 1
task_id: "DPONE-CI-SHADOW-PR3B-SPEC"
title: "Freeze the executable PR 3B semantic privilege-boundary contract"
goal: >-
  Convert the merged parent PR 3B architecture row into a researched,
  reviewable, exact-path child specification for transitive pull-request
  reachability, effective permissions, closed CodeQL, retirement of the unsafe
  legacy governance attestor, its exact producer/finalizer replacement, and the
  existing merged-closure capability without changing PR3B runtime or
  production workflow/security bytes in this design-only PR. The declared
  root-owned task-contract schema/validator amendment is governance tooling,
  not the planned PR3B scanner implementation.
specification: "docs/feature-design-ci-shadow-pr3b-semantic-privilege-boundary.md"
base_commit: "c5567128e6e9b847b4b2a023a74ea6d60e7ccd09"
integrator: "/root"

acceptance_criteria:
  - "The child remains RESEARCHED with the ADR0037 amendment PROPOSED until the exact-head maintainer atomically changes them to APPROVED/ACCEPTED with the frozen identity/date; no production implementation is authorized by this task."
  - "The public scanner command, formats, exits, streams, no-write/no-network behavior, deterministic report, stable statuses, codes, recovery IDs, and closed policy/report schemas are exact."
  - "The algorithm strictly and stably reads bounded yml/yaml bytes, rejects duplicate/ambiguous YAML, constructs direct PR, local workflow_call, workflow_run, and needs edges, expands correlated closed-event variants into separate routes, and uses sound three-valued route proof."
  - "Authority and approved-profile records are route-specific, fully bounded, and cannot collapse different callers or event variants into one permission result."
  - "Effective workflow/job/caller/callee permissions, omitted-none semantics, write-all, read-all, unknown permissions, OIDC, secrets, environments, and self-hosted runners fail closed."
  - "The exact action-only CodeQL profile requires checkout persist-credentials false and removes custom config, build, run, cache, download, install, query, local, Docker, secret, and environment authority."
  - "The historical ADR0037 governance-source hashes remain reproducible negative fixtures and can never authorize PASS; the implementation must atomically remove write/OIDC from PR-controlled code and install the exact read-only producer plus source-free action-only finalizer."
  - "Every mandatory profile has an exact full trigger digest, one subject occurrence, and one exact route coordinate per event variant; missing, duplicate, renamed, copied, trigger-drifted, or route-drifted profiles fail closed."
  - "This design PR carries the proposed ADR0037 amendment that retires the unsafe legacy exception and accepts only the exact producer/finalizer replacement; it remains inactive while the child is RESEARCHED and precedes all implementation."
  - "The ADR0037 merge-closure publisher remains a separate post-merge integrated-code capability with its exact route, checkout, permission, action/input, and resolved execution-envelope fingerprint."
  - "The child distinguishes deterministic FAIL from unavailable/unknown UNVERIFIED, rejects fixture widening as recovery, and gives copyable operator actions."
  - "The existing workflow-security schema/policy mismatch is named and future implementation must validate the repaired policy instance before consuming the new semantic policy."
  - "The implementation architecture separates snapshot I/O, strict parsing, graph topology, expression proof, permission resolution, closed profiles, report/rendering, orchestration, and thin CLI/composition roots below repository quality budgets."
  - "Current required contexts, ci.yml, agent-pr-receipt.yml, release workflows, runtime/data-plane code, rulesets, Apps, environments, secrets, tags, variables, and publication authority remain unchanged by this specification PR."
  - "The documentation plan covers Discover through Upgrade for workflow authors, security reviewers, contributors, and operators without duplicating machine fingerprints in prose."
  - "The closed task-contract schema and validator accept only explicit integrator_owned_paths when integrator equals shared_file_owner, those paths stay forbidden to delegated writers, and unknown ownership fields fail schema validation."
  - "The scope contract reads only the immutable, ancestor-validated DESIGN_BASE...HEAD Git trees; dirty generated evidence and untracked files do not alter scope, while committed undeclared paths fail closed."

public_contract_impact:
  level: compatible
  surfaces:
    - "repository workflow-security child architecture contract"
    - "planned semantic privilege scanner, policy, and report"
    - "planned CodeQL repository profile and operator recovery"
    - "contributor, security-reviewer, and operator documentation plan"
    - "agent task-contract root-integrator ownership boundary"
  migration_required: true

