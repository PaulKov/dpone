  - "A delegated writer edits integrator_owned_paths, or the declared integrator differs from shared_file_owner."
  - "Approved specification is missing or contradicted."
  - "Approved parent specification or ADR0048 is missing or contradicted, or the proposed ADR0037 amendment is not lifecycle-consistent with this child."
  - "Public-contract impact is larger than declared."
  - "A live check requires unapproved credentials or environment."
  - "Another writer owns the same semantic contract."
  - "The exact base is not c5567128e6e9b847b4b2a023a74ea6d60e7ccd09."
  - "Any PR3B production workflow, CodeQL config, workflow-security policy/schema/tool, runtime source, package, release, protection, or live GitHub setting changes outside the explicitly listed root-owned task-contract schema/validator amendment."
  - "The design deviates from the exact proposed retirement/migration, restores the legacy exception, copies either approved capability, or adds a new publisher."
  - "The child status is changed to APPROVED without exact-head maintainer review evidence."
