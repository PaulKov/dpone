schema_version: 1
task_id: "DPONE-V0728-AIRFLOW-CONNECTION-SECRET-ISOLATION"
title: "Isolate Airflow Connection bridge Secrets per task attempt"
goal: >-
  Eliminate cross-run credential overwrite and cleanup races by deriving one
  create-only immutable Kubernetes Secret per Airflow task attempt, while
  preserving compact-pack compatibility and parse-safe provider behavior.
specification: "docs/feature-design-airflow-connection-secret-isolation-v0728.md"
base_commit: "ae6e3498"
integrator: "codex/v0.72.8-airflow-connection-secret-isolation"

acceptance_criteria:
  - "Every valid task attempt derives a deterministic DNS-safe Secret name from dag_id, task_id, run_id, try_number, and map_index."
  - "Concurrent runs, retries, and mapped task instances publish, mount, and delete distinct Secret objects."
  - "The Kubernetes adapter creates only; HTTP 409 fails closed and never replaces an existing Secret."
  - "Identity and lifecycle validation happen before Airflow Connection reads or Kubernetes calls."
  - "No connection URI, Secret payload, raw task identity, namespace, or raw Kubernetes response is retained in operator state, logs, evidence, or structured errors."
  - "Existing compact packs and secret_name schema remain compatible; deferrable retain behavior remains unchanged."

public_contract_impact:
  level: compatible
  surfaces:
    - airflow_provider_python_api
    - airflow_operator_runtime
    - structured_exceptions
    - documentation
  migration_required: true
  migration: "Injected projector implementations must make the compatibility-named upsert method create-only."

owned_paths:
  - docs/feature-design-airflow-connection-secret-isolation-v0728.md
  - docs/airflow-provider-api.md
  - docs/airflow-self-service-architecture.md
  - docs/airflow-self-service-backlog.md
