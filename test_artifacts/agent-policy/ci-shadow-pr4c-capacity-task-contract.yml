schema_version: 1
task_id: "DPONE-512-PR4C-CAPACITY"
title: "Read-only CI shadow capacity calibration"
goal: "Produce source-bound, archive-authenticated, always-UNVERIFIED capacity evidence before reconciler implementation."
specification: "docs/feature-design-ci-shadow-pr4c-capacity.md"
base_commit: "0b4849bd2e7afc9a2778d6120f742d2202db8aff"
integrator: "codex"

acceptance_criteria:
  - "The probe is default-branch source-free workflow_dispatch and never changes legacy merge authority."
  - "Two independently acquired bounded observations are required; capacity evidence is always UNVERIFIED."
  - "Provider digest/size bind archive bytes; exactly one hardened JSON payload member has separate digest/size."
  - "Every outbound request, redirect and retry is metered before dispatch under immutable parent caps."
  - "The create-only evidence writer is durable and no-replace; legacy route-attestation behavior remains compatible."
  - "Public documentation explains that qualifying evidence does not approve a daily reconciliation root."

public_contract_impact:
  level: compatible
  surfaces: ["CI workflow", "capacity artifact schema", "fixture CLI", "documentation"]
  migration_required: false

