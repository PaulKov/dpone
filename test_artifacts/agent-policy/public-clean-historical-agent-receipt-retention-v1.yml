# Status: APPROVED by the maintainer on 2026-09-11.
schema_version: 1
task_id: PUBLIC-CLEAN-HISTORICAL-AGENT-RECEIPT-RETENTION-V1
title: Append-only retention for historical agent receipt evidence
goal: Remove one unsupported duplicate historical artifact from the current tree
  without rewriting history, weakening the scanner, or misrepresenting retained
  evidence as a current execution result.
specification: docs/feature-design-public-clean-migration-v1.md
base_commit: a54281906040f7e8d21e52071820c8b5f9d9608d
integrator: parent-integrator

acceptance_criteria:
  - Preserve the six original files byte-for-byte in immutable Git history and
    the verified complete external DDA archive before deleting current-tree copies.
  - Keep the existing hygiene-retention/index.json, download.json, and
    review-fixes-ownership.log byte-identical.
  - Add one append-only dpone.public-clean-historical-receipt-retention.v1 record
    with status N/A; never claim execution, privacy, release, or live success.
  - Bind exact source commit/tree, paths, modes, sizes, Git blobs, SHA-256 values,
    download-manifest digest, archive/inventory digests, and producer identity.
  - Reject malformed, duplicate-key, non-finite, incomplete, mutated, symlinked,
    pre-existing-output, partial-write, or private-locator inputs without a
    successful record.
  - Delete only the six bound current-tree artifact files after successful
    producer verification; do not add an LF projection or generic NUL exception.
  - Preserve ordinary strict UTF-8-without-NUL candidate scanning and report
    reachable-history scanning as UNVERIFIED.
  - Cover all positive, negative, boundary, mutation, atomicity, and false-status
    cases with RED before GREEN.
  - Run focused host and offline Linux Docker tests, then complete candidate,
    history, and worktree scans independently.
  - Preserve no-push, no-PR, no-release, no-provider-activation, and no-live
    authority.

