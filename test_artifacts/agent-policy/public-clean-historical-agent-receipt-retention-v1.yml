dependencies:
  - Maintainer approved append-only retention on 2026-09-11.
  - The exact six source blobs and complete external archive remain available.
  - The private producer receives independent review before execution.

required_checks:
  focused:
    - uv run python tools/agent_policy/task_contract.py
      test_artifacts/agent-policy/public-clean-historical-agent-receipt-retention-v1.yml
    - uv run pytest
      tests/agent_policy/test_public_clean_historical_agent_receipt_retention.py -q
    - uv run pytest -k
      "path_evidence or pr_receipt_source_archive or merge_receipt or workflow_governance"
      -q
    - Offline Linux Docker run of the same focused tests against the exact candidate.
  broad:
    - uv run python tools/agent_policy/select_checks.py --base-ref origin/master
    - uv run ruff check .
    - uv run ruff format --check .
    - uv run mypy --config-file mypy.ini
    - uv run dpone docs check-import-rules
    - uv run dpone docs check-layer-metrics
      --baseline docs/layer_metrics_baseline.json
    - uv run dpone docs check-module-size
      --baseline docs/module_size_baseline.json
      --base-ref origin/master --head-ref HEAD
    - uv run dpone docs check-docs
    - uv run pytest tests/test_docs_language_contracts.py -q
    - uv run mkdocs build --strict
    - uv run pytest -m "not integration_live" -n auto --dist loadfile
  live: []

required_outputs:
  - implementation
  - tests
  - documentation_impact
  - completion_report

completion_statuses:
  allowed:
    - PASS
    - FAIL
    - SKIP
    - N/A
    - UNVERIFIED

stop_conditions:
  - Required edit falls outside owned_paths.
  - Approved specification is missing or contradicted.
  - Public-contract impact is larger than declared.
  - A live check requires unapproved credentials or environment.
  - Another writer owns the same semantic contract.
  - The six source files, original Git objects, or external archive are unavailable.
  - Existing retention authority or download evidence would need modification.
  - A private locator, policy value, raw finding, or credential would enter public output.
  - Candidate, history, or worktree evidence would be combined into one PASS.
  - A live check, publication, push, PR, release, or provider activation is required.
