dependencies:
  - "Phase 0 freeze and audit ledger in GitHub issue #512"
  - "Grandfathered module-size debt burn-down in GitHub issue #520"
required_checks:
  focused:
    - "uv run pytest tests/test_module_size_confined_write_revalidation.py tests/test_module_size_gate.py tests/test_architecture_phase2_contracts.py tests/test_architecture_phase3_contracts.py -q"
    - "uv run pytest tests/test_airflow_compact_pack_runtime_payload_limits.py tests/test_airflow_runtime_init_fetch_cli.py tests/test_gitops_schema_contracts.py tests/test_airflow_release_runtime_payload_inventory.py -q"
  broad:
    - "uv run ruff check ."
    - "uv run ruff format --check ."
    - "uv run mypy --config-file mypy.ini"
    - "uv run dpone docs check-import-rules"
    - "uv run dpone docs check-layer-metrics --baseline docs/layer_metrics_baseline.json"
    - "HEAD_SHA=$(git rev-parse HEAD); BASE_SHA=$(git merge-base $HEAD_SHA origin/master); test $BASE_SHA != $HEAD_SHA; uv run dpone docs check-module-size --baseline docs/module_size_baseline.json --base-ref $BASE_SHA --head-ref $HEAD_SHA"
    - "uv run pytest -m 'not integration_live' -n auto --dist loadfile"
    - "uv run dpone docs check-docs"
    - "uv run pytest tests/test_docs_language_contracts.py -q"
    - "uv run mkdocs build --strict"
  live:
    - "GitHub legacy required-check matrix on the exact PR head"

required_outputs:
  - implementation
  - tests
  - documentation_impact
  - completion_report

completion_statuses:
  allowed:
    - PASS
    - FAIL
    - SKIP
    - N/A
    - UNVERIFIED

stop_conditions:
  - "Required edit falls outside owned_paths."
  - "Approved specification is missing or contradicted."
  - "Public-contract impact is larger than declared."
  - "A live check requires unapproved credentials or environment."
  - "Another writer owns the same semantic contract."
