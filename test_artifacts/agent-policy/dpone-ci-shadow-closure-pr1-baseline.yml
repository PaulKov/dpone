schema_version: 1
task_id: "DPONE-CI-SHADOW-CLOSURE-PR1"
title: "Repair the legacy CI baseline and introduce module-size ratchet v2"
goal: >-
  Restore deterministic non-live and legacy CI checks on the exact master baseline
  while replacing the module-size allowlist with a fail-closed, no-headroom debt
  ratchet and splitting the current hard-limit offender by responsibility.
specification: >-
  Approved DPONE-CI-SHADOW-CLOSURE plan tracked by
  https://github.com/PaulKov/dpone/issues/512; PR1 is the isolated baseline repair
  that is explicitly permitted to precede the repository specification amendment.
base_commit: "e1d93822b47234e940829319cac0dc9678f6906c"
integrator: "/root"

acceptance_criteria:
  - "Schema catalog drift and must_not_leak regressions are fixed at their producers without weakening assertions."
  - "The full non-live suite collects and passes on Python 3.11 and 3.12."
  - "src/dpone/readiness/airflow_compact_pack_release.py is split below the global 400 SLOC limit by cohesive responsibility."
  - "Compact-v1 runtime payload materialization accepts at most 64 distinct payloads, 268435456 bytes per payload, and 536870912 aggregate actual bytes; equality passes and a breach publishes no immutable release."
  - "Aggregate overflow through dpone gitops airflow release-materialize exits 2 with passed=false, the stable full blocker code, empty release identity/path, and no cache release publication."
  - "Module baseline v2 records exact LOC and SLOC caps with no headroom and rejects growth, stale debt, invalid ADR/commit identity, missing files, and unauthorized rename semantics."
  - "Module-size exact-byte CAS and final canonical verification never recreate a missing canonical parent namespace."
  - "All 19 legacy required checks are green on the exact PR head without admin bypass."

public_contract_impact:
  level: breaking
  surfaces:
    - "dpone docs check-module-size baseline schema and diagnostic output"
    - "docs/module_size_baseline.json repository quality contract"
    - "dpone.metrics.module_size legacy Python helpers remain source compatible"
    - "compact release-set v1 optional runtime-payload compatibility inventory"
    - "legacy CI quality checkout and module-size evidence bind the exact pull-request head"
  migration_required: true

