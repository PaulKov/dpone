  - docs/feature-design-standard.md
  - docs/adr/0028-frozen-release-policy-and-publication-boundary.md
  - docs/adr/0037-immutable-agent-pr-merge-closure.md
  - docs/adr/0047-module-size-debt-ratchet.md
  - docs/benchmarks/quality_budgets.yml
  - tools/agent_policy/control_surface.py
  - tools/agent_policy/task_contract.py

forbidden_paths:
