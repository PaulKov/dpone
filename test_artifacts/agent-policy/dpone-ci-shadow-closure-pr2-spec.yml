  - uv.lock
  - CHANGELOG.md
  - mkdocs.yml
  - .github/workflows
  - .agents/policy
  - evals/agent
  - src
  - tools/ci

shared_file_owner: "/root"

dependencies:
  - "Phase 0 frozen ledger in issue #512"
  - "PR 1 exact merge commit 0fa1b35bfd20c35fa0cb2a8c3dfa966d7afc11d4 is contained in PR 2 base 66e6b651e93b96a1e8b9b649095d9f2b53e8aa53 and satisfies the baseline prerequisite"
  - >-
    Integrator-only delta: /root owns and applies mkdocs.yml navigation after
    writer handoff; it is outside this path-scoped writer's owned_paths and
    remains forbidden to the writer. The writer reports the requested link in
    documentation_impact for integrator reconciliation.

required_checks:
  focused:
    - "uv run pytest tests/test_ci_shadow_spec_contracts.py tests/test_ci_shadow_reconciliation_contracts.py tests/test_ci_shadow_capacity_contracts.py tests/test_ci_shadow_capacity_validation_contracts.py tests/agent_policy/test_task_contract.py tests/test_docs_language_contracts.py -q"
    - "uv run python tools/agent_policy/task_contract.py test_artifacts/agent-policy/dpone-ci-shadow-closure-pr2-spec.yml"
  broad:
    - "uv run dpone docs check-docs"
    - "uv run dpone docs check-generated-references"
    - "uv run mkdocs build --strict"
    - "uv run python tools/agent_policy/select_checks.py --base-ref 66e6b651e93b96a1e8b9b649095d9f2b53e8aa53"
    - "Execute and record every command selected by select_checks.py; selection alone is not validation."
    - "uv run ruff check . && uv run ruff format --check . && uv run mypy --config-file mypy.ini"
    - "uv run dpone docs check-import-rules && uv run dpone docs check-layer-metrics --baseline docs/layer_metrics_baseline.json"
    - "uv run dpone docs check-module-size --baseline docs/module_size_baseline.json --base-ref 66e6b651e93b96a1e8b9b649095d9f2b53e8aa53 --head-ref $(git rev-parse HEAD)"
    - "uv run pytest -m 'not integration_live' -n auto --dist loadfile"
  live:
    - "All nineteen unchanged legacy required checks on the exact PR head without bypass"

required_outputs:
  - implementation
  - tests
  - documentation_impact
  - completion_report

completion_statuses:
  allowed:
    - PASS
    - FAIL
    - SKIP
    - N/A
    - UNVERIFIED

stop_conditions:
  - "Required edit falls outside owned_paths."
  - "Approved specification is missing or contradicted."
  - "Public-contract impact is larger than declared."
  - "A live check requires unapproved credentials or environment."
  - "Another writer owns the same semantic contract."
  - "The exact PR 2 base does not contain PR 1 merge commit 0fa1b35bfd20c35fa0cb2a8c3dfa966d7afc11d4."
  - "The exact PR 2 head lacks repository owner attestation."
  - "Any workflow, protection policy, release surface, tag, variable, or production source changes."
