acceptance_criteria:
  - Second activation retires its predecessor before acquiring new fencing epochs.
  - Historical retirement survives catalog observation changes without guard bypass.
  - Incomplete attempts retain exact ownership and block pointer mutation.
  - Durable bounded handover intent resumes exact identity after interruption.
