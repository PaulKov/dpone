schema_version: 1
task_id: "DPONE-AIRFLOW-ASSET-PARTITIONS-V1"
title: "Propagate one temporal asset partition into Airflow 3.2+"
goal: "Make one declarative dpone asset partition native on Airflow 3.2+ and explicitly degraded on earlier supported versions."
specification: "docs/feature-design-airflow-asset-partitions-v1.md"
base_commit: "2f8d2529"
integrator: "current Codex task"

acceptance_criteria:
  - "A user declares one temporal dimension once in an asset inlet/outlet mapping."
  - "Build inference preserves partition identity and blocks mismatches or mixed producer contracts."
  - "Airflow 3.2+ uses CronPartitionTimetable and PartitionedAssetTimetable with identity mapping."
  - "Airflow 3.0/3.1 and 2.x preserve existing schedules and report degraded_unpartitioned."
  - "Runtime evidence records the actual optional partition key without inferring it from logical_date."
  - "Airflow parse performs no network, metadata DB, Variable, Connection, Vault, Kubernetes, or cache-refresh calls."

public_contract_impact:
  level: compatible
  surfaces:
    - "airflow.execution.inlets/outlets partition metadata"
    - "gitops.airflow_dag_spec partition_plan"
    - "RunInterval and Airflow runtime evidence"
    - "dpone-airflow-pack timetable materialization"
  migration_required: false

