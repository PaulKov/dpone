schema_version: 1
task_id: "work-item-runtime"
title: "PostgreSQL XMin key reconciliation and atomic MSSQL finalizer"
goal: "Implement the approved runtime contracts and focused regression tests without editing shared schemas or release files."
specification: "docs/feature-design-postgres-xmin-key-reconciliation-mssql-v1.md"
base_commit: "0aacebbbf"
integrator: "/root"

acceptance_criteria:
  - "XMin extraction can return a bounded delta and complete-key artifact from one snapshot envelope."
  - "MSSQL finalization supports timestamp_only, timestamp_and_flag, and flag_only with exact lifecycle metrics."
  - "Target mutation, CAS checkpoint, and commit receipt can share one MSSQL transaction."
  - "Focused tests prove no-op, delete, repeated delete, reactivation, rollback, and state identity behavior."

public_contract_impact:
  level: compatible
  surfaces:
    - "runtime source extraction contracts"
    - "MSSQL staged-load and state ports"
    - "technical columns"
  migration_required: true

