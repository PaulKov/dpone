  - "tests/test_airflow_authoring_mode_migration_v1.py"
  - "tests/test_gitops_schema_contracts.py"
  - "tests/test_manifest_schema_reference_docs.py"
  - "test_artifacts/airflow-authoring-mode-migration-v1/**"
  - "test_artifacts/agent-policy/airflow-authoring-mode-migration-v1.yml"
read_only_paths:
  - "src/dpone/manifest/authoring.py"
  - "src/dpone/manifest/authoring_folder.py"
  - "src/dpone/readiness/airflow_pipeline_source.py"
  - "docs/adr/0006-authority-and-canonical-ir.md"
  - "docs/adr/0015-single-authoring-compiler.md"
forbidden_paths:
