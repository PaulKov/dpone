schema_version: 1
task_id: "DPONE-AIRFLOW-AUTHORING-MIGRATION-V1"
title: "Airflow authoring-mode migration v1"
goal: "Implement plan-first, semantically equivalent classic/flow/folder source migration."
specification: "docs/feature-design-airflow-authoring-mode-migration-v1.md"
base_commit: "2a3d6d03819a24a7df42738454b18a13be11ad21"
integrator: "Codex"

acceptance_criteria:
  - "All six directed classic/flow/folder migrations preserve the canonical semantic fingerprint."
  - "Same-mode migration is a deterministic no-op."
  - "Apply is path-confined, checksum guarded, atomic at the primary source and never deletes old fragments."
  - "Recipe sources and conflicting fragments fail closed without writes."
  - "CLI, JSON Schema, generated reference, docs and tests are synchronized."

public_contract_impact:
  level: compatible
  surfaces:
    - "CLI: dpone migrate authoring"
    - "Schema: dpone.authoring-migration.v1"
    - "Structured authoring migration errors"
  migration_required: false

owned_paths:
