  - "docs/compatibility.md"
  - "docs/cli-reference.md"
  - "docs/reference/manifest-schemas.md"
  - "docs/schemas/gitops/authoring-migration.schema.json"
  - "docs/errors/DPONE_AUTHORING_MIGRATION_*.md"
  - "src/dpone/commands/migrate_authoring_cmd.py"
  - "src/dpone/commands/registry.py"
  - "src/dpone/commands/registry_migrate.py"
  - "src/dpone/manifest/authoring_migration_models.py"
  - "src/dpone/manifest/authoring_migration_service.py"
  - "src/dpone/manifest/authoring_migration_io.py"
  - "src/dpone/manifest/authoring_migration_rendering.py"
