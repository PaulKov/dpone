schema_version: 1
task_id: "DPONE-CI-SHADOW-PR3A-IMPLEMENTATION"
title: "Implement the approved PR 3A CI-hygiene contract"
goal: >-
  Implement the merged APPROVED PR 3A specification exactly: deterministic
  locked installs, bounded Dependabot and compatibility work, scoped
  concurrency, least-privilege Pages and Dependency Review, fail-closed
  recovery, executable governance tests, and self-service documentation.
specification: "docs/feature-design-ci-shadow-pr3a-ci-hygiene.md"
base_commit: "bc3d56093b4adb2eae94a475f20d5e3e1721b1ec"
integrator: "/root"

acceptance_criteria:
  - "The merged PR 3A security amendment is APPROVED at base bc3d56093b4adb2eae94a475f20d5e3e1721b1ec and its exact specification blob remains the implementation authority."
  - "Dependabot, locked-sync, PR cancellation, nightly queue, Airflow matrix ceilings, Pages ordering/recovery, and Dependency Review match the approved exact values and failure semantics."
  - "Every Pages/Dependency Review permission, event, run-attempt, SHA, job, step, and provider-evidence boundary fails closed under missing, stale, foreign, duplicate, rerun, partial-pagination, and API-error cases."
  - "The temporary actionlint 1.7.12 queue waiver is checksum-pinned, exact-file/exact-message scoped, executable on Linux and Darwin, and guarded by the removal tripwire."
  - "All five release-sensitive workflows remain byte-identical to the implementation base; no required-check, protection, App, release, package, source, or runtime authority changes."
  - "The exact contributor/workflow/runbook/Pages/branch-protection/testing docs and CHANGELOG are updated, and quality metrics are regenerated through their producer."
  - "The github-actions, dependencies, and python:uv labels are read back exactly before implementation tests and merge."
  - "Hosted evidence covers PR cancellation, nightly queue/rerun, Pages PR and monotonic current-master deployment, native Dependency Review on PR and exact master, all required checks, owner attestation, Agent PR receipt, and no bypass."

public_contract_impact:
  level: compatible
  surfaces:
    - "repository CI and dependency automation"
    - "GitHub Pages build and deployment recovery"
    - "Dependency Review evidence"
    - "contributor and operator documentation"
  migration_required: false

owned_paths:
  - docs/ci-cd.md
  - docs/cicd/workflows.md
  - docs/cicd/runbooks.md
  - docs/developer-ci-cd.md
  - docs/cicd/release-and-pages.md
  - docs/github-pages.md
  - docs/github-branch-protection.md
  - docs/testing/overview.md
  - docs/testing/index.md
  - tests/test_github_workflow_governance.py
  - tests/test_github_ci_postgres_xmin.py
  - tests/test_oss_release_readiness.py
  - tests/agent_policy/test_workflow_security.py
  - tests/test_ci_shadow_pr3a_contracts.py
  - tests/test_ci_shadow_pr3a_actionlint.py
  - tests/test_ci_shadow_pr3a_dependabot_and_sync.py
  - tests/test_ci_shadow_pr3a_workflow_concurrency.py
  - tests/test_ci_shadow_pr3a_pages_implementation.py
  - tests/test_ci_shadow_pr3a_pages_guard.py
  - tests/test_ci_shadow_pr3a_label_probe.py
  - tests/test_ci_shadow_pr3a_label_evidence.py
  - tests/test_ci_shadow_pr3a_dependency_review.py
  - tests/agent_policy/test_ci_shadow_pr3a_implementation_contract.py
  - test_artifacts/agent-policy/dpone-ci-shadow-closure-pr3a-ci-hygiene.yml

read_only_paths:
  - docs/feature-design-ci-pr-gate-exact-sha-evidence.md
  - docs/adr/0048-exact-sha-readiness-evidence.md
  - docs/feature-design-standard.md
  - docs/documentation-standard.md
  - docs/engineering-standards.md
  - docs/agent-development.md
  - docs/agent-task-contracts.md
  - docs/benchmarks/quality_budgets.yml
  - tools/agent_policy/task_contract.py

