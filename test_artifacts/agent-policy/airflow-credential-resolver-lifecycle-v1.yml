schema_version: 1
task_id: "DPONE-AIRFLOW-CREDENTIAL-RESOLVER-LIFECYCLE-V1"
title: "Certify credential resolver rotation and recovery"
goal: "Enforce and prove workload-scoped credential rotation, failure, recovery and safe evidence semantics."
specification: "docs/feature-design-airflow-credential-resolver-lifecycle-v1.md"
base_commit: "26105f83"
integrator: "current Codex task"

acceptance_criteria:
  - "Vault latest/workload_start resolves once per connection ref and workload."
  - "A later workload observes a rotated Vault KV v2 version while an active workload retains its resolved version."
  - "Backend failures are not cached and recovery succeeds without leaking backend details."
  - "Unsupported pinned and dag_run_start policies fail before backend I/O with stable codes."
  - "Vault KV v2 version metadata and every declared mapped field are mandatory."
  - "Local contract evidence is separated from live Vault/Kubernetes/Airflow certification."

public_contract_impact:
  level: compatible
  surfaces:
    - "runtime credential resolution errors"
    - "dpone check --connections diagnostics"
    - "Vault KV v2 safe credential evidence"
  migration_required: true

owned_paths:
  - "docs/feature-design-airflow-credential-resolver-lifecycle-v1.md"
  - "src/dpone/contracts/credential_resolution.py"
  - "src/dpone/runtime/credentials/binding_evidence.py"
  - "src/dpone/runtime/credentials/binding_resolver.py"
  - "src/dpone/readiness/airflow_connection_credential_checks.py"
  - "src/dpone/readiness/airflow_connection_check_support.py"
  - "src/dpone/readiness/safe_sample_clickhouse_target.py"
  - "src/dpone/services/mssql_clickhouse_safe_sample_execution.py"
  - "src/dpone/services/safe_sample_execution_common.py"
  - "src/dpone/services/safe_sample_target_lifecycle.py"
  - "tests/test_airflow_credential_resolver_lifecycle.py"
  - "tests/test_runtime_workload_scoped_credential_resolver.py"
  - "docs/airflow-credential-resolver-lifecycle.md"
  - "docs/getting-started/credentials-quickstart.md"
  - "docs/quality-metrics.md"
  - "docs/airflow-self-service.md"
  - "docs/airflow-pack-provider.md"
  - "docs/compatibility.md"
  - "docs/airflow-self-service-backlog.md"
  - "docs/adr/0012-vault-runtime-authentication.md"
  - "docs/errors/DPONE_CREDENTIAL_BACKEND_UNAVAILABLE.md"
  - "docs/errors/DPONE_CREDENTIAL_DAG_RUN_SCOPE_UNSUPPORTED.md"
  - "docs/errors/DPONE_CREDENTIAL_FIELD_MISSING.md"
  - "docs/errors/DPONE_CREDENTIAL_PINNED_VERSION_UNSUPPORTED.md"
  - "docs/errors/DPONE_CREDENTIAL_VERSION_METADATA_MISSING.md"
  - "test_artifacts/airflow-credential-resolver-lifecycle-v1/**"
  - "test_artifacts/agent-policy/airflow-credential-resolver-lifecycle-v1.yml"

read_only_paths:
  - "src/dpone/readiness/safe_sample_live_runtime.py"
  - "src/dpone/gitops/schema_environment_contracts.py"
  - "docs/schemas/gitops/connection-registry.schema.json"
  - "packages/dpone-airflow-pack/**"

forbidden_paths:
  - ".cursor/**"
  - "CHANGELOG.md"
  - "pyproject.toml"
  - "uv.lock"
  - "mkdocs.yml"
  - ".github/workflows/**"

shared_file_owner: "current Codex task"

dependencies:
  - "Phase 1B backend-neutral binding-set and workload-scoped runtime resolver"
  - "ADR 0012 Vault runtime authentication"

required_checks:
  focused:
    - "uv run pytest tests/test_airflow_credential_resolver_lifecycle.py tests/test_runtime_workload_scoped_credential_resolver.py tests/test_airflow_runtime_phase1b_contracts.py tests/test_airflow_self_service_cli.py -q"
  broad:
    - "uv run python tools/agent_policy/select_checks.py --base-ref origin/master"
    - "uv run ruff check ."
    - "uv run ruff format --check ."
    - "uv run mypy --config-file mypy.ini"
    - "uv run dpone docs check-import-rules"
    - "uv run dpone docs check-layer-metrics --baseline docs/layer_metrics_baseline.json"
    - "uv run dpone docs check-module-size --baseline docs/module_size_baseline.json"
    - "uv run pytest -m 'not integration_live' -n auto --dist loadfile"
    - "uv run dpone docs check-docs"
    - "uv run mkdocs build --strict"
  live:
    - "UNVERIFIED until an approved Vault/Kubernetes/Airflow environment produces current rotation and recovery evidence"

required_outputs:
  - implementation
  - tests
  - documentation_impact
  - completion_report

completion_statuses:
  allowed:
    - PASS
    - FAIL
    - SKIP
    - N/A
    - UNVERIFIED

stop_conditions:
  - "Required edit falls outside owned_paths."
  - "Approved specification is missing or contradicted."
  - "Public-contract impact is larger than declared."
  - "A live check requires unapproved credentials or environment."
  - "Another writer owns the same semantic contract."
  - "Secret values, Vault paths or backend response text enter errors or evidence."
  - "Airflow parse imports Vault or performs credential I/O."
  - "A required edit touches user-owned .cursor files."
