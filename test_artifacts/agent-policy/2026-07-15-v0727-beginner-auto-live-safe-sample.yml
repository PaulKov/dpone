schema_version: 1
task_id: "DPONE-V0727-BEGINNER-AUTO-LIVE-SAMPLE"
title: "Execute verified live safe samples from the beginner facade"
goal: >-
  Complete the fifth self-service command by automatically selecting the
  existing signed, deployment-pinned live runtime when platform-owned inputs
  are complete, while preserving network-free fallback and fail-closed trust
  ordering without adding beginner flags or a second execution engine.
specification: "docs/feature-design-beginner-auto-live-safe-sample-v0727.md"
base_commit: "2d7bc688"
integrator: "codex/v0.72.7-beginner-live-sample"

acceptance_criteria:
  - "The five-command beginner path needs no additional command or platform-only argument for a prepared environment."
  - "A complete deployment-scoped authorization overlay invokes the existing live assembly and runtime runner exactly once."
  - "An absent overlay preserves the network-free local handoff; a partial or unsafe overlay fails closed with a structured blocker."
  - "Signature, subject, source pin, environment fingerprints, schemas, route binding, and policy are verified before credentials or database I/O."
  - "CLI output distinguishes live_copy, local_handoff, and blocked; runtime evidence records executed live_copy/local_handoff modes without exposing secrets or infrastructure-sensitive registry content."
  - "Explicit platform safe-sample runtime commands and all existing authoring/release/deployment schemas remain compatible."

public_contract_impact:
  level: compatible
  surfaces:
    - cli
    - structured_errors
    - runtime_evidence
    - documentation
    - platform_cache_layout
  migration_required: false
  migration: "Platform CI may materialize the documented deployment-scoped route-authorization overlay to opt into automatic live execution."

