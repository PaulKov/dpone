# Status: APPROVED; current-master preservation and local Docker scope reaffirmed by maintainer.
schema_version: 1
task_id: PUBLIC-CLEAN-CAPACITY-V1
title: Bounded complete-tree gate capacity amendment
goal: Support reviewed full-tree finding capacity without weakening coverage or failure
  semantics.
specification: docs/feature-design-public-clean-migration-v1.md
base_commit: 3977ca2d04ca5dbcf3338d7c31faff8a1199549e
integrator: parent-integrator
acceptance_criteria:
- Approve the private capacity amendment and this scoped contract before implementation.
- Support at most 100000 findings and exact-occurrence exceptions, with 64 MiB review
  and receipt limits.
- Preserve the independent 10000 protected-ticket position limit and all other existing
  bounds.
- Use linear exact-key review matching preserving duplicate and repeated-exception
  rejection and original remaining order.
- Validate boundary, maximum-byte inputs, <=2 GiB peak RSS and <900 seconds on the
  named environment.
- Run complete candidate, history and worktree scans separately; no diagnostic fragments
  imply clearance.
- Obtain fresh implementation reviews; preserve existing broad FAIL evidence.
- User additionally requires local Docker tests and comprehensive corner-case regression
  coverage, 2026-09-09.
- Preserve upstream 0.74.34, 0.74.35 and 0.74.36 behavior on current master.
- Coalesce overlapping unapproved-host observations at the existing exact occurrence
  key while preserving longer unknown matches and duplicate-review rejection.
public_contract_impact:
  level: compatible
  surfaces:
  - repository-tooling
  migration_required: false
owned_paths:
- tools/agent_policy/public_clean_gate.py
- tools/agent_policy/public_clean_policy.py
- tools/agent_policy/public_clean_candidate.py
- tools/agent_policy/public_clean_history.py
- tools/agent_policy/public_clean_worktree.py
