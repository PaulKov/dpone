- tests/test_public_clean_gate_failures.py
- docs/feature-design-public-clean-migration-v1.md
- docs/public-clean-migration.md
- test_artifacts/agent-policy/public-clean-migration-v1.yml
- tools/agent_policy/public_clean_limits.py
- tests/test_public_clean_capacity.py
integrator_owned_paths:
- mkdocs.yml
- CHANGELOG.md
read_only_paths:
- tools/agent_policy/tenant_hygiene.py
- docs/agent-development.md
- docs/source-sink/postgres-to-mssql.md
forbidden_paths:
- src
- pyproject.toml
- uv.lock
- CHANGELOG.md
- mkdocs.yml
- .github/workflows
shared_file_owner: parent-integrator
dependencies:
- 'APPROVED: maintainer approved the capacity amendment and this scoped contract.'
required_checks:
  focused:
  - uv run pytest tests/test_public_clean_gate.py tests/test_public_clean_gate_failures.py
    tests/test_public_clean_capacity.py -q
  - 'Docker: isolated Python 3.12.11 Linux container; all local gate tests, no network
    during tests.'
  broad:
  - uv run python tools/agent_policy/select_checks.py --base-ref origin/master
  - uv run ruff check .
  - uv run ruff format --check .
  - uv run mypy --config-file mypy.ini
  - uv run dpone docs check-import-rules
  - uv run dpone docs check-layer-metrics --baseline docs/layer_metrics_baseline.json
  - uv run dpone docs check-module-size --baseline docs/module_size_baseline.json
    --base-ref 3977ca2d04ca5dbcf3338d7c31faff8a1199549e --head-ref HEAD
  - uv run pytest -m "not integration_live" -n auto --dist loadfile
  - uv run dpone docs check-docs
  - uv run pytest tests/test_docs_language_contracts.py -q
  - uv run mkdocs build --strict
  live: []
required_outputs:
- implementation
- tests
- documentation_impact
- completion_report
completion_statuses:
  allowed:
  - PASS
  - FAIL
  - SKIP
  - N/A
  - UNVERIFIED
stop_conditions:
- Specification or task approval is missing.
- Required edit falls outside owned_paths.
- Approved specification is missing or contradicted.
- Public-contract impact is larger than declared.
- A live check requires unapproved credentials or environment.
- Another writer owns the same semantic contract.
- Private input cannot be inspected without disclosure.
- Source mutation or private object import would be required.
- Live credentials or publication authority would be required.
