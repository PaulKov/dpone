schema_version: 1
task_id: "DPONE-V0729-AIRFLOW-CONNECTION-SECRET-GC"
title: "Garbage collect retained Airflow Connection Secrets safely"
goal: >-
  Close the attempt-Secret lifecycle with metadata-only, active-Pod-aware,
  plan-first and conditionally deleted Kubernetes garbage collection without
  exposing credentials or adding Airflow parse-time I/O.
specification: "docs/feature-design-airflow-connection-secret-gc-v0729.md"
base_commit: "0cb951f2"
integrator: "codex/v0.72.9-airflow-secret-retention-gc"

acceptance_criteria:
  - "Provider-created attempt Secrets and Pods carry only validated digest lifecycle metadata and preserve user metadata."
  - "GC inventory accepts only paginated PartialObjectMetadataList responses and never falls back to full Secret or Pod objects."
  - "Every existing managed Pod and every young Secret protects the matching credential object from deletion."
  - "Confirmed apply rebuilds a fresh plan and deletes a bounded deterministic batch with UID and resourceVersion preconditions."
  - "Concurrent absence/change, partial failure, malformed metadata and pagination failures are reported truthfully without secret or topology leakage."
  - "Existing compact packs remain compatible and pre-v0.72.9 unlabelled Secrets are never auto-adopted."

public_contract_impact:
  level: compatible
  surfaces:
    - airflow_provider_kubernetes_metadata
    - airflow_platform_cli
    - python_application_service
    - gitops_json_schemas
    - structured_errors
    - compatibility_and_runbook_docs
  migration_required: true
  migration: >-
    Custom Secret projectors must preserve supplied lifecycle metadata; platform
    operators add dedicated namespace-scoped inventory/delete RBAC before
    enabling apply. Existing unlabelled objects remain manual cleanup.

