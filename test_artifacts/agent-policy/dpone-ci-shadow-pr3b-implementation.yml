schema_version: 1
task_id: "DPONE-CI-SHADOW-PR3B-IMPLEMENTATION"
title: "Implement the approved PR 3B semantic privilege boundary"
goal: >-
  Implement the merged APPROVED PR 3B specification exactly: a bounded and
  deterministic semantic scanner for pull-request-reachable authority, closed
  policy and evidence schemas, compatible umbrella integration, action-only
  CodeQL, an atomic read-only governance producer/source-free attestation
  split, adversarial tests, and self-service documentation.
specification: "docs/feature-design-ci-shadow-pr3b-semantic-privilege-boundary.md"
base_commit: "b3200e89ef375eeead7213e2c13d7c0fb33ff659"
integrator: "/root"

acceptance_criteria:
  - "The exact implementation base is the receipt-proven squash integration b3200e89ef375eeead7213e2c13d7c0fb33ff659; it contains the APPROVED child and public-output amendment, the ACCEPTED ADR 0037 amendment, and the frozen authority blobs recorded by the implementation contract test."
  - "The standalone semantic scanner implements the approved fixed paths, formats, canonical bytes, streams, exits, stable statuses, finding codes, recovery IDs, no-write/no-network behavior, and schema-valid deterministic v1 report without adding a supported Python-package API."
  - "Snapshot acquisition, duplicate-safe parsing, graph construction, closed three-valued expressions, effective authority, exact profiles, report validation/rendering, orchestration, and CLI composition remain separate cohesive modules below repository quality budgets and do not import production runtime packages or tests."
  - "Every normalized root and graph-derived route has complete route-specific authority evidence; cycles, unsupported or external edges, unknown privileged guards or permissions, resource limits, concurrent mutation, and incomplete identities fail closed without false PASS or partial output."
  - "The exact CodeQL, governance-source, governance-attestation, and merge-closure profiles match only their approved trigger, route, permission, runner, action, input, artifact, and resolved-envelope fingerprints; missing, duplicate, copied, renamed, moved, weakened, or drifted variants block integration."
  - "The pre-split base quality job and legacy CodeQL config remain reproducible RED fixtures; the implementation atomically makes quality read-only, adds one read-only governance-source producer and one source-free governance-attestation finalizer, narrows CodeQL, and deletes the custom config."
  - "The repaired legacy workflow-security schema validates the checked-in policy, supports mutually exclusive workflow-level or job-scoped exceptions, requires all approved controls, and cannot override a semantic finding."
  - "The existing workflow_security.py JSON fields, text ordering, summary, and exit behavior remain compatible; semantic findings append atomically after legacy errors, ordinary internal failures map to the one fixed umbrella error, and BaseException subclasses propagate unchanged."
  - "The agent-pr-receipt, merge-closure, release, runtime, package, source, dependency, required-context, protection, App, secret, environment, tag, variable, and publication authorities remain unchanged."
  - "Focused unit, integration, mutation, limits, compatibility, current-repository, docs, broad non-live, and hosted exact-head evidence all pass; mocked, skipped, unavailable, or stale provider evidence remains explicitly non-PASS."
  - "The workflow-author, security-reviewer, contributor, and operator journey covers Discover through Upgrade, including the stable semantic-pr-privilege-boundary runbook anchor, all finding/recovery pairs, exact recheck commands, internal-failure escalation, safe rollback, and CodeQL migration."
  - "The certification artifact is produced only from the standalone CLI's canonical JSON stdout at the approved path, validates against the exact v1 report schema, and adds no wrapper fields or independent decision authority."
  - "The cumulative implementation diff is confined to owned_paths plus integrator_owned_paths; frozen specifications, ADR 0037, design/amendment tasks, receipt workflow, release workflows, runtime/data-plane code, packages, dependency files, and repository settings stay byte-identical to the implementation base."

