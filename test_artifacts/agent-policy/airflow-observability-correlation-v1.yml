read_only_paths:
  - "docs/airflow-self-service-architecture.md"
  - "docs/adr/0008-airflow-parse-safe-provider.md"
  - "docs/adr/0013-reproducible-rerun-and-retention.md"
  - "src/dpone/contracts/airflow_run_identity.py"
  - "packages/dpone-airflow-pack/**"

forbidden_paths:
  - ".cursor/**"
  - "pyproject.toml"
  - "uv.lock"
  - "mkdocs.yml"
  - ".github/workflows/**"

shared_file_owner: "current Codex task"

dependencies:
  - "Airflow run identity and reproducible rerun implementation"
  - "Bounded mapping implementation at commit b4255dd1"

required_checks:
  focused:
    - "uv run pytest tests/test_airflow_observability_correlation.py tests/test_gitops_airflow_evidence_bundle.py tests/test_gitops_airflow_xcom_inline_evidence.py tests/test_observability.py tests/test_operations_maturity_services.py tests/test_cli_operations_commands.py -q"
  broad:
    - "uv run python tools/agent_policy/select_checks.py --base-ref origin/master"
    - "uv run ruff check ."
    - "uv run ruff format --check ."
    - "uv run mypy --config-file mypy.ini"
    - "uv run dpone docs check-import-rules"
    - "uv run dpone docs check-layer-metrics --baseline docs/layer_metrics_baseline.json"
    - "uv run dpone docs check-module-size --baseline docs/module_size_baseline.json"
    - "uv run pytest -m 'not integration_live' -n auto --dist loadfile"
    - "uv run dpone docs check-docs"
    - "uv run mkdocs build --strict"
  live:
    - "UNVERIFIED until an approved Airflow/Kubernetes run produces pod, evidence, OpenLineage and OTel backend artifacts"

required_outputs:
  - implementation
  - tests
  - documentation_impact
  - completion_report

completion_statuses:
  allowed:
    - PASS
    - FAIL
    - SKIP
    - N/A
    - UNVERIFIED

stop_conditions:
  - "Required edit falls outside owned_paths."
  - "Approved specification is missing or contradicted."
  - "Public-contract impact is larger than declared."
  - "A live check requires unapproved credentials or environment."
  - "Another writer owns the same semantic contract."
  - "Correlation is added to mutable AirflowRunIdentity."
  - "Exporter performs network I/O or provider parse imports an observability SDK."
  - "Synthetic trace/span IDs or arbitrary baggage are introduced."
  - "A required edit touches user-owned .cursor files."
