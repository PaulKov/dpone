schema_version: 1
task_id: "DPONE-AIRFLOW-OBSERVABILITY-CORRELATION-V1"
title: "Correlate Airflow, dpone runtime, immutable artifacts, evidence and pod telemetry"
goal: "Emit one validated non-secret identity across Airflow evidence, OpenLineage and OpenTelemetry-compatible artifacts."
specification: "docs/feature-design-airflow-observability-correlation-v1.md"
base_commit: "a8d64e25"
integrator: "current Codex task"

acceptance_criteria:
  - "One deterministic correlation ID joins Airflow attempt, release, deployment and workload pack."
  - "Complete release evidence also proves dpone run ID, runtime evidence digest and observed pod UID."
  - "OpenLineage and OTel artifacts project the same correlation without network I/O."
  - "No synthetic OTel trace/span IDs, arbitrary baggage or high-cardinality Prometheus labels are emitted."
  - "Existing exporter behavior remains compatible when no Airflow evidence bundle is supplied."
  - "Airflow provider parsing imports no OpenLineage, OTel, Vault or Kubernetes runtime client."

public_contract_impact:
  level: compatible
  surfaces:
    - "dpone.airflow-correlation.v1"
    - "gitops.airflow_xcom_summary additive dpone_run projection"
    - "gitops.airflow_evidence_bundle additive correlation section"
    - "dpone ops lineage-export optional --airflow-evidence-bundle"
    - "dpone observability metrics-export optional --airflow-evidence-bundle"
  migration_required: false

owned_paths:
  - "docs/feature-design-airflow-observability-correlation-v1.md"
  - "docs/adr/0020-airflow-observability-correlation.md"
  - "docs/adr-index.md"
