stop_conditions:
  - "Required edit falls outside owned_paths."
  - "Approved specification is missing or contradicted."
  - "Public-contract impact is larger than declared."
  - "A live check requires unapproved credentials or environment."
  - "Another writer owns the same semantic contract."
  - "Implementation maps a dpone release or pack one-to-one to an Airflow DAG Bundle."
  - "Runtime resolves current instead of using the parsed release/deployment pins."
  - "Provider parse reads network, metadata DB, Variable, Connection, Vault, Kubernetes, or refreshes cache."
  - "Identity contains secret values, Vault paths, signed URLs, or registry bodies."
  - "A required edit touches user-owned .cursor files."
