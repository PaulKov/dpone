schema_version: 1
task_id: "DPONE-AIRFLOW-RUN-IDENTITY-RERUN-V1"
title: "Correlate Airflow run identity and plan reproducible reruns"
goal: "Carry one verified release/deployment/DAG/pack/bundle identity through a workload attempt and independently plan bundle/artifact reruns."
specification: "docs/feature-design-airflow-run-identity-rerun-v1.md"
base_commit: "7d058420"
integrator: "current Codex task"

acceptance_criteria:
  - "Index-backed provider tasks carry one bounded non-secret dpone.airflow-run-identity.v1."
  - "XCom and evidence bundle preserve and validate the exact runtime-observed identity."
  - "Rerun planning selects original/latest Airflow bundle independently from original/latest dpone artifacts."
  - "Critical original reruns block non-versioned bundles and unavailable releases/deployments."
  - "No planner network call, Airflow metadata access, secret lookup, cache refresh, or remote mutation occurs."
  - "Airflow parse remains within existing side-effect and performance budgets."

public_contract_impact:
  level: compatible
  surfaces:
    - "dpone.airflow-run-identity.v1"
    - "gitops.airflow_xcom_summary optional run_identity"
    - "gitops.airflow_evidence_bundle optional run_identity"
    - "dpone.airflow-rerun-plan.v1"
    - "dpone airflow rerun-plan"
  migration_required: false

