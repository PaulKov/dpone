  focused:
    - "uv run pytest tests/test_ci_shadow_pr3b_output_amendment_contracts.py tests/test_ci_shadow_pr3b_squash_receipt_contracts.py tests/test_ci_shadow_pr3b_squash_receipt_failures.py tests/test_ci_shadow_pr3b_spec_contracts.py tests/test_ci_shadow_pr3b_scope_contracts.py tests/test_ci_shadow_pr3b_schema_contracts.py tests/test_ci_shadow_pr3b_report_contracts.py tests/test_ci_shadow_pr3b_report_routes_contracts.py tests/test_ci_shadow_pr3b_report_limits_contracts.py tests/agent_policy/test_task_contract.py tests/test_docs_language_contracts.py -q"
    - "uv run python tools/agent_policy/task_contract.py test_artifacts/agent-policy/dpone-ci-shadow-pr3b-public-output-amendment.yml"
  broad:
    - "uv run python tools/agent_policy/select_checks.py --base-ref f18298c14af247225758f7fe8901bc8462994dd4"
    - "Execute every selected non-live check and report unavailable live evidence as UNVERIFIED."
    - "uv run ruff check tests/test_ci_shadow_pr3b_output_amendment_contracts.py tests/test_ci_shadow_pr3b_scope_contracts.py && uv run ruff format --check tests/test_ci_shadow_pr3b_output_amendment_contracts.py tests/test_ci_shadow_pr3b_scope_contracts.py"
    - "uv run dpone docs check-docs && uv run dpone docs check-generated-references && uv run dpone docs update-dev-metrics --check && uv run mkdocs build --strict"
    - "git diff --check"
  live:
    - "N/A for design clarification semantics; merge still requires every exact-head protected check, owner attestation, Agent PR receipt, and no bypass."

required_outputs:
