  - tests
  - documentation_impact
  - completion_report

completion_statuses:
  allowed:
    - PASS
    - FAIL
    - SKIP
    - N/A
    - UNVERIFIED

stop_conditions:
  - "Required edit falls outside owned_paths."
  - "A delegated writer edits integrator_owned_paths, or integrator differs from shared_file_owner."
  - "Approved specification is missing or contradicted."
  - "Approved PR3B design, accepted ADR0037, or exact amendment base/blob authority is missing or contradicted."
  - "Public-contract impact is larger than declared."
  - "A live check requires unapproved credentials or environment."
  - "Another writer owns the same semantic contract."
  - "Any production workflow, policy, tool, schema, runtime, package, dependency, release, provider, or live setting change is required."
  - "The amendment adds a public warning/proof-trace field or allows semantic UNVERIFIED to remain only a warning."
  - "An internal semantic failure can raise through the umbrella, become a warning or success, change the umbrella exit from 1, leak a traceback, or publish any partial semantic finding."
  - "The active task-changing scope head has a non-ancestor base or a committed path set different from owned_paths plus integrator_owned_paths; while RESEARCHED it differs from HEAD, a later successor changes bytes beyond the exact lifecycle pair, or any reachable post-squash commit touches the approved specification/task paths even if their final blobs are restored."
  - "The PR 539 integration method is not receipt-proven squash with one parent and the APPROVED task introduced on the canonical first-parent chain."
  - "The post-merge journey cannot select exact squash evidence or tells the operator that rerunning can repair a deterministic integration-identity failure."
  - "The receipt check emits raw jq/git diagnostics, classifies unavailable or incomplete evidence as deterministic FAIL, or classifies a complete proven identity mismatch as transient UNVERIFIED."
  - "A raw-byte, schema, binding, isolated-import, pinned-history, graft/replace, or shallow-history violation can authorize implementation, or any proven receipt/header/lifecycle/history mismatch is hidden behind later local-object unavailability."
  - "An implementation task or production edit can begin before the clarification post-merge squash receipt is PASS."
  - "Deterministic recovery deletes, re-adds, or reuses the v1 task path instead of requiring a separately approved versioned v2 recovery amendment and receipt."
  - "PR3B implementation begins before this amendment is APPROVED and merged."
