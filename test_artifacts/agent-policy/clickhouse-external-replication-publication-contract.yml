schema_version: 1
task_id: "DPONE-CLICKHOUSE-EXTERNAL-PUBLICATION"
title: "Safe ClickHouse external-replication full-refresh publication"
goal: "Stage and publish one complete generation on every required external-replication member without duplicate insert or false success."
specification: "docs/feature-design-clickhouse-external-replication-publication-v1.md"
base_commit: "ee9c8fc842e52bbdb6e333b6669d0b013009035d"
integrator: "primary-agent"

acceptance_criteria:
  - "Uniform internal_replication=false is admitted only with explicit external mode and non-replicated MergeTree."
  - "Authority is acquired before member candidate mutation."
  - "Every required member receives and verifies one complete immutable generation without blind append retry."
  - "Operation, generation, member, artifact, inventory, and plan identities are deterministic and fenced."
  - "Partial staging or publication never advances source state or reports success."
  - "Same-operation retry and completed replay are idempotent."
  - "Cleanup removes only exact predecessor identities and remains recoverable."
  - "Internal replication, local publication, legacy behavior, and V1 receipt recovery remain compatible."
  - "Evidence is redacted and live external certification is UNVERIFIED without an approved environment."

public_contract_impact:
  level: compatible
  surfaces:
    - manifest
    - runtime
    - state
    - evidence
    - documentation
  migration_required: true

