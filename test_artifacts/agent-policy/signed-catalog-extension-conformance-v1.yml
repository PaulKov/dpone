schema_version: 1
task_id: "SIGNED-CATALOG-EXTENSION-CONFORMANCE-V1"
title: "Signed catalog bundles and closed extension conformance v1"
goal: >-
  Implement externally signed, content-addressed recipe/connection-registry
  bundles and a closed evidence-based conformance suite without adding Airflow
  parse-time I/O, runtime template execution, or false production certification.
specification: "docs/feature-design-signed-catalog-extension-conformance-v1.md"
base_commit: "ff3d1af6"
integrator: "codex-integrator"

acceptance_criteria:
  - "Recipe catalog and connection registry bundles have deterministic content identities."
  - "Every payload byte, size, path, schema, signer identity, issuer, root, and policy is verified."
  - "Cosign process policy is shared through one narrow blob-verification adapter."
  - "Route-attestation imports, codes, and behavior remain backward compatible."
  - "Airflow parse/runtime perform no catalog fetch, signature verification, or recipe execution."
  - "Four closed conformance profiles cannot report PASS with missing required evidence."
  - "Credential resolver and route profiles require approved live evidence for PASS."
  - "Schemas, docs, security tests, package smoke, and architecture budgets pass."

public_contract_impact:
  level: compatible
  surfaces:
    - "dpone.catalog-bundle.v1"
    - "dpone.catalog-trust-policy.v1"
    - "dpone.catalog-bundle-verification.v1"
    - "dpone.extension-check-receipt.v1"
    - "dpone.extension-conformance-request.v1"
    - "dpone.extension-conformance.v1"
    - "dpone supply-chain catalog-bundle-build"
    - "dpone supply-chain catalog-bundle-verify"
    - "dpone supply-chain extension-conformance"
    - "BlobSignatureVerifier"
  migration_required: false

