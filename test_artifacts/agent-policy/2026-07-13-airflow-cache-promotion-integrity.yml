schema_version: 1
task_id: "DPONE-AIRFLOW-CACHE-INTEGRITY"
title: "Fail-closed Airflow cache promotion integrity"
goal: "Prevent current-pointer promotion until the pinned release-set and every indexed DAG spec and workload pack pass local path, size, and SHA-256 verification."
specification: "docs/feature-design-airflow-cache-promotion-integrity.md"
base_commit: "d9ace7bd"
integrator: "Codex"

acceptance_criteria:
  - "A valid complete deployment projection promotes with the existing current-pointer contract."
  - "Missing or mismatched release-set identity blocks promotion before current, pointer, or audit mutation."
  - "The materializer recomputes the canonical release fingerprint and rejects a stale or malformed release_id."
  - "Unsafe, unpinned, missing, oversized, or checksum-mismatched indexed artifacts block promotion with stable structured errors."
  - "The release-set control file and artifact files cannot escape the pinned release directory through traversal or symlinks."
  - "The verifier performs local filesystem reads only and never imports Airflow, Vault, Kubernetes, connectors, or remote clients."
  - "CLI text remains topology-free while JSON preserves the precise structured error and path."
  - "Local promotion write failures are structured and direct the operator to cache recovery instead of claiming no mutation."
  - "Recovery detects missing or mismatched promotion audit state and an explicit recovery apply restores consistency."
  - "Release artifacts declare exactly one traversal-free relative path through canonical path or the legacy artifact_ref alias."
  - "Deployment identity is recomputed and every environment-specific deployment/index mirror field matches before promotion."
  - "Concurrent guarded promotions serialize through one inter-process lock and exactly one stale-CAS contender succeeds."
  - "Pointer/audit authorization is durable before current is atomically activated as the final commit point."
  - "Recovery requires an allowed actor and reviewed active-state CAS, rejects healthy/stale state, and offers only fully validated candidates."
  - "Promotion, recovery apply, and retention apply share one transaction lock so current cannot change between plan and mutation."
  - "Safe sample execution reuses current only after pointer, audit, projection, release, and artifact integrity validation."
  - "Immutable local sample releases are never repaired by overwriting content-addressed files in place."
  - "Promotion activates a sealed snapshot, so late candidate mutation cannot change current after validation."
  - "Current, pointer, and audit reads use no-follow I/O and current accepts only a canonical relative in-cache symlink."
  - "Retention apply requires an allowed actor and deletes nothing while pointer and physical current state disagree."
  - "Safe-sample preparation failure blocks execution instead of reusing an older verified current deployment."
  - "Identical inline workload bytes produce the same gzip, pack, and release fingerprints across processes."
  - "Unreadable current deployment files retain a canonical physical deployment identity for stale recovery CAS detection."
  - "Current replacement and post-replace directory fsync failures report exact partial-mutation semantics and clean temporary entries."
  - "Retention action rendering preserves every effective evidence protection as a deployment-id flag."
  - "Retention delete candidates pass full deployment, index, release, and artifact validation under the transaction lock."
  - "Candidate and pinned release mutation between initial validation and snapshot revalidation cannot activate mixed bytes."
  - "Recovery and retention CLI actor/allowlist failures use the documented usage and safety exit codes."
  - "Retention plan and apply reject malformed explicit protection ids with usage exit code 2 and delete nothing."
  - "Pointer release identity must match the fully validated current projection before audit-only recovery or safe-sample use."
  - "An existing activation is reused only when its complete regular-file tree matches the newly validated candidate."
  - "Recovery is blocked when an existing current path has no canonical deployment identity for stale-plan CAS."
  - "Artifact file opens are descriptor-anchored beneath cache root so an intermediate symlink swap cannot redirect I/O."
  - "Unreadable activation subtrees fail closed and cannot be omitted from a successful sealed snapshot."
  - "Every deployment_id in retention evidence is valid or the entire plan/apply fails before deletion."
  - "Current symlink preparation failures report possible cache-artifact mutation without claiming recovery is required."
  - "Cache and control identities use canonical lowercase sha256 text; uppercase identities fail before mutation."
  - "Current pointer authorization fields are validated before recovery, retention, or safe-sample use."
  - "Non-regular candidate entries such as FIFOs are opened nonblocking and rejected without holding the transaction indefinitely."
  - "Retention validates every delete candidate before mutation and reports partial deletion details on filesystem failure."
  - "Recovery and retention diagnostics remain schema-valid when pointer or directory identities are malformed."
  - "A later retention candidate validation failure deletes no earlier candidate."
  - "The serialized release-set identity is canonical lowercase; an uppercase release_id fails before activation."
  - "Retention text reports unidentified quarantine entries as NEEDS_ATTENTION with a stable error code."
  - "Retention schemas reject null deployment identities for protect, delete, and deleted actions."
  - "Domain prevalidation failures preserve their cause code and report no mutation or completed deletion ids."
  - "Retention fully validates active current before classifying or deleting another deployment."
  - "The Airflow provider rejects noncanonical uppercase deployment-index identities in parity with the public schema."

public_contract_impact:
  level: breaking
  surfaces:
    - "dpone airflow cache-sync"
    - "DeploymentCacheMaterializer.promote"
    - "dpone.error.v1 cache-sync errors"
    - "cache-sync pinned release prerequisite with dpone.release-set.v1 artifact_ref compatibility"
    - "dpone airflow cache-recovery-apply actor and active-state CAS requirements"
    - "DeploymentCacheMaterializer deployment identity, locking, and ordered activation"
  migration_required: true

