schema_version: 1
task_id: "DPONE-BCP-CHUNK-LIMITS"
title: "Enforce BCP physical chunk limits and expose the FIFO read buffer"
goal: "Restore physical max-byte enforcement and replace the misleading streaming chunk option with a compatible bounded read-buffer policy."
specification: "docs/superpowers/specs/2026-07-14-bcp-chunk-limits-and-stream-buffer-contract.md"
base_commit: "1d434eb26d5f20a92ec145b0c608b44d00040505"
integrator: "Codex primary integrator"

acceptance_criteria:
  - "Every emitted physical chunk is at most max_chunk_bytes and complete rows are never split."
  - "A row larger than max_chunk_bytes fails with safe typed metadata and leaves no FIFO or partial chunk."
  - "Streaming FIFO reads use validated read_buffer_bytes in the 64KiB..16MiB range."
  - "The legacy streaming target_chunk_bytes key is accepted for one release, warns, and keeps the 4MiB effective buffer."
  - "Evidence never serializes loader exception bodies or row data, and cleanup deletes only artifact-owned chunk paths."
  - "Schema and runtime enforce the same read-buffer string grammar and bounds, and one route emits one deprecation warning."
  - "BCP abort joins output drainers even when kill/reap times out, and ambiguous decoded-table creation is cleaned by planned identity."
  - "Iterator cancellation propagates a safe cleanup failure, while loader failures remain primary and receive redacted cleanup context."
  - "Output-drainer timeout is detected explicitly instead of returning while reader threads remain alive."
  - "FIFO reads cannot wait forever after an early BCP exit, malformed legacy-only input fails, and fractional numeric buffers are rejected."
  - "Raw and decoded ClickHouse staging identities are known before DDL and remain cleanable after ambiguous create timeouts."
  - "Evidence whitelists base exception fields, and physical plus legacy byte-size parsers reject schema-invalid or non-positive inputs."
  - "Both manifest schemas, repository examples, tests, documentation, and changelog expose the canonical contract."

public_contract_impact:
  level: deprecation
  surfaces:
    - "manifest schemas"
    - "runtime policy Python API"
    - "physical chunk failure contract"
    - "runtime decision evidence"
    - "documentation and executable examples"
  migration_required: true

