dependencies:
  - "The exact implementation base is merged PR 557 commit 151140230364a40df095bd30bb356cd53b36b691."
  - "The approved specification is docs/feature-design-release-candidate-evidence-gate.md at SHA-256 75416831857aabae3ee36da80263ae816e3c9c512f7f0548c08c41dc24c27990."
  - "ADR 0049 is Accepted and remains architecture authority without modification."
  - "Exact base 151140230364a40df095bd30bb356cd53b36b691 already contains the separately reviewed PR 557 matrix receipt isolation and its documentation/certification updates; this task does not modify or re-own them."

required_checks:
  focused:
    - "uv run pytest tests/agent_policy/test_release_candidate_evidence_source.py tests/agent_policy/test_release_candidate_evidence_publication.py -q"
    - "uv run pytest tests/agent_policy/test_release_candidate_evidence_gate.py tests/agent_policy/test_release_candidate_evidence_publication_polling.py tests/agent_policy/test_release_candidate_evidence_publication_receipt.py -q"
    - "uv run python tools/agent_policy/task_contract.py test_artifacts/agent-policy/release-candidate-evidence-fail-closed-fixes.yml --format json"
  broad:
    - "uv run python tools/agent_policy/select_checks.py --base-ref 151140230364a40df095bd30bb356cd53b36b691 and execute every selected non-live check."
    - "uv run pytest tests/agent_policy -q"
    - "uv run pytest -m 'not integration_live' -n auto --dist loadfile"
    - "Darwin baseline comparison: exactly tests/test_airflow_cache_shared_directory_mode.py::test_ensure_shared_directory_accepts_foreign_owned_superset and tests/test_airflow_cache_shared_directory_mode.py::test_ensure_cache_layout_succeeds_on_foreign_owned_shared_superset may be reported N/A for local PR preparation only after clean exact-base 151140230364a40df095bd30bb356cd53b36b691 and candidate runs identically prove chmod 02777 becomes 0777; every other local check must PASS, and hosted Linux must PASS the full non-live suite before merge."
    - "uv run ruff check tools/agent_policy/release_candidate_evidence_source.py tests/agent_policy/test_release_candidate_evidence_source.py tests/agent_policy/test_release_candidate_evidence_publication.py and uv run ruff format --check on the same paths."
    - "uv run mypy --config-file mypy.ini"
    - "uv run python tools/agent_policy/workflow_security.py . --format json"
    - "uv run python tools/agent_policy/governance_gate.py --root . --base-ref 151140230364a40df095bd30bb356cd53b36b691 --format json"
    - "uv run dpone docs update-dev-metrics --check; uv run dpone docs check-docs; uv run dpone docs check-generated-references; and uv run mkdocs build --strict."
    - "git diff --check and all hard and baseline module-size gates pass without generating metrics."
  live:
    - "After merge, dispatch a new Release candidate evidence run on exact master SHA for v0.74.0; require the inherited exact 237 real matrix cases PASS, zero synthetic matrix_execution cases, the fixed terminal check PASS, and the unique unexpired attempt-bound authority artifact."
    - "Require all protected contexts, governance source verification, artifact attestation, Agent PR receipt, and post-merge receipt PASS on the exact final commit before tagging."

required_outputs:
  - implementation
  - tests
  - documentation_impact
  - completion_report

completion_statuses:
  allowed:
    - PASS
    - FAIL
    - SKIP
    - N/A
    - UNVERIFIED

stop_conditions:
  - "Required edit falls outside owned_paths."
  - "Approved specification is missing or contradicted."
  - "Public-contract impact is larger than declared."
  - "A live check requires unapproved credentials or environment."
  - "Another writer owns the same semantic contract."
  - "The implementation branch merge-base with protected master is not exact 151140230364a40df095bd30bb356cd53b36b691, the implementation HEAD is not a descendant of that base, protected master moves before integration, or the approved specification digest differs."
  - "Any release/runtime workflow changes relative to exact base 151140230364a40df095bd30bb356cd53b36b691."
  - "Any package, runtime, policy profile, release publisher, public schema, ADR 0049, or approved feature-design byte changes."
  - "The final changed-path set relative to exact base 151140230364a40df095bd30bb356cd53b36b691 is not exactly the three owned implementation/test paths plus the two integrator-owned task/metrics paths (five paths total)."
  - "Any focused, broad, exact-head, provider-live, or post-merge evidence is missing, stale, foreign, bypassed, or non-PASS, except the two fully-qualified Darwin S_ISGID tests may be N/A under the exact clean-base/candidate 02777-to-0777 equivalence above; any additional or different failure stops, and hosted Linux full non-live must PASS before merge."
