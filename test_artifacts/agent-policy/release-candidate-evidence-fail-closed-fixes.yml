  - CHANGELOG.md
  - docs/live-certification.md
  - .github/workflows/live-certification.yml
  - tests/test_live_certification_automation.py
  - test_artifacts/agent-policy/pr3b-semantic-privilege-certification.json
  - tools/agent_policy/release_candidate_evidence_gate.py
  - tools/agent_policy/release_candidate_evidence_policy.py
  - tests/agent_policy/test_release_candidate_evidence_gate.py
  - tests/agent_policy/test_release_candidate_evidence_publication_polling.py
  - tests/agent_policy/test_release_candidate_evidence_publication_receipt.py
  - tests/test_release_candidate_evidence_workflow_contracts.py

