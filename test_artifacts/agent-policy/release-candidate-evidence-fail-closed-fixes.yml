schema_version: 1
task_id: "DPONE-RELEASE-CANDIDATE-EVIDENCE-CUTOFF-FAIL-CLOSED"
title: "Close release-candidate publication-cutoff false positives"
goal: >-
  Preserve exact-SHA release evidence authority by rejecting terminal provider
  timestamps that are equal to the publication cutoff while retaining the
  inherited exact 237-case matrix contract from merged master.
specification: "docs/feature-design-release-candidate-evidence-gate.md"
base_commit: "151140230364a40df095bd30bb356cd53b36b691"
integrator: "/root"

acceptance_criteria:
  - "A candidate run updated_at, terminal check completed_at, or authority artifact created_at equal to the earliest paired publication created_at fails closed as ambiguous; only terminal timestamps strictly before the cutoff are authoritative."
  - "Dispatch eligibility remains bound to the newest unique exact-SHA workflow_dispatch created no later than the cutoff, without weakening run, attempt, producer, artifact, or paired-publication identity checks."
  - "The accepted feature design remains byte-identical at SHA-256 75416831857aabae3ee36da80263ae816e3c9c512f7f0548c08c41dc24c27990 and accepted ADR 0049 remains read-only."
  - "The merged-master matrix fix, live-certification workflow, canonical semantic-privilege certification, changelog, and live-certification documentation remain byte-identical to exact base 151140230364a40df095bd30bb356cd53b36b691."
  - "For local PR preparation on Darwin only, tests/test_airflow_cache_shared_directory_mode.py::test_ensure_shared_directory_accepts_foreign_owned_superset and tests/test_airflow_cache_shared_directory_mode.py::test_ensure_cache_layout_succeeds_on_foreign_owned_shared_superset may be N/A only when clean exact-base 151140230364a40df095bd30bb356cd53b36b691 and the candidate identically observe chmod 02777 as 0777; hosted Linux must still PASS the full non-live suite before merge."
  - "No released Python API, package schema, runtime data path, release publisher, or policy profile changes."

public_contract_impact:
  level: compatible
  surfaces:
    - "workflow-internal release-candidate evidence authorization"
  migration_required: false

owned_paths:
  - tools/agent_policy/release_candidate_evidence_source.py
  - tests/agent_policy/test_release_candidate_evidence_source.py
  - tests/agent_policy/test_release_candidate_evidence_publication.py

integrator_owned_paths:
