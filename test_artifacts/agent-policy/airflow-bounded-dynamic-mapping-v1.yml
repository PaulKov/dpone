  - implementation
  - tests
  - documentation_impact
  - completion_report

completion_statuses:
  allowed:
    - PASS
    - FAIL
    - SKIP
    - N/A
    - UNVERIFIED

stop_conditions:
  - "Required edit falls outside owned_paths."
  - "Approved specification is missing or contradicted."
  - "Public-contract impact is larger than declared."
  - "A live check requires unapproved credentials or environment."
  - "Another writer owns the same semantic contract."
  - "Implementation makes visible or summary mapping the default."
  - "Airflow task state replaces the dpone campaign ledger."
  - "Provider parse reads network, state, metadata DB, Variable, Connection, Vault, Kubernetes or refreshes cache."
  - "Runtime accepts chunk predicate SQL or credentials from a mapping item."
  - "Mapped execution proceeds without distributed chunk lease and owner-CAS capability."
  - "A required edit touches user-owned .cursor files."
