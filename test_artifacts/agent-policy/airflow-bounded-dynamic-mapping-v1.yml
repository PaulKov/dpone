schema_version: 1
task_id: "DPONE-AIRFLOW-BOUNDED-DYNAMIC-MAPPING-V1"
title: "Project bounded Airflow task mapping over the dpone backfill ledger"
goal: "Offer internal, visible and summary backfill mapping without duplicating campaign state or exceeding Airflow task budgets."
specification: "docs/feature-design-airflow-bounded-dynamic-mapping-v1.md"
base_commit: "071340a5"
integrator: "current Codex task"

acceptance_criteria:
  - "Internal mode preserves existing one-task backfill behavior."
  - "Visible and summary plans are static, deterministic, fingerprinted and bounded to at most 200 task instances."
  - "Provider mapping sets a static pool and max_active_tis_per_dag and validates each mapped KPO outcome inline."
  - "Runtime re-plans and verifies the selected chunk range before connector I/O."
  - "The dpone ledger remains authoritative and stale completion is rejected by owner compare-and-set."
  - "Mapped execution fails closed without certified distributed campaign lock and chunk-lease capabilities."
  - "Airflow parse performs no network, state, metadata, Variable, Connection, Vault, Kubernetes or cache-refresh I/O."

public_contract_impact:
  level: compatible
  surfaces:
    - "workload airflow.mapping policy"
    - "dpone.airflow-mapping-plan.v1"
    - "dpone.airflow-mapping-item.v1"
    - "gitops.airflow_pack process mapping plan"
    - "backfill result and XCom optional mapping summary"
    - "Postgres and MSSQL audit-state distributed chunk lease/CAS capability"
  migration_required: false

