schema_version: 1
task_id: "airflow-runtime-authority-immutable-payload-v1"
title: "Project bounded immutable runtime-authority payloads"
goal: >-
  Add a non-secret, digest-bound immutable payload source for protected Airflow
  runtime authority while preserving the Kubernetes Secret source unchanged.
specification: "docs/feature-specs/kpo-runtime-authority-immutable-payload.md"
base_commit: "bb1c6ea7"
integrator: "primary-agent"

acceptance_criteria:
  - "Secret and immutable payload modes are a closed mutually exclusive union."
  - "Payload bytes are non-empty, bounded, canonical Base64, size-bound, and SHA-256-bound at build, parse, init materialization, and base verification."
  - "Immutable mode creates or reads no deployment-specific Kubernetes Secret or ConfigMap."
  - "Init-fetch and base receive the same fixed read-only verified file."
  - "Legacy Secret behavior and v2/v3/no-authority contracts remain compatible."

public_contract_impact:
  level: compatible
  surfaces:
    - CLI
    - Python build API
    - deployment/index/runtime-plan v5 schemas
    - Airflow provider pod contract
    - documentation
    - package versions
  migration_required: false

