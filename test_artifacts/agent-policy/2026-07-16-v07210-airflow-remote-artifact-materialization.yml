stop_conditions:
  - "Required edit falls outside owned_paths."
  - "Approved specification is missing or contradicted."
  - "Public-contract impact is larger than declared."
  - "Implementation resolves current/latest or performs remote discovery for executable content."
  - "Implementation overwrites or deletes a content-addressed remote object."
  - "Implementation mutates local current during publication or materialization."
  - "Implementation performs storage, network, credential, or secret I/O during Airflow parse or base CLI help."
  - "Implementation treats ETag/MD5 or remote metadata as the final SHA-256 content proof."
  - "Implementation permits production attestation policy bypass."
  - "A live check requires unapproved credentials or environment."
  - "Another writer owns the same semantic contract."
