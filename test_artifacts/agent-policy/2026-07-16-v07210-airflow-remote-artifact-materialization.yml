schema_version: 1
task_id: "DPONE-V07210-AIRFLOW-REMOTE-ARTIFACT-MATERIALIZATION"
title: "Publish and materialize pinned Airflow release/deployment artifacts"
goal: >-
  Complete the remote Phase 1B handoff with content-addressed create-or-compare
  publication and bounded pinned materialization while preserving local
  cache-sync as the only activation boundary and keeping Airflow parse free of
  network, storage SDK, credential, and secret side effects.
specification: "docs/feature-design-airflow-remote-artifact-materialization-v07210.md"
base_commit: "608a1e68"
integrator: "codex/v0.72.10-remote-artifact-materializer"

acceptance_criteria:
  - "Publisher validates one canonical local release/deployment projection before constructing a remote client."
  - "Remote release/deployment keys are derived only from exact canonical digests and never from current, latest, tags, branches, or remote discovery."
  - "Remote publication uses conditional create-or-compare; identical retries are no-op and conflicting bytes never overwrite."
  - "Completion markers are published last and missing markers make materialization fail closed."
  - "Materializer enforces per-object and total budgets, verifies downloaded SHA-256 bytes, validates in an isolated canonical staging cache, and installs immutable local trees without activating current."
  - "Existing cache-sync/recovery/retention and provider loader remain the activation and parse paths without remote I/O."
  - "Text/JSON output and errors do not expose credentials, signed URLs, SDK payloads, Vault paths, or private staging paths."
  - "Legacy gitops pack publication and provider cache sync remain compatible and are documented as legacy."

public_contract_impact:
  level: compatible
  surfaces:
    - airflow_platform_cli
    - python_runtime_api
    - artifact_registry_port
    - object_storage_clients
    - gitops_json_schemas
    - structured_errors
