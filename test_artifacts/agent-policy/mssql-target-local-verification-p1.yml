schema_version: 1
task_id: "DPONE-MSSQL-TARGET-LOCAL-P1"
title: "MSSQL target-local native verification"
goal: "Remove business-row readback from the explicitly selected target-local BCP verification path without changing released BCP v1 behavior."
specification: "docs/feature-specs/mssql-sqlclient-target-local-verification-v2.md"
base_commit: "54905bce7f93c768e9ff7cc95d6b7067a513cab8"
integrator: "root"

acceptance_criteria:
  - "Omitted verification_backend preserves BCP plus Python readback and journal v1."
  - "Explicit target_local returns only aggregate count/digest data from SQL Server."
  - "Raw and prepared digests reproduce mssql-native-sha256-sum-v1 for the admitted matrix."
  - "Count overflow, identity drift, schema drift, and digest mismatch fail closed."
  - "Docker narrow and wide100 differential certification passes on the exact candidate commit."

public_contract_impact:
  level: compatible
  surfaces:
    - manifest_schema
    - plan_json
    - native_journal_identity
    - route_documentation
  migration_required: false

owned_paths:
  - src/dpone/runtime/sinks/mssql_native_target_digest.py
  - src/dpone/contracts/mssql_native_verification.py
  - src/dpone/adapters/mssql_native_chunks_journal_v2.py
  - src/dpone/adapters/mssql_native_chunks_journal_v2_events.py
  - src/dpone/runtime/sinks/mssql_native_import.py
  - src/dpone/runtime/sinks/mssql_native_prepared_digests.py
  - src/dpone/runtime/sinks/mssql_native_prepare.py
  - src/dpone/runtime/sinks/mssql_native_composition.py
  - src/dpone/runtime/mssql_native_chunks.py
  - tests/test_mssql_native_target_digest.py
  - tests/test_mssql_native_verification_policy.py
  - tests/test_mssql_native_chunks_journal_v2.py
  - tests/test_mssql_native_staged_import.py
  - tests/test_mssql_native_integrity_readbacks.py
  - tests/test_mssql_native_composition.py
  - tests/test_mssql_native_chunks_execution.py
  - tests/integration/mssql
  - tests/fixtures

integrator_owned_paths:
  - src/dpone/manifest/mssql_native_policy.py
  - src/dpone/readiness/mssql_native_planning.py
  - src/dpone/schema/etl-config.schema.json
  - src/dpone/schema/etl-batch-manifest.schema.json
  - examples/native
  - docs/mssql-native-transport.md
  - docs/source-sink/clickhouse-to-mssql.md
  - docs/feature-specs/mssql-sqlclient-target-local-verification-v2.md
  - CHANGELOG.md

read_only_paths:
  - src/dpone/contracts/mssql_native_chunks.py
  - src/dpone/adapters/mssql_native_chunks_journal.py
  - src/dpone/runtime/mssql_native_encoder.py
  - src/dpone/runtime/mssql_native_encoder_values.py
  - src/dpone/runtime/native_wire_mssql.py

forbidden_paths:
  - pyproject.toml
  - uv.lock
  - CHANGELOG.md
  - mkdocs.yml
  - .github/workflows
  - tests/conftest.py
  - src/dpone/manifest/mssql_native_policy.py
  - src/dpone/readiness/mssql_native_planning.py
  - src/dpone/schema/etl-config.schema.json
  - src/dpone/schema/etl-batch-manifest.schema.json
  - examples/native
  - docs/mssql-native-transport.md
  - docs/source-sink/clickhouse-to-mssql.md
  - docs/feature-specs/mssql-sqlclient-target-local-verification-v2.md

shared_file_owner: "root"

dependencies:
  - "SQL Server 2019+ Docker image for live differential certification"

required_checks:
  focused:
    - "uv run pytest tests/test_mssql_native_target_digest.py tests/test_mssql_native_verification_policy.py tests/test_mssql_native_chunks_journal_v2.py -q"
    - "uv run pytest tests/test_mssql_native_staged_import.py tests/test_mssql_native_integrity_readbacks.py tests/test_mssql_native_composition.py tests/test_mssql_native_chunks_execution.py -q"
  broad:
    - "uv run ruff check ."
    - "uv run ruff format --check ."
    - "uv run mypy --config-file mypy.ini"
    - "uv run dpone docs check-import-rules"
    - "uv run dpone docs check-layer-metrics --baseline docs/layer_metrics_baseline.json"
    - "uv run pytest -m 'not integration_live' -n auto --dist loadfile"
    - "uv run dpone docs check-docs"
    - "uv run mkdocs build --strict"
  live:
    - "local Docker SQL Server target-local narrow and wide100 differential matrix"

required_outputs:
  - implementation
  - tests
  - documentation_impact
  - completion_report

completion_statuses:
  allowed:
    - PASS
    - FAIL
    - SKIP
    - N/A
    - UNVERIFIED

stop_conditions:
  - "Required edit falls outside owned_paths."
  - "Approved specification is missing or contradicted."
  - "Public-contract impact is larger than declared."
  - "A live check requires unapproved credentials or environment."
  - "Another writer owns the same semantic contract."
