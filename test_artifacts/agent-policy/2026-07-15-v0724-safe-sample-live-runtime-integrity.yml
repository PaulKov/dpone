schema_version: 1
task_id: "DPONE-V0724-SAFE-SAMPLE-LIVE-RUNTIME"
title: "Close Phase 1B live safe-sample runtime integrity gaps"
goal: >-
  Re-authorize live sample plans, verify pinned runtime input fingerprints,
  verify that the primary source matches the immutable workload pack, and
  execute real ClickHouse temporary-target lifecycle through one workload-scoped
  credential resolver.
specification: "docs/feature-design-safe-sample-live-runtime-integrity-v0724.md"
base_commit: "4880c52d30b10222520e8181ab2deb61b69f329d"
integrator: "Codex"

acceptance_criteria:
  - "Live copy reaches no credential or database I/O before policy and fingerprint validation pass."
  - "The exact pipeline source bytes match the manifest dependency in the pinned workload pack."
  - "Live source verification requires an explicit project root and never derives it from the cache root."
  - "ClickHouse create, TTL configuration, bounded copy, and drop execute in order."
  - "ClickHouse Python-row insertion uses the native VALUES contract and exact row-count parity."
  - "Sink credentials are resolved once per workload and reused across target lifecycle and copy."
  - "Production serialized proof cannot authorize execution without an injected trusted verification decision."
  - "Evidence and errors contain no credentials, sampled rows, Vault paths, or secret topology."

public_contract_impact:
  level: compatible
  surfaces:
    - cli
    - python_api
    - evidence
    - structured_errors
    - documentation
  migration_required: false

