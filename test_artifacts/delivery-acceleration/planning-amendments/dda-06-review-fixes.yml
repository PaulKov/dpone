acceptance_criteria:
- Wait for reviewed DDA-01..05 commits/PRs and integrate them on a dedicated branch containing current master;
  never overwrite another worktree or force-push shared history.
- Wire phase observations, dual-digest/INSERT helpers and sized frames through existing composition and coordinators.
  Defaults, wire/journal/recovery formats, source lifetime and resource bounds remain unchanged.
- Integrated structural tests show four raw/two prepared typed readbacks, no preparation metadata UPDATE and no
  repeated scheduler sizing. Preserve finalizer target-clock UPDATE and all key/count/evidence/quality/ownership/fencing
  checks.
- Keep direct BCP metadata behavior and every old Mapping/tuple/manifest API. Exercise real spawned workers, mutable
  buffers, tampering at every boundary, cancellation, replay and lost/unknown commit with hermetic fixtures.
- Keep public native SWITCH rejection before I/O; DDA-04 is an isolated component only. Add the next unused ADR
  number for its exact architecture/activation boundary without colliding with parallel work.
- Reconcile DDA-01 and DDA-05 report producer/consumer with executable contract tests. Missing approved live environment
  is SKIP/UNVERIFIED; do not infer real speed from structural counters.
- Write overview/runbook, first-success examples, limitations and migration notes; update current native/architecture/nav/changelog
  through owned paths, preserving 0.75.0/0.76.0 history.
- Run exact-head focused, full non-live, architecture/type/format and docs gates; request fresh-context independent
  subagent review, fix findings and rerun independent review after fixes.
- Publish a reviewable integration PR with linked per-task evidence and explicit code-ready versus live-performance
  statuses. Do not merge/release/tag/upload or change providers in this task.
- 'Supplemental annotation-only scope: move only MssqlTransactionAdmission in fresh-target preplan, operation
  lease and target mutation plan; MssqlPhysicalDesignContract in filegroup authority; MssqlDatabaseAuthorityPin
  and ResolvedBindingConnection in database-authority support behind TYPE_CHECKING. All are postponed function/constructor
  annotations, not dataclass fields or runtime uses.'
- The extra src/dpone/runtime/sinks/mssql.py path is a reserve restricted to its annotation-only MssqlCatalogColumn
  import; use it only if the actual integrated dependency gate still requires the additional legitimate import
  cleanup. No sink behavior or registry changes.
- 'Follow ADR0058: preserve raw annotations, supported reexports and canonical-namespace get_type_hints resolution.
  Keep runtime constructors/type checks/exceptions/decorators/bases and dataclass field types imported. In particular
  keep ProcessResult construction, NativeTransferExecutionPolicy.native_chunks and explicit soft-delete reexports.'
- Retain baseline/budget/gate implementations and all real DDA01/DDA04 runtime model/schema/error dependencies.
  No facade laundering, copied policy/errors, graph exclusions, threshold overrides or unrelated refactors.
- Before these edits, verify each listed symbol still has only the reviewed annotation use on the integrated head.
  If another contributor changed a symbol to runtime use, leave it and report the remaining gate issue.
- Record the exact before/after canonical layer and architecture-fitness results plus all required quality budgets.
  Six statically removable edges are a scope estimate, not a promised PASS; clustering and other gates still require
  actual execution.
- Run the additional existing lease/schema/database-authority/native-recovery suites, mypy and independent review;
  add no tests that merely duplicate the import layout.
- The additional mssql_native_staging_checks.py path is restricted to a cohesive collaborator for the existing
  required-key, SQL-equivalence and COUNT_BIG checks. Move these algorithms intact and reuse them in decoded/direct/bounded
  normalization; metadata/evidence orchestration stays in mssql_native_staging.py.
- The staging-check collaborator must preserve validation ordering, public errors/signatures, query parameterization
  and row-count semantics. No new skip flag, ownership bypass, copied policy or budget relaxation is allowed.
- Retain the existing ADR0058 text and dataclass field runtime imports, including EncodedNativeFile in the private
  _Work dataclass; a cast removal is not permission to hide that runtime annotation dependency.
- 'Generated metrics supplement: DDA-06 alone may refresh docs/quality-metrics.md through the existing uv run
  dpone docs update-dev-metrics producer in its integration checkout. This is the only additional path; retain
  all prior scope and exclusions.'
- Stage or commit every intended Python input, including tools and evidence scripts, before generation because
  the producer uses git ls-files. Record the integrated source commit and tracked input set; preserve prose outside
  the generated markers except for the explicit integration-summary correction below, and retain unrelated upstream
  edits.
- Do not hand-edit generated values or alter the producer, metrics definitions, quality budgets, baselines, gate
  code, workflow, dependency files or command thresholds. Generated freshness PASS does not imply architecture
  PASS; retain every actual FAIL/HOLD independently.
- After generation, run uv run dpone docs update-dev-metrics --check, verify a second generation is byte-identical,
  and audit that the generator changed only docs/quality-metrics.md. Run documentation checks, language contracts
  and strict MkDocs on the final integrated tree, then request fresh independent review before handoff.
- If the generator writes an additional path, the generated output hides a measured failure, or a parallel contributor
  owns the same unintegrated change, stop the affected mutation and report the conflict; do not overwrite or expand
  this supplement.
- 'Manual-summary exception on the same integration docs/quality-metrics.md path: after exact-candidate layer
  and architecture receipts both confirm FAIL, replace only the obsolete current-quality headline, its immediately
  following explanation paragraph and the narrow-architecture-margin sentence with the exact text in planning-amendments/dda-06-quality-summary-correction.md.
  Retain every other paragraph and every generated byte.'
- This correction describes actual integrated gate evidence and does not introduce numerical metric copies, change
  any gate result, or claim pytest success without a corresponding receipt. Record source identity and the exact
  before/after manual diff. If results or source differ from the stated precondition, reconcile the text with
  reviewed evidence before editing.
- The exception applies only to the integrated dashboard. DDA-02 component dashboard generation remains strictly
  producer-only under its reviewed operation; no manual prose authority is transferred to any component owner.
- For the summary-only commit, verify byte-identical generated marker contents before/after, rerun update-dev-metrics
  --check and final documentation/language/strict-MkDocs checks, and obtain independent review of the exact correction.
  No producer, baseline, budget, threshold, workflow, source, public contract or additional path changes are authorized.
- Architecture remediation scope is approved by the maintainer continuation. Follow planning-amendments/dda-06-architecture-remediation.md
  exactly; the listed completed DDA-01/02/04/05 paths transfer to DDA-06 only for this compatible correction,
  with no concurrent writers.
- Normalize exact NativeChunkLimits beside RUN_SCHEMA and reuse that contract policy in both existing producer
  and consumer. Preserve field sets, canonical constructors, normalized bytes/digests and original error classifications.
- Delegate the existing single-projection prepared digest to its cohesive existing digest module, preserving one
  encode per row, the independent prepublication SQL readback and existing errors. Establish independent typed
  golden expectations before replacing the old loop; do not create a circular parity oracle.
- Add only a query/row-shape transaction_state reader to NativeSwitchCatalog. Preserve TRANSACTION_SQL at its
  existing import location and keep every authority/lock/replan/prepared-verification/mutation decision and its
  order in the executor.
- Only the NativeDeliveryObserver parameter import in runtime observations and schema/lineage parameter imports
  in prepared INSERT may move to TYPE_CHECKING under existing ADR0058. Preserve raw annotations and canonical-namespace
  resolution. No runtime/dataclass/reexport import hiding or optional SourceWire cleanup.
- 'Actual unchanged gates must pass: YAML clustering maximum 0.182, repository cross-layer ratio 0.300, canonical
  flow allowance and all size/import/type budgets. The 0.180 clustering target remains an advisory improvement
  target; do not change any threshold or substitute simulated metrics for executed evidence.'
- 'Completion-phase summary authority supersedes the previous FAIL-only summary correction: after actual gates
  pass, update only current quality-summary headline, explanation and coupling sentence for the new candidate.
  Keep generated bytes producer-owned, remaining advisory debt visible and historical FAIL evidence intact. Component
  snapshots remain producer-only.'
- Use new remediation-* evidence from the existing producer, obtain independent subagent review after every correction,
  fix and re-review findings, freeze the final source/docs tree, and execute one complete non-live suite only
  after focused/static gates pass. Preserve all old final-* records without relabelling.
- This successor supersedes only conflicting historical remediation details for the two review fixes. Follow planning-amendments/dda-06-review-fixes.md;
  existing implementation is frozen outside its narrow correction paths. DDA-06 remains the sole writer and completed
  DDA-05 support/test/docs paths transfer only for this bug fix.
- Preserve the candidate runtime normalization helper; the harness alone adapts to the actually loaded baseline
  NativeChunkLimits through dataclass introspection and its canonical constructor. Preserve errors, values, hash
  and honest subject identity.
- Gate both actual live test entrypoints on final envelope status and live execution. Only explicit dirty-source
  UNVERIFIED can be allowed with complete successful component proofs. Regress late cleanup identity drift through
  the real producer.
- Import only pinned upstream e15ad32b850708207c2f8f1b6faf597ef0f5b0b1 then fa20f554bab3024f240b92aadf176527ee967925
  via cherry-pick -x under the active linear-history rule. Import-only authority over foreign paths requires exact
  reviewed provenance/blob preservation and is not independent write authority. Resolve only CHANGELOG.md and
  docs/quality-metrics.md conflicts; verify architecture/nav auto-merges.
- Update the owned ownership-audit producer for exact pinned upstream import classification, narrowly reviewed
  conflict resolutions and final upstream-only blob preservation. Add negative regression proof for altered blob,
  unexpected path and unapproved resolution. Keep old receipts unchanged.
- Use new review-fixes-* evidence. Independently review each correction, then freeze source and run required focused/static/docs
  and complete non-live gates. Preserve 0.77.0 versions/dependencies and every adopted upstream-only file; do
  not publish or run live/PyPI checks.
- Final integration supplement in dda-06-review-fixes.md supersedes the earlier active-PG-owner exclusion for
  one exact postponed function-annotation import only. The migration owner confirmed no active writer or pending
  edit. Move ResolvedBindingConnection to TYPE_CHECKING in runtime/sources/postgres_source_authority.py; preserve
  all executable code, raw annotations, canonical get_type_hints and runtime/dataclass dependencies. Do not touch
  private migration worktrees.
- Preserve all 138 upstream-only mode/blob entries. The newly owned annotation-only path did not change in either
  pinned upstream commit and is not an exception to the foreign preservation check. Independently review and execute
  unchanged PG authority, introspection, layer, fitness and type checks; retain the actual preceding flow215 FAIL.
- After source H passes scoped implementation review and required static/docs checks, retain its historical ownership
  audit, push the old branch, then transfer its exact whole tree to codex/dda-06-reviewed-delivery whose parent
  is pinned fa20. Prove staged/committed tree equality and parent identity through a producer; record H in commit
  provenance. Create a replacement PR without merges, force pushes, rule changes or deletion of old history. PR25
  stays preserved and linked as superseded.
- Complete final exact-head CI collection accounting on Python3.11/3.12 satisfies the broad non-live gate; duplicate
  unchanged localfull is N/A with explicit reason unless a concrete failure requires reproduction. Recompute actual
  new-PR receipt applicability and retain artifacts honestly without avoidable source churn.
