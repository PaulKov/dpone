stop_conditions:
  - Required edit falls outside owned_paths.
  - Approved specification is missing or contradicted.
  - Public-contract impact is larger than declared.
  - A live check requires unapproved credentials or environment.
  - Another writer owns the same semantic contract.
  - Another writer owns an amended path.
  - An edit changes admission behavior, public signatures, transaction order or a non-amended source/test file.
  - Any upstream-only path differs from its pinned input.
  - A threshold, baseline or generated evidence is changed to manufacture a passing result.
  - Live credentials, release publication or history rewriting would be required.
