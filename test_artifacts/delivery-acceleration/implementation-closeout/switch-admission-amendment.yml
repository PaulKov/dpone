acceptance_criteria:
  - This bounded internal refactor follows the maintainer's implementation-completion instruction; it changes no public contract or approved DDA behavior.
  - Amend composition-integration-contract.yml only for the four named production paths, one existing test file, the DDA architecture decision, and this amendment.
  - Move the pure plan_native_switch algorithm and temporal predicate unchanged into the existing native_mssql_switch contract module.
  - Apply the pure-admission ownership principle documented in ADR0058 without editing that upstream ADR.
  - Preserve the legacy planner signature, module identity, runtime-resolvable type annotations and package export through a thin delegating facade.
  - Have catalog and executor use the canonical contract function; preserve metadata admission before content SQL and revalidation under transaction locks.
  - Preserve sorted rejection reasons, frozen model identities, comparison ordering, authority checks, prepared verification, SQL order, errors and rollback semantics.
  - Keep all 228 upstream-only paths mode/blob-identical to a2fe3a34f7c143625cea6d1b947c749ffc6d4dc9 and every other reviewed delivery production/test path unchanged.
  - Retain the initial combined architecture failure; a diagnostic graph projection is not a passing gate.
  - Require real canonical architecture fitness, focused regression and compatibility tests, import/layer/module/type/lint checks, final combined CI and fresh independent review.
