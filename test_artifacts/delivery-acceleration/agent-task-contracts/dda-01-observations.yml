schema_version: 1
task_id: DDA-01
title: Delivery phase observations and benchmark comparison
goal: Implement opt-in bounded phase observations and a truthful versioned benchmark comparison producer.
specification: docs/feature-design-data-delivery-acceleration-v1.md
base_commit: d5ad9aaecc900c24df421b160ed36b4cfc726e45
integrator: DDA-06 delivery acceleration integrator
acceptance_criteria:
- Implement the frozen observation model/port and optional no-op-compatible collector without changing existing
  journal or receipt schemas.
- An injected clock proves nested/overlapping phases, failed/cancelled retries, observed worker overlap and separate
  total delivery/pipeline durations; incompatible clock domains are not combined.
- Missing resources and observer failures produce explicit unavailable/UNVERIFIED diagnostics; configured parallelism
  is never measured parallelism; no row values, SQL text, secrets or connection URLs are emitted.
- Aggregation stays bounded; no per-row logs or extra SQL count queries are required. Observations do not authorize
  business success, state advancement or cleanup.
- The compare CLI implements the exact path/overwrite/atomic-output/exit contract, validates baseline/candidate/workload/environment
  identities, retains raw sample references and rejects unknown versions or drift.
- Tests reject missing/tampered identity, insufficient successful samples and failed fidelity. Three trials support
  a median only; thresholds are targets, not fabricated live results.
- Document schema, units, metric provenance, clock domains, the complete tool journey and executable/parser-tested
  CLI examples.
- Provide tested integration instructions for DDA-06; do not modify existing runtime call sites.
