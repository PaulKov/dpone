schema_version: 1
task_id: DDA-02
title: One-pass prepared integrity and metadata INSERT
goal: Implement prepared-stage helpers that remove one full typed scan and the preparation metadata UPDATE without
  weakening authority.
specification: docs/feature-design-data-delivery-acceleration-v1.md
base_commit: d5ad9aaecc900c24df421b160ed36b4cfc726e45
integrator: DDA-06 delivery acceleration integrator
acceptance_criteria:
- digest_prepared_rows consumes exactly one mapping iterator and produces business/full digests identical to the
  legacy algorithms; a poisoned second iteration and call-count test establish the structural reduction.
- Preserve metadata NULL/finite-byte allowances, row count, canonical framing, duplicate multiplicity, Unicode/binary/Decimal/temporal
  fidelity and existing failure classifications.
- The INSERT helper uses UNION ALL, explicit ordered columns, MssqlNativeLineageProjection.expressions and the existing
  canonical row-hash expression, with validated identifiers.
- Projection parity covers lineage on/off, row-hash on/off, generated NULLs, empty/duplicate input, quote/Unicode
  values, nullability and lifecycle identity.
- Do not introduce a user-settable metadata-valid/skip-validation flag. Give DDA-06 a split between projection and
  shared validation/evidence operations, not a bypass of normalization.
- Keep the preparation loaded_at placeholder and the finalizer target-clock UPDATE. Existing direct BCP consumers
  must retain their metadata projection behavior.
- 'Document the integration call sequence and structural acceptance: four raw plus two prepared scans, no preparation
  metadata UPDATE, unchanged independent prepublication verification.'
- 'No edits to prepare/normalizer/composition/shared tests: DDA-06 owns their integration.'
