schema_version: 1
task_id: DDA-04
title: Isolated SQL Server partition SWITCH component
goal: Build an unregistered, fail-closed SWITCH planner/catalog adapter/transaction executor for one eligible physical
  partition.
specification: docs/feature-design-data-delivery-acceleration-v1.md
base_commit: d5ad9aaecc900c24df421b160ed36b4cfc726e45
integrator: DDA-06 delivery acceleration integrator
acceptance_criteria:
- Implement only the spec's finite one-partition same-database temporal RANGE RIGHT profile; derive its authority
  from the authored interval, including empty input, not staging distinct values.
- Catalog snapshots bind database/object/owner, exact boundaries, columns/types/nullability/collation, indexes/constraints/partition/storage
  layout; unsupported or unknown metadata fails eligibility.
- Reject partial/unbounded windows, cross-database layouts, foreign/nonempty switch-out tables, out-of-window prepared
  rows, unsupported dependencies and catalog drift.
- Revalidate under caller-owned target transaction authority, count replaced rows, then switch old out/new in. Never
  open/commit/rollback a transaction, emit a target receipt or perform cleanup in the executor.
- Failure after the first SWITCH propagates for whole-transaction rollback; never fall back to DELETE+INSERT after
  mutation. Tests cover lost ACK and receipt-first recovery when prepared content was switched away.
- Existing public native SWITCH rejection before I/O remains unchanged; no schema/policy/registry/composition activation,
  no production DDL or environment changes.
- Document owned prepared/switch-out prerequisites and retention, stable eligibility reasons, future activation
  requirements and an ADR decision note for DDA-06.
- Deliver synthetic transaction/catalog tests and integration fixtures or fixture requirements for DDA-05; no live-performance
  claim.
