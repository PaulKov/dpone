schema_version: 1
task_id: DDA-05
title: Real-row delivery and performance harness
goal: Implement an explicitly opted-in real-row native delivery/SWITCH-component harness with reproducible evidence.
specification: docs/feature-design-data-delivery-acceleration-v1.md
base_commit: d5ad9aaecc900c24df421b160ed36b4cfc726e45
integrator: DDA-06 delivery acceleration integrator
acceptance_criteria:
- Build deterministic narrow/wide/Unicode/Decimal/NULL/binary/skewed synthetic profiles and exact-multiset correctness
  fixtures that execute the real bounded-native composition when an environment is explicitly approved.
- Implement current-baseline and candidate execution adapters behind the frozen report envelope so the harness can
  be authored before optimization modules land.
- Record exact commit/dirty state, dependencies/server/BCP versions, environment/workload/config digests, layout,
  limits, raw trials, fidelity, rows/bytes, process-set RSS and available SQL observations.
- Enforce a warmup and at least three successful comparable trials for median claims; exclude failed/skipped trials
  and reject mismatched identities/layouts. No p95 claim from three trials.
- Cover real BCP fidelity, empty/outside-window invariance, post-EOF source-free recovery and known/unknown commit
  paths. SWITCH fixtures test the isolated component, not falsely certified normal route admission.
- No live SQL/container startup or credentials use without a separately explicit approved disposable environment.
  Collection/import/help and hermetic tests work without services; absent environment reports SKIP/UNVERIFIED.
- Synthetic harness tests prove input validation, redaction, output atomicity and absence handling. Match DDA-01
  comparison input contract with a local fixed fixture, without importing its unfinished branch.
- Document exact preparation/run/observation/recovery/cleanup commands and object ownership; do not edit shared
  integration fixtures.
