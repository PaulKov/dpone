required_checks:
  focused:
  - uv run pytest tests/test_native_delivery_live_benchmark.py -q
  broad:
  - uv run python tools/agent_policy/select_checks.py --base-ref origin/master
  - uv run ruff check .
  - uv run ruff format --check .
  - uv run mypy --config-file mypy.ini
  - uv run dpone docs check-import-rules
  - uv run dpone docs check-layer-metrics --baseline docs/layer_metrics_baseline.json
  - Run dpone docs check-module-size with the exact merge-base/head recipe from AGENTS.md; do not weaken budgets.
  - PYTEST_XDIST_AUTO_NUM_WORKERS=2 uv run pytest -m 'not integration_live' -n auto --dist loadfile
  - uv run dpone docs check-docs
  - uv run dpone docs check-generated-references
  - uv run pytest tests/test_docs_language_contracts.py -q
  - uv run mkdocs build --strict
  live:
  - SKIP unless the maintainer explicitly approves the disposable environment; implement applicable live tests without
    running services by default.
