site_name: dpone
site_description: Production-grade batch ELT framework for databases, APIs, Kafka, state, schema evolution, reconciliation, and quality gates.
site_url: https://paulkov.github.io/dpone/
repo_url: https://github.com/PaulKov/dpone
repo_name: PaulKov/dpone
edit_uri: edit/master/docs/
strict: true

docs_dir: docs
site_dir: site
exclude_docs: |
  README.md

theme:
  name: material
  language: en
  logo: assets/images/logo.svg
  favicon: assets/images/favicon.svg
  palette:
    - scheme: default
      primary: white
      accent: teal
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest

extra_css:
  - assets/stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

validation:
  nav:
    omitted_files: ignore
    not_found: warn
    absolute_links: warn
  links:
    not_found: ignore
    absolute_links: relative_to_docs
    unrecognized_links: warn

