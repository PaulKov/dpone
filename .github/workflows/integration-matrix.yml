name: Source/Sink integration matrix

on:
  workflow_dispatch:
    inputs:
      source_filter:
        description: "Comma-separated source filter, for example postgres,mssql. Use * for all."
        required: false
        default: "*"
        type: string
      sink_filter:
        description: "Comma-separated sink filter, for example mssql,clickhouse. Use * for all."
        required: false
        default: "*"
        type: string
      strategy_filter:
        description: "Comma-separated strategy filter: full_refresh,incremental_append,incremental_merge,replace. Use * for all."
        required: false
        default: "*"
        type: string
      case_id_filter:
        description: "Optional exact case_id filter, for example postgres_to_mssql__incremental_merge."
        required: false
        default: "*"
        type: string
      run_mode:
        description: "Matrix layer to run."
        required: false
        default: "mock_local"
        type: choice
        options:
          - mock_contract
          - mock_local
          - vendor_live
      start_local_services:
        description: "Start disposable local Postgres/ClickHouse/MSSQL/Kafka services for mock_local mode."
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  integration-matrix:
    name: Manual source/sink strategy matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DPONE_RUN_INTEGRATION: "1"
      DPONE_RUN_INTEGRATION_MATRIX: "1"
      DPONE_MATRIX_RUN_MODE: ${{ inputs.run_mode }}
      DPONE_MATRIX_SOURCE: ${{ inputs.source_filter }}
      DPONE_MATRIX_SINK: ${{ inputs.sink_filter }}
      DPONE_MATRIX_STRATEGY: ${{ inputs.strategy_filter }}
      DPONE_MATRIX_CASE_ID: ${{ inputs.case_id_filter }}
      DPONE_MATRIX_ARTIFACT_DIR: test_artifacts/integration_matrix
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.28"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Install SQL Server ODBC and bcp tooling
        if: ${{ inputs.run_mode == 'mock_local' && inputs.start_local_services == true }}
        run: |
          sudo apt-get update
          sudo apt-get install -y curl gnupg unixodbc-dev
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          . /etc/os-release
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/${VERSION_ID}/prod ${VERSION_CODENAME} main" \
            | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 mssql-tools18
          echo "/opt/mssql-tools18/bin" >> "$GITHUB_PATH"

      - name: Start disposable local services
        if: ${{ inputs.run_mode == 'mock_local' && inputs.start_local_services == true }}
        run: docker compose -f docker/docker-compose.integration.yml up -d postgres clickhouse mssql kafka schema-registry

      - name: Prepare artifact directory
        run: mkdir -p "$DPONE_MATRIX_ARTIFACT_DIR"

      - name: Run manual source/sink strategy matrix
        run: |
          uv run pytest -m integration_matrix tests/integration/matrix -q \
            --junitxml="$DPONE_MATRIX_ARTIFACT_DIR/junit.xml"

      - name: Stop disposable local services
        if: always() && inputs.run_mode == 'mock_local' && inputs.start_local_services == true
        run: docker compose -f docker/docker-compose.integration.yml down -v

      - name: Build matrix certification report
        if: always()
        run: |
          uv run dpone ops integration-matrix-report \
            --artifact-dir "$DPONE_MATRIX_ARTIFACT_DIR" \
            --output-dir "$DPONE_MATRIX_ARTIFACT_DIR" \
            --format json || true

      - name: Build matrix strategy certification bundle
        if: always()
        run: |
          mkdir -p test_artifacts/strategy_certification/matrix
          cat > test_artifacts/strategy_certification/matrix/workflow_summary.json <<EOF
          {
            "passed": ${{ job.status == 'success' }},
            "workflow": "integration-matrix.yml",
            "run_id": "${{ github.run_id }}",
            "run_attempt": "${{ github.run_attempt }}",
            "run_mode": "${{ inputs.run_mode }}",
            "source_filter": "${{ inputs.source_filter }}",
            "sink_filter": "${{ inputs.sink_filter }}",
            "strategy_filter": "${{ inputs.strategy_filter }}",
            "case_id_filter": "${{ inputs.case_id_filter }}"
          }
          EOF
          uv run dpone strategy certification-bundle \
            --bundle-id "matrix-${{ github.run_id }}-${{ github.run_attempt }}" \
            --output-dir test_artifacts/strategy_certification/matrix \
            --matrix-artifact test_artifacts/strategy_certification/matrix/workflow_summary.json \
            --matrix-artifact "$DPONE_MATRIX_ARTIFACT_DIR/certification_report.json" \
            --docs-link docs/testing/integration-matrix.md \
            --docs-link docs/testing/manual-integration-matrix.md \
            --format json || true

      - name: Build source/sink certification suite
        if: always()
        run: |
          mkdir -p test_artifacts/certification/suite/matrix
          uv run dpone ops certification-suite \
            --output-dir test_artifacts/certification/suite/matrix \
            --suite-id "matrix-${{ github.run_id }}-${{ github.run_attempt }}" \
            --certification-report "$DPONE_MATRIX_ARTIFACT_DIR/certification_report.json" \
            --strategy-certification-bundle test_artifacts/strategy_certification/matrix/strategy_certification_bundle.json \
            --require-strategy-certification \
            --format json || true

      - name: Build source/sink artifact index
        if: always()
        run: |
          uv run dpone ops artifact-index \
            --output-dir test_artifacts/certification/evidence-index/matrix \
            --root test_artifacts/integration_matrix \
            --root test_artifacts/strategy_certification/matrix \
            --root test_artifacts/certification/suite/matrix \
            --release "matrix-${{ github.run_id }}-${{ github.run_attempt }}" \
            --format json || true

      - name: Build source/sink evidence chain
        if: always()
        run: |
          uv run dpone ops evidence-chain \
            --chain-dir test_artifacts/certification/evidence-chain/matrix \
            --release "matrix-${{ github.run_id }}-${{ github.run_attempt }}" \
            --artifact-index test_artifacts/certification/evidence-index/matrix/artifact_index.json \
            --format json || true

      - name: Verify source/sink evidence chain
        if: always()
        run: |
          uv run dpone ops evidence-chain-verify \
            --chain-dir test_artifacts/certification/evidence-chain/matrix \
            --format json

      - name: Upload integration matrix artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: source-sink-integration-matrix
          path: test_artifacts/integration_matrix/

      - name: Upload matrix strategy certification bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: strategy-certification-matrix
          path: test_artifacts/strategy_certification/matrix
          if-no-files-found: warn

      - name: Upload source/sink certification suite
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: source-sink-certification-suite
          path: test_artifacts/certification/suite/matrix
          if-no-files-found: warn

      - name: Upload source/sink evidence chain
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: source-sink-evidence-chain
          path: |
            test_artifacts/certification/evidence-index/matrix
            test_artifacts/certification/evidence-chain/matrix
          if-no-files-found: warn
