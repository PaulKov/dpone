          fi
          if [ -f "$CERT_ROOT/refresh-executor/postgres-mssql/sink_route_refresh_snapshot.json" ]; then
            POSTGRES_MSSQL_ARTIFACTS+=(--artifact sink_route_refresh_snapshot="$CERT_ROOT/refresh-executor/postgres-mssql/sink_route_refresh_snapshot.json")
          fi
          uv run dpone ops route-live-certification \
            --output-dir "$CERT_ROOT/route-live/mssql-to-clickhouse" \
            --release "live-certification-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --source mssql \
            --sink clickhouse \
            --strategy incremental_merge \
            --profile "${CERT_PROFILE}" \
            --row-count "${CERT_ROW_COUNT}" \
            "${COMMON_ARTIFACTS[@]}" \
            "${MSSQL_CLICKHOUSE_ARTIFACTS[@]}" \
            --format json
          uv run dpone ops route-live-certification \
            --output-dir "$CERT_ROOT/route-live/postgres-to-mssql" \
            --release "live-certification-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --source postgres \
            --sink mssql \
            --strategy incremental_merge \
            --profile "${CERT_PROFILE}" \
            --row-count "${CERT_ROW_COUNT}" \
            "${COMMON_ARTIFACTS[@]}" \
            "${POSTGRES_MSSQL_ARTIFACTS[@]}" \
            --format json

      - name: "Disabled (UNVERIFIED): route release gates"
        if: ${{ false }}
        run: |
          uv run dpone ops route-release-gate \
            --output-dir "$CERT_ROOT/route-release/mssql-to-clickhouse" \
            --release "live-certification-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --source mssql \
            --sink clickhouse \
            --strategy incremental_merge \
            --artifact route_live_evidence_bundle="$CERT_ROOT/route-live/mssql-to-clickhouse/route_live_certification.json" \
            --require route_live_evidence_bundle \
            --format json
          uv run dpone ops route-release-gate \
            --output-dir "$CERT_ROOT/route-release/postgres-to-mssql" \
            --release "live-certification-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --source postgres \
            --sink mssql \
            --strategy incremental_merge \
            --artifact route_live_evidence_bundle="$CERT_ROOT/route-live/postgres-to-mssql/route_live_certification.json" \
            --require route_live_evidence_bundle \
            --format json

      - name: "Disabled (UNVERIFIED): route release candidate orchestration receipts"
        if: ${{ false }}
        run: |
          RC_COMMON_ARTIFACTS=(
            --artifact service_markers="$CERT_ROOT/service_markers.json"
            --artifact benchmark_slo="$CERT_ROOT/benchmark-slo/benchmark_slo_gate.json"
            --artifact performance_certification="$CERT_ROOT/performance-certification/performance_certification.json"
            --artifact live_state_reconciliation="$CERT_ROOT/live-state-reconciliation/live_state_reconciliation.json"
            --artifact pre_release_checklist="$CERT_ROOT/pre-release/pre_release_checklist.json"
            --artifact evidence_chain="$CERT_ROOT/evidence-chain/evidence_chain_index.json"
          )
          if [ "${CERT_PROFILE}" = "native_transfer" ]; then
            RC_COMMON_ARTIFACTS+=(--artifact native_transfer_evidence="$CERT_ROOT/strategy-certification/strategy_certification_bundle.json")
          fi
          uv run dpone ops route-rc-orchestrator \
            --output-dir "$CERT_ROOT/route-rc/mssql-to-clickhouse" \
            --release "live-certification-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --source mssql \
            --sink clickhouse \
            --strategy incremental_merge \
            --profile "${CERT_PROFILE}" \
            --row-count "${CERT_ROW_COUNT}" \
            "${RC_COMMON_ARTIFACTS[@]}" \
            --format json
          uv run dpone ops route-rc-orchestrator \
            --output-dir "$CERT_ROOT/route-rc/postgres-to-mssql" \
            --release "live-certification-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --source postgres \
            --sink mssql \
            --strategy incremental_merge \
            --profile "${CERT_PROFILE}" \
            --row-count "${CERT_ROW_COUNT}" \
            "${RC_COMMON_ARTIFACTS[@]}" \
            --format json

      - name: "Disabled (UNVERIFIED): execute route release candidate receipts"
        if: ${{ false }}
        run: |
          ROUTE_RC_EXECUTE_ARGS=()
          if [ "${CERT_EXECUTE_ROUTE_RC_COMMANDS}" = "true" ]; then
            ROUTE_RC_EXECUTE_ARGS+=(--execute)
          fi
          uv run dpone ops route-rc-execute \
            --orchestration-json "$CERT_ROOT/route-rc/mssql-to-clickhouse/route_rc_orchestration.json" \
            --output-dir "$CERT_ROOT/route-rc-execution/mssql-to-clickhouse" \
            --timeout-seconds 1800 \
            --max-attempts 1 \
            "${ROUTE_RC_EXECUTE_ARGS[@]}" \
            --format json
          uv run dpone ops route-rc-execute \
            --orchestration-json "$CERT_ROOT/route-rc/postgres-to-mssql/route_rc_orchestration.json" \
            --output-dir "$CERT_ROOT/route-rc-execution/postgres-to-mssql" \
            --timeout-seconds 1800 \
            --max-attempts 1 \
            "${ROUTE_RC_EXECUTE_ARGS[@]}" \
            --format json

      - name: Stop disposable local services
        if: always()
        run: docker compose -f docker/docker-compose.integration.yml down -v

      - name: Upload live certification artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ inputs.local_artifact_name || 'live-certification-local' }}
          path: test_artifacts/live_certification
          if-no-files-found: error
          retention-days: 90
          overwrite: false

  vendor-live-certification:
    name: Vendor live certification gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: ${{ inputs.profile == 'vendor_live' && inputs.run_vendor_live == true }}
    env:
      CERT_ROW_COUNT: ${{ inputs.row_count }}
      CERT_ROOT: test_artifacts/live_certification_vendor
      DPONE_RUN_INTEGRATION: "1"
      DPONE_RUN_INTEGRATION_LIVE: "1"
      DPONE_RUN_INTEGRATION_MATRIX: "1"
      DPONE_MATRIX_RUN_MODE: vendor_live
      DPONE_MATRIX_STRATEGY: backfill
      DPONE_MATRIX_SOURCE: ${{ inputs.vendor_backfill_source_filter }}
      DPONE_MATRIX_SINK: ${{ inputs.vendor_backfill_sink_filter }}
      DPONE_MATRIX_CASE_ID: ${{ inputs.vendor_backfill_case_id_filter }}
      DPONE_MATRIX_ROW_COUNT: ${{ inputs.row_count }}
      DPONE_MATRIX_ARTIFACT_DIR: test_artifacts/live_certification_vendor/backfill_matrix
      APPSFLYER_API_TOKEN: ${{ secrets.APPSFLYER_API_TOKEN }}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
      GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
      MINDBOX_SECRET_KEY: ${{ secrets.MINDBOX_SECRET_KEY }}
      SIMILARWEB_API_KEY: ${{ secrets.SIMILARWEB_API_KEY }}
      YANDEX_WEBMASTER_OAUTH_TOKEN: ${{ secrets.YANDEX_WEBMASTER_OAUTH_TOKEN }}
      OPENEXCHANGERATES_APP_ID: ${{ secrets.OPENEXCHANGERATES_APP_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.28"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Build vendor live plan
        run: |
          uv run dpone ops live-certification-plan \
            --output-dir "$CERT_ROOT/plan" \
            --profile vendor_live \
            --include-vendor-live \
            --row-count "${CERT_ROW_COUNT}" \
            --format json

      - name: Verify managed credential readiness
        run: |
          uv run dpone ops managed-credentials-readiness \
            --profile vendor_live \
            --required-env APPSFLYER_API_TOKEN \
            --required-env GOOGLE_ADS_DEVELOPER_TOKEN \
            --required-env GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON \
            --required-env MINDBOX_SECRET_KEY \
            --required-env SIMILARWEB_API_KEY \
            --required-env YANDEX_WEBMASTER_OAUTH_TOKEN \
            --required-env OPENEXCHANGERATES_APP_ID \
            --output-dir "$CERT_ROOT/managed-credentials" \
            --format json

      - name: Run vendor live backfill matrix
        run: |
          mkdir -p "$DPONE_MATRIX_ARTIFACT_DIR"
          uv run pytest -m integration_matrix tests/integration/matrix -q \
            --junitxml="$DPONE_MATRIX_ARTIFACT_DIR/backfill_vendor_live_junit.xml"
          uv run python tools/ci/assert_junit_executed.py \
            --junit "$DPONE_MATRIX_ARTIFACT_DIR/backfill_vendor_live_junit.xml" \
            --min-passed 1 \
            --max-skipped 0 \
            --evidence-json "$DPONE_MATRIX_ARTIFACT_DIR/backfill_vendor_live.json" \
            --profile vendor_live \
            --commit-sha "$GITHUB_SHA" \
            --summary-md "$GITHUB_STEP_SUMMARY"

      - name: Run vendor live tests
        run: |
          uv run pytest -m "integration_live and not route_live_wide" tests/integration -q \
            --junitxml="$CERT_ROOT/vendor_live_junit.xml"
          uv run python tools/ci/assert_junit_executed.py \
            --junit "$CERT_ROOT/vendor_live_junit.xml" \
            --min-passed 1 \
            --max-skipped 0 \
            --evidence-json "$CERT_ROOT/vendor_live_tests.json" \
            --profile vendor_live \
            --commit-sha "$GITHUB_SHA" \
            --summary-md "$GITHUB_STEP_SUMMARY"

      - name: Upload vendor live artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: live-certification-vendor
          path: test_artifacts/live_certification_vendor
          if-no-files-found: warn
