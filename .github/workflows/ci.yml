name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality-preflight:
    name: Quality preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Match GitLab CI: pytest must exercise the uv-installed editable wheel only.
      # Without this, tests/conftest.py prepends src/ and duplicates dpone modules under xdist.
      DPONE_TEST_USE_INSTALLED_PACKAGE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.28"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Validate changed workflows with pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          ACTIONLINT_VERSION=1.7.12
          ACTIONLINT_DIR="${RUNNER_TEMP}/actionlint-${ACTIONLINT_VERSION}"
          ACTIONLINT_ARCHIVE="${RUNNER_TEMP}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          ACTIONLINT_BIN="${ACTIONLINT_DIR}/actionlint"
          mkdir "${ACTIONLINT_DIR}"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "${ACTIONLINT_ARCHIVE}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' \
            '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' \
            "${ACTIONLINT_ARCHIVE}" | sha256sum --check --status
          LC_ALL=C tar -xOf "${ACTIONLINT_ARCHIVE}" actionlint > "${ACTIONLINT_BIN}.tmp"
          test "$(wc -c < "${ACTIONLINT_BIN}.tmp" | tr -d ' ')" = "6074530"
          printf '%s  %s\n' \
            'c872d6db8c6bf83a8eaa704fc93999f027d55dffbc63b8a6abdccb47df5f4cd4' \
            "${ACTIONLINT_BIN}.tmp" | sha256sum --check --status
          chmod 0755 "${ACTIONLINT_BIN}.tmp"
          mv "${ACTIONLINT_BIN}.tmp" "${ACTIONLINT_BIN}"
          test "$("${ACTIONLINT_BIN}" -version | sed -n '1p')" = "${ACTIONLINT_VERSION}"

          actionlint_flags=(-no-color -format '{{json .}}' -shellcheck '' -pyflakes '')
          expected_empty="${RUNNER_TEMP}/actionlint-empty.json"
          nonqueue_stdout="${RUNNER_TEMP}/actionlint-nonqueue.stdout"
          nonqueue_stderr="${RUNNER_TEMP}/actionlint-nonqueue.stderr"
          nightly_stdout="${RUNNER_TEMP}/actionlint-nightly.stdout"
          nightly_stderr="${RUNNER_TEMP}/actionlint-nightly.stderr"
          waived_stdout="${RUNNER_TEMP}/actionlint-nightly-waived.stdout"
          waived_stderr="${RUNNER_TEMP}/actionlint-nightly-waived.stderr"
          printf '[]\n' > "${expected_empty}"

          "${ACTIONLINT_BIN}" "${actionlint_flags[@]}" \
            .github/workflows/ci.yml \
            .github/workflows/airflow-pack-compat.yml \
            .github/workflows/pages.yml \
            .github/workflows/dependency-review.yml \
            > "${nonqueue_stdout}" 2> "${nonqueue_stderr}"
          cmp "${expected_empty}" "${nonqueue_stdout}"
          test ! -s "${nonqueue_stderr}"

          set +e
          "${ACTIONLINT_BIN}" "${actionlint_flags[@]}" \
            .github/workflows/airflow-pack-compat-nightly.yml \
            > "${nightly_stdout}" 2> "${nightly_stderr}"
          nightly_status=$?
          set -e
          if [[ "${nightly_status}" -eq 0 ]]; then
            echo "ACTIONLINT_QUEUE_WAIVER_OBSOLETE" >&2
            exit 1
          fi
          test "${nightly_status}" -eq 1
          test ! -s "${nightly_stderr}"
          python - "${nightly_stdout}" <<'PY'
          import json
          import pathlib
          import sys

          diagnostics = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = {
              "filepath": ".github/workflows/airflow-pack-compat-nightly.yml",
              "kind": "syntax-check",
              "message": 'unexpected key "queue" for "concurrency" section. expected one of "cancel-in-progress", "group"',
          }
          assert isinstance(diagnostics, list) and len(diagnostics) == 1
          assert {key: diagnostics[0].get(key) for key in expected} == expected
          PY

          "${ACTIONLINT_BIN}" "${actionlint_flags[@]}" \
            -ignore '^unexpected key "queue" for "concurrency" section\. expected one of "cancel-in-progress", "group"$' \
            .github/workflows/airflow-pack-compat-nightly.yml \
            > "${waived_stdout}" 2> "${waived_stderr}"
          cmp "${expected_empty}" "${waived_stdout}"
          test ! -s "${waived_stderr}"

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy --config-file mypy.ini

      - name: Import rules
        run: uv run dpone docs check-import-rules

      - name: Layer metrics
        run: uv run dpone docs check-layer-metrics --baseline docs/layer_metrics_baseline.json

      - name: Architecture fitness
        run: |
          mkdir -p test_artifacts/architecture-fitness
          uv run dpone docs check-architecture-fitness --format json \
            > test_artifacts/architecture-fitness/architecture_fitness.json

      - name: Upload architecture fitness evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: architecture-fitness
          path: test_artifacts/architecture-fitness/architecture_fitness.json
          if-no-files-found: error
          retention-days: 90

      - name: Module size
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          BASE_SHA="$EVENT_BASE_SHA"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$(git merge-base "$HEAD_SHA" "$EVENT_BASE_SHA")"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            BASE_SHA="$(git merge-base "$HEAD_SHA" "origin/$DEFAULT_BRANCH")"
            if [ "$BASE_SHA" = "$HEAD_SHA" ]; then
              BASE_SHA="$(git rev-parse "${HEAD_SHA}^")"
            fi
          fi
          test -n "$BASE_SHA"
          uv run dpone docs check-module-size \
            --baseline docs/module_size_baseline.json \
            --base-ref "$BASE_SHA" \
            --head-ref "$HEAD_SHA"

      - name: Airflow provider module size
        run: >
          uv run dpone docs check-module-size
          --package packages/dpone-airflow-pack/src/dpone_airflow_pack
          --no-baseline

      - name: Formal Airflow provider module size
        run: >
          uv run dpone docs check-module-size
          --package packages/apache-airflow-providers-dpone/src/airflow/providers/dpone
          --no-baseline

      - name: Agent policy module size
        run: >
          uv run dpone docs check-module-size
          --package tools/agent_policy
          --no-baseline
          --warn-lines 350
          --max-lines 400
          --warn-sloc 300
          --max-sloc 350

      - name: Agent policy test module size
        run: >
          uv run dpone docs check-module-size
          --package tests/agent_policy
          --no-baseline
          --warn-lines 350
          --max-lines 400
          --warn-sloc 300
          --max-sloc 350

      - name: Validate agent control plane
        run: uv run python tools/agent_policy/validate_setup.py .

      - name: Workflow security policy
        run: uv run python tools/agent_policy/workflow_security.py .

      - name: Build documentation strictly
        run: uv run mkdocs build --strict

      - name: Generated references
        run: uv run dpone docs check-generated-references

      - name: Governed REST delivery design contract
        run: >
          uv run dpone docs check-rest-delivery-design-contract
          --format json

      - name: Frozen Airflow public contract
        run: |
          mkdir -p test_artifacts/airflow-v1-public-contract-freeze
          uv run dpone docs check-airflow-public-contracts --format json \
            > test_artifacts/airflow-v1-public-contract-freeze/airflow-v1-public-contract-report.json
          uv run dpone docs update-airflow-public-contract-reference --check

      - name: Upload Airflow public contract evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: airflow-v1-public-contract
          path: test_artifacts/airflow-v1-public-contract-freeze/
          if-no-files-found: ignore
          retention-days: 90

      - name: Generated developer metrics
        run: uv run dpone docs update-dev-metrics --check

      - name: Build packages
        run: |
          uv build
          uv build packages/dpone-native-accel --out-dir dist
          uv build packages/dpone-airflow-pack --out-dir dist
          uv build packages/apache-airflow-providers-dpone --out-dir dist

      - name: Smoke REST design contract from clean base wheel
        run: |
          python -m venv /tmp/dpone-rest-contract-smoke
          uv pip install --python /tmp/dpone-rest-contract-smoke/bin/python --find-links dist dist/dpone-*.whl
          /tmp/dpone-rest-contract-smoke/bin/dpone docs check-rest-delivery-design-contract --format json

      - name: Collect exact non-live test population
        run: |
          set -euo pipefail
          mkdir -p test_artifacts/ci-quality
          uv run pytest -o addopts='' -m "not integration_live" --collect-only -q \
            | awk '/::/ { print }' | LC_ALL=C sort -u \
            > test_artifacts/ci-quality/nodeids.txt
          test -s test_artifacts/ci-quality/nodeids.txt
          uv run python tools/ci_quality_shards.py \
            --nodeids-file test_artifacts/ci-quality/nodeids.txt \
            --shard-count 8 \
            --output test_artifacts/ci-quality/shard-manifest.json

      - name: Upload exact test population
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: quality-test-population
          path: test_artifacts/ci-quality/
          if-no-files-found: error
          retention-days: 14

  quality-shards:
    name: Quality tests (${{ matrix.python-version }}, shard ${{ matrix.shard-index }})
    needs: [quality-preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      DPONE_TEST_USE_INSTALLED_PACKAGE: "1"
      DPONE_CI_TEST_SHARD: ${{ matrix.shard-index }}
      DPONE_CI_TEST_SHARD_COUNT: "8"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        shard-index: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.28"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Collect exact shard membership
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p test_artifacts/ci-quality
          uv run pytest -o addopts='' -m "not integration_live" --collect-only -q \
            | awk '/::/ { print }' | LC_ALL=C sort -u \
            > test_artifacts/ci-quality/nodeids.txt
          uv run python tools/ci_quality_shards.py \
            --nodeids-file test_artifacts/ci-quality/nodeids.txt \
            --shard-count 8 \
            --shard-index "$DPONE_CI_TEST_SHARD" \
            --head-sha "$HEAD_SHA" \
            --python-version "${{ matrix.python-version }}" \
            --output test_artifacts/ci-quality/receipt-pretest.json

      - name: Run deterministic test shard
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -uo pipefail
          started_at="$(date +%s)"
          set +e
          PYTHONPATH=. uv run pytest -p tools.ci_quality_shards -m "not integration_live" -n auto --dist loadfile \
            --cov=src/dpone \
            --cov=packages/dpone-airflow-pack/src/dpone_airflow_pack \
            --cov-fail-under=0 \
            --cov-append
          test_status=$?
          set -e
          duration_seconds="$(( $(date +%s) - started_at ))"
          uv run python tools/ci_quality_shards.py \
            --nodeids-file test_artifacts/ci-quality/nodeids.txt \
            --shard-count 8 \
            --shard-index "$DPONE_CI_TEST_SHARD" \
            --head-sha "$HEAD_SHA" \
            --python-version "${{ matrix.python-version }}" \
            --duration-seconds "$duration_seconds" \
            --output test_artifacts/ci-quality/receipt.json
          exit "$test_status"

      - name: Upload shard evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: quality-shard-${{ matrix.python-version }}-${{ matrix.shard-index }}
          path: |
            .coverage
            test_artifacts/ci-quality/receipt.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  quality:
    name: Quality checks
    needs: [quality-shards]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Require successful preflight and all test shards
        env:
          SHARDS_RESULT: ${{ needs.quality-shards.result }}
        run: |
          set -euo pipefail
          test "$SHARDS_RESULT" = success

      - name: Checkout exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.28"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Download exact interpreter shard evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: quality-shard-${{ matrix.python-version }}-*
          path: test_artifacts/ci-quality/shards

      - name: Validate complete exact interpreter matrix
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          uv run python tools/ci_quality_shards.py \
            --receipts-directory test_artifacts/ci-quality/shards \
            --shard-count 8 \
            --head-sha "$HEAD_SHA" \
            --python-version "${{ matrix.python-version }}" \
            --output test_artifacts/ci-quality/receipt-validation.json

      - name: Combine 3.12 coverage
        if: matrix.python-version == '3.12'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          uv run python tools/ci_quality_shards.py \
            --receipts-directory test_artifacts/ci-quality/shards \
            --shard-count 8 \
            --head-sha "$HEAD_SHA" \
            --python-version "3.12" \
            --output test_artifacts/ci-quality/receipt-validation-coverage.json
          mapfile -t coverage_files < <(find test_artifacts/ci-quality/shards -name .coverage -type f | LC_ALL=C sort)
          test "${#coverage_files[@]}" = 8
          uv run coverage combine "${coverage_files[@]}"
          uv run coverage report
          uv run coverage xml

      - name: Upload combined coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: |
            coverage.xml
            test_artifacts/ci-quality/receipt-validation.json
          if-no-files-found: error
          retention-days: 90

  quality-timing:
    name: Quality timing evidence
    needs: [quality]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require successful required quality contexts
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: |
          set -euo pipefail
          test "$QUALITY_RESULT" = success

      - name: Checkout exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Download exact 3.12 aggregate evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage
          path: test_artifacts/ci-quality/aggregate

      - name: Build exact-head timing evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p test_artifacts/ci-quality
          python - <<'PY'
          import datetime as dt
          import hashlib
          import json
          import os
          import pathlib
          import urllib.request

          root = pathlib.Path(".")
          request = urllib.request.Request(
              f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}/jobs?per_page=100",
              headers={"Accept": "application/vnd.github+json", "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              jobs = json.load(response)["jobs"]
          selected = [job for job in jobs if job["name"] == "Quality preflight" or job["name"].startswith("Quality tests (") or job["name"].startswith("Quality checks (")]
          assert selected and all(job["conclusion"] == "success" and job["started_at"] and job["completed_at"] for job in selected)
          parse = lambda value: dt.datetime.fromisoformat(value.replace("Z", "+00:00"))
          duration = (max(parse(job["completed_at"]) for job in selected) - min(parse(job["started_at"]) for job in selected)).total_seconds()
          aggregate = root / "test_artifacts/ci-quality/aggregate"
          def one_artifact_file(name):
              candidates = tuple(aggregate.rglob(name))
              assert len(candidates) == 1, f"expected exactly one {name}, found {len(candidates)}"
              return candidates[0]
          receipt = json.loads(one_artifact_file("receipt-validation.json").read_text(encoding="utf-8"))
          coverage = one_artifact_file("coverage.xml")
          digest = lambda path: hashlib.sha256(path.read_bytes()).hexdigest()
          payload = {
              "schema_version": 1, "repository": os.environ["GITHUB_REPOSITORY"], "workflow_path": ".github/workflows/ci.yml",
              "workflow_sha256": digest(root / ".github/workflows/ci.yml"), "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]), "head_sha": os.environ["HEAD_SHA"], "python_version": "3.12",
              "status": "PASS", "critical_path_seconds": duration,
              "collection": {"node_count": receipt["population_count"], "population_sha256": receipt["population_sha256"], "shard_count": receipt["shard_count"]},
              "coverage": {"config_sha256": digest(root / "pyproject.toml"), "input_artifacts": [{"name": "coverage.xml", "sha256": digest(coverage)}], "ratchet_status": "PASS"},
          }
          (root / "test_artifacts/ci-quality/timing.json").write_text(json.dumps(payload, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Upload immutable timing evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-quality-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: test_artifacts/ci-quality/timing.json
          if-no-files-found: error
          retention-days: 90

  doctor-import-windows:
    name: Doctor import Windows (${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      DPONE_TEST_USE_INSTALLED_PACKAGE: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.28"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Prove Windows doctor import backend
        run: >-
          uv run pytest -q
          tests/test_doctor_import_runner.py::test_windows_default_probe_executes_a_real_import
          tests/test_doctor_import_environment.py
          tests/test_doctor_import_integration.py::test_import_probe_distinguishes_missing_target_from_broken_dependency
          tests/test_doctor_import_protocol.py::test_import_probe_does_not_accept_target_os_exit_zero_without_receipt
          tests/test_doctor_import_runner.py::test_windows_default_probe_bounds_a_hanging_direct_child
          tests/test_doctor_import_runner.py::test_windows_runner_bounds_a_child_that_never_reads_stdin
          tests/test_doctor_import_public_contract.py::test_public_doctor_dataclass_signatures_remain_v1_compatible
          tests/test_doctor_import_runtime_identity.py
          tests/test_doctor_import_site_roots.py
          tests/test_doctor_import_startup_controls.py
          tests/test_doctor_import_startup_hooks.py
          tests/test_doctor_import_startup_portability.py
          tests/test_doctor_import_startup_surface.py

      - name: Prove Windows MSSQL character-spool confinement
        run: >-
          uv run pytest -q
          tests/test_mssql_spool_storage.py::test_spool_admission_provisions_the_exact_work_dir_and_reserves_headroom
          tests/test_mssql_spool_storage.py::test_windows_directory_lease_blocks_path_swap_until_cleanup
          tests/test_mssql_spool_storage.py::test_bcp_consumer_reads_held_identity_after_final_directory_refresh
          tests/test_mssql_spool_storage.py::test_manager_spools_only_inside_policy_work_dir_and_eagerly_cleans

  governance-source:
    needs: [quality]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact_id: "${{ steps.governance-upload.outputs.artifact-id }}"
      artifact_digest: "${{ steps.governance-upload.outputs.artifact-digest }}"
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.28"

      - name: Generate agent governance evidence
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            mapfile -d '' -t changed_paths < <(git diff --no-renames --name-only --diff-filter=ACDMRT -z "$BASE_SHA...$HEAD_SHA")
          else
            changed_paths=()
          fi
          uv run --frozen python tools/agent_policy/governance_gate.py \
            "${changed_paths[@]}" \
            --base-ref origin/master \
            --head-commit "$HEAD_SHA" \
            --output test_artifacts/agent-policy/agent_governance_gate.json

      - name: Upload agent governance evidence
        id: governance-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: agent-governance-gate
          path: test_artifacts/agent-policy/agent_governance_gate.json
          if-no-files-found: error
          retention-days: 90
          archive: true
          overwrite: false
          include-hidden-files: false

  governance-attestation:
    needs: [governance-source]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: "${{ needs.governance-source.outputs.artifact_id }}"
          path: test_artifacts/agent-policy/attested-governance
          digest-mismatch: error
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: test_artifacts/agent-policy/attested-governance/agent_governance_gate.json

  postgres-xmin:
    name: PostgreSQL XMin integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dpone_it
          POSTGRES_USER: dpone
          POSTGRES_PASSWORD: dpone
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dpone -d dpone_it"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DPONE_TEST_USE_INSTALLED_PACKAGE: "1"
      DPONE_RUN_INTEGRATION: "1"
      DPONE_IT_PG_HOST: 127.0.0.1
      DPONE_IT_PG_PORT: "5432"
      DPONE_IT_PG_DATABASE: dpone_it
      DPONE_IT_PG_USER: dpone
      DPONE_IT_PG_PASSWORD: dpone
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.28"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Run PostgreSQL XMin integration tests
        run: uv run pytest -m integration_postgres_xmin tests/integration/postgres -q

  acceptance-plan:
    name: Exact-commit acceptance plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      classification: ${{ steps.plan.outputs.classification }}
      head_sha: ${{ steps.plan.outputs.head_sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.28"
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Produce additive acceptance plan
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          BASE_SHA="$EVENT_BASE_SHA"
          if [ "$EVENT_NAME" = pull_request ]; then
            BASE_SHA="$(git --no-replace-objects merge-base "$HEAD_SHA" "$EVENT_BASE_SHA")"
          elif [ "$EVENT_NAME" = workflow_dispatch ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git --no-replace-objects rev-parse "${HEAD_SHA}^")"
          fi
          test -n "$BASE_SHA"
          uv run python tools/agent_policy/acceptance_plan.py \
            --base-ref "$BASE_SHA" --head-ref "$HEAD_SHA" \
            --output test_artifacts/acceptance/plan.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          plan = json.loads(Path("test_artifacts/acceptance/plan.json").read_text())
          assert plan["head_sha"] == os.environ["HEAD_SHA"]
          assert plan["classification"] in {"schedule_only", "broad", "no_changes"}
          assert plan["preserve_existing_required_checks"] is True
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"classification={plan['classification']}\nhead_sha={plan['head_sha']}\n")
          PY
      - name: Upload acceptance plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: acceptance-plan
          path: test_artifacts/acceptance/plan.json
          if-no-files-found: error
          retention-days: 14

  acceptance-contracts:
    name: Scheduling acceptance contracts
    needs: [acceptance-plan]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      DPONE_TEST_USE_INSTALLED_PACKAGE: "1"
      HEAD_SHA: ${{ needs.acceptance-plan.outputs.head_sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ needs.acceptance-plan.outputs.head_sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.28"
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Run parser serialization scheduling and interval contracts
        run: |
          set -euo pipefail
          mkdir -p test_artifacts/acceptance-contracts
          test_files=(
            tests/test_acceptance_plan.py tests/test_agent_policy_select_checks.py
            tests/test_airflow_dag_schedule.py tests/test_airflow_dag_spec_contract.py
            tests/test_airflow_interval_contract.py
            tests/test_run_interval_context.py
          )
          uv run pytest -o addopts='' -q "${test_files[@]}" \
            --junitxml=test_artifacts/acceptance-contracts/junit.xml
          receipt_args=()
          for test_file in "${test_files[@]}"; do
            receipt_args+=(--require-test-file "$test_file")
          done
          uv run python tools/agent_policy/acceptance_plan.py --head-ref "$HEAD_SHA" \
            --verify-junit test_artifacts/acceptance-contracts/junit.xml "${receipt_args[@]}" \
            --output test_artifacts/acceptance-contracts/receipt.json
      - name: Upload scheduling acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: acceptance-contracts
          path: test_artifacts/acceptance-contracts/
          if-no-files-found: error
          retention-days: 14

  bounded-window-smoke:
    name: Synthetic PostgreSQL ClickHouse window smoke
    needs: [acceptance-plan]
    if: needs.acceptance-plan.outputs.classification == 'broad'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dpone_it
          POSTGRES_USER: dpone
          POSTGRES_PASSWORD: dpone
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dpone -d dpone_it"
          --health-interval 5s --health-timeout 5s --health-retries 20
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_DB: dpone_it
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: dpone
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports: ["8123:8123", "9000:9000"]
        options: >-
          --health-cmd "wget --quiet --spider http://localhost:8123/ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DPONE_TEST_USE_INSTALLED_PACKAGE: "1"
      DPONE_RUN_INTEGRATION: "1"
      DPONE_IT_PG_HOST: 127.0.0.1
      DPONE_IT_PG_PORT: "5432"
      DPONE_IT_PG_DATABASE: dpone_it
      DPONE_IT_PG_USER: dpone
      DPONE_IT_PG_PASSWORD: dpone
      DPONE_IT_CH_HOST: 127.0.0.1
      DPONE_IT_CH_PORT: "9000"
      DPONE_IT_CH_HTTP_PORT: "8123"
      DPONE_IT_CH_DATABASE: dpone_it
      DPONE_IT_CH_USER: default
      DPONE_IT_CH_PASSWORD: dpone
      HEAD_SHA: ${{ needs.acceptance-plan.outputs.head_sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ needs.acceptance-plan.outputs.head_sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.28"
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Record public service image identities
        run: |
          set -euo pipefail
          mkdir -p test_artifacts/bounded-window-smoke
          docker image inspect postgres:16-alpine clickhouse/clickhouse-server:24.8 \
            --format '{{json .RepoDigests}}' > test_artifacts/bounded-window-smoke/image-digests.jsonl
      - name: Run synthetic window route and corner contracts
        run: |
          set -euo pipefail
          test_files=(
            tests/integration/postgres/test_postgres_window_source_integration.py
            tests/integration/clickhouse/test_clickhouse_window_target_integration.py
            tests/integration/postgres/test_bounded_window_route_integration.py
            tests/test_bounded_window_execution.py tests/test_bounded_window_store.py
            tests/test_bounded_typed_stream.py tests/test_rolling_window_contract.py
            tests/test_rolling_window_runtime.py tests/test_postgres_window_source.py
            tests/test_clickhouse_window_target.py
          )
          uv run pytest -o addopts='' -q "${test_files[@]}" \
            --junitxml=test_artifacts/bounded-window-smoke/junit.xml
          receipt_args=()
          for test_file in "${test_files[@]}"; do
            receipt_args+=(--require-test-file "$test_file")
          done
          uv run python tools/agent_policy/acceptance_plan.py --head-ref "$HEAD_SHA" \
            --verify-junit test_artifacts/bounded-window-smoke/junit.xml "${receipt_args[@]}" \
            --output test_artifacts/bounded-window-smoke/receipt.json
      - name: Upload synthetic window evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bounded-window-smoke
          path: test_artifacts/bounded-window-smoke/
          if-no-files-found: error
          retention-days: 14

  acceptance:
    name: Acceptance checks
    needs: [acceptance-plan, acceptance-contracts, bounded-window-smoke]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require all selected acceptance jobs
        env:
          PLAN_RESULT: ${{ needs.acceptance-plan.result }}
          CONTRACT_RESULT: ${{ needs.acceptance-contracts.result }}
          SMOKE_RESULT: ${{ needs.bounded-window-smoke.result }}
          CLASSIFICATION: ${{ needs.acceptance-plan.outputs.classification }}
        run: |
          set -euo pipefail
          test "$PLAN_RESULT" = success
          test "$CONTRACT_RESULT" = success
          case "$CLASSIFICATION" in
            broad) test "$SMOKE_RESULT" = success ;;
            schedule_only|no_changes) test "$SMOKE_RESULT" = skipped ;;
            *) exit 1 ;;
          esac
