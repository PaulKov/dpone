name: Secret Scan

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: "53 3 * * 1"

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog verified secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan repository
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c # v3.97.4
        with:
          path: ./
          # Lob verifies any `test_` + exactly 35 [a-zA-Z0-9_-] identifiers as API keys;
          # pytest function names hit this pattern (PR #514 history rewrite, PR #510 a32a1045,
          # master 3d3c435d). Real secrets are covered by other verified detectors.
          extra_args: --only-verified --exclude-detectors=lob
