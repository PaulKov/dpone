name: Secret Scan

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: "53 3 * * 1"

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog verified secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Scan repository
        uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55 # v3.95.9
        with:
          path: ./
          # Lob verifies any `test_` + exactly 35 [a-zA-Z0-9_-] identifiers as API keys;
          # pytest function names hit this pattern (PR #514 history rewrite, PR #510 a32a1045,
          # master 3d3c435d). Real secrets are covered by other verified detectors.
          extra_args: --only-verified --exclude-detectors=lob
