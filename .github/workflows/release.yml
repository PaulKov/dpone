                      "status": "PASS",
                      "tag": os.environ["RELEASE_TAG"],
                      "tag_object_sha": ref_object["sha"],
                  },
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Confirm controller is the sole PyPI publisher
        run: |
          set -euo pipefail
          echo "Release candidates are authorized for the external OIDC controller."
          echo "PyPI publication is performed only by PaulKov/dpone-release-controller/.github/workflows/pypi-release.yml."

      - name: Upload pre-publication evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-pre-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: test_artifacts/release-pre-publication/
          if-no-files-found: error
          retention-days: 90
          overwrite: false

  verify-public-bytes:
    name: Verify public PyPI bytes
    needs:
      - preflight
      - build
      - attest
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download immutable release candidates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.build.outputs.candidates_artifact_id }}
          digest-mismatch: error
          path: .

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.28"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install verification dependencies
        run: uv sync --all-extras

      - name: Verify exact PyPI wheel and sdist identities
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p test_artifacts/pypi-release-smoke
          uv run python tools/pypi_release_smoke_dist.py \
            --dist-dir dist \
            --expected-version "${RELEASE_VERSION}" \
            --timeout-seconds 900 \
            --poll-interval-seconds 30 \
            --install-smoke \
            --dpone-install-extra accel \
            --format md \
            | tee test_artifacts/pypi-release-smoke/pypi_release_smoke.md

      - name: Upload PyPI resolver smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pypi-resolver-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: test_artifacts/pypi-release-smoke/
          if-no-files-found: error
          retention-days: 90
          overwrite: false

  github-release:
    name: Create GitHub Release
    needs:
      - verifier
      - preflight
      - build
      - attest
      - publish
      - verify-public-bytes
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: write
      statuses: read
    steps:
      - name: Verify immutable release verifier artifact provider identity
        env:
          EXPECTED_ARTIFACT_ID: ${{ needs.verifier.outputs.artifact_id }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.verifier.outputs.artifact_digest }}
          EXPECTED_ARTIFACT_NAME: ${{ needs.verifier.outputs.artifact_name }}
          EXPECTED_PRODUCER_RUN_ATTEMPT: ${{ needs.verifier.outputs.producer_run_attempt }}
          EXPECTED_RELEASE_COMMIT: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          RECEIPT: test_artifacts/release-pre-publication/release_verifier_provider_identity.json
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "${RECEIPT}")"
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request
          from pathlib import Path

          def digest(value):
              normalized = value.removeprefix("sha256:")
              if re.fullmatch(r"[0-9a-f]{64}", normalized) is None:
                  raise SystemExit("release verifier artifact digest is invalid")
              return f"sha256:{normalized}"

          artifact_id = int(os.environ["EXPECTED_ARTIFACT_ID"])
          attempt = os.environ["EXPECTED_PRODUCER_RUN_ATTEMPT"]
          expected_name = os.environ["EXPECTED_ARTIFACT_NAME"]
          if not attempt.isascii() or not attempt.isdecimal() or attempt.startswith("0"):
              raise SystemExit("release verifier producer attempt is invalid")
          if expected_name != f"release-verifier-{os.environ['GITHUB_RUN_ID']}-{attempt}":
              raise SystemExit("release verifier producer attempt binding is invalid")
          request = urllib.request.Request(
              f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/actions/artifacts/{artifact_id}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          workflow_run = payload.get("workflow_run") or {}
          actual = {
              "id": payload.get("id"),
              "name": payload.get("name"),
              "digest": digest(str(payload.get("digest") or "")),
              "expired": payload.get("expired"),
              "run_id": workflow_run.get("id"),
              "head_sha": workflow_run.get("head_sha"),
          }
          expected = {
              "id": artifact_id,
              "name": expected_name,
              "digest": digest(os.environ["EXPECTED_ARTIFACT_DIGEST"]),
              "expired": False,
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "head_sha": os.environ["EXPECTED_RELEASE_COMMIT"],
          }
          if actual != expected:
              raise SystemExit("release verifier artifact provider identity changed")
          Path(os.environ["RECEIPT"]).write_text(
              json.dumps({"producer_run_attempt": int(attempt), "status": "PASS", **actual}, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Download immutable closed release verifier
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.verifier.outputs.artifact_id }}
          digest-mismatch: error
          path: ${{ runner.temp }}/release-verifier

      - name: Validate closed release verifier before first execution
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.verifier.outputs.manifest_sha256 }}
          VERIFIER_DIR: ${{ runner.temp }}/release-verifier
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import stat
          from pathlib import Path, PurePosixPath

          maximum = 4 * 1024 * 1024
          root = Path(os.environ["VERIFIER_DIR"])

          def regular_bytes(path, label):
              before = path.lstat()
              if path.is_symlink() or not stat.S_ISREG(before.st_mode) or not 0 < before.st_size <= maximum:
                  raise SystemExit(f"closed release verifier contains invalid file: {label}")
              raw = path.read_bytes()
              after = path.lstat()
              identity = lambda value: (value.st_dev, value.st_ino, value.st_mode, value.st_size, value.st_mtime_ns)
              if len(raw) != before.st_size or identity(before) != identity(after):
                  raise SystemExit(f"closed release verifier changed while read: {label}")
              return raw

          root_metadata = root.lstat()
          if root.is_symlink() or not stat.S_ISDIR(root_metadata.st_mode):
              raise SystemExit("closed release verifier root is invalid")
          manifest_name = "pypi-verifier-closure.json"
          manifest_raw = regular_bytes(root / manifest_name, manifest_name)
          if hashlib.sha256(manifest_raw).hexdigest() != os.environ["EXPECTED_MANIFEST_SHA256"]:
              raise SystemExit("closed release verifier manifest differs from producer")
          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise SystemExit("closed release verifier manifest contains a duplicate key; duplicate JSON key")
                  result[key] = value
              return result

          payload = json.loads(
              manifest_raw.decode("utf-8", "strict"),
              object_pairs_hook=unique_object,
          )
          entries = payload.get("files") if isinstance(payload, dict) else None
          if (
              set(payload) != {"files", "profile", "schema"}
              or payload.get("profile") != "ordinary-release"
              or payload.get("schema") != "dpone.pypi_verifier_closure.v1"
              or not isinstance(entries, list)
              or len(entries) != 34
          ):
              raise SystemExit("closed release verifier manifest contract is invalid")
          expected = {manifest_name}
          for entry in entries:
              if not isinstance(entry, dict) or set(entry) != {"path", "sha256", "size", "source"}:
                  raise SystemExit("closed release verifier manifest entry is invalid")
              relative = entry["path"]
              pure = PurePosixPath(relative) if isinstance(relative, str) else PurePosixPath("/")
              if pure.is_absolute() or len(pure.parts) != 1 or relative in expected:
                  raise SystemExit("closed release verifier path is unsafe or duplicate")
              if re.fullmatch(r"[0-9a-f]{64}", str(entry["sha256"])) is None:
                  raise SystemExit("closed release verifier digest is invalid")
              if type(entry["size"]) is not int or not 0 < entry["size"] <= maximum:
                  raise SystemExit("closed release verifier size is invalid")
              source = entry["source"]
              if not isinstance(source, str) or source.startswith("/") or ".." in PurePosixPath(source).parts:
                  raise SystemExit("closed release verifier source is invalid")
              raw = regular_bytes(root / relative, relative)
              if len(raw) != entry["size"] or hashlib.sha256(raw).hexdigest() != entry["sha256"]:
                  raise SystemExit("closed release verifier file differs from manifest")
              expected.add(relative)
          observed = set()
          for path in root.iterdir():
              metadata = path.lstat()
              if path.is_symlink() or not stat.S_ISREG(metadata.st_mode):
                  raise SystemExit("closed release verifier tree contains a non-regular entry")
              observed.add(path.name)
          if observed != expected:
              raise SystemExit("closed release verifier tree is not exact")
          PY
      - name: Download immutable release candidates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.build.outputs.candidates_artifact_id }}
          digest-mismatch: error
          path: .

      - name: Download release attestation evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.attest.outputs.attestation_artifact_id }}
          digest-mismatch: error
          path: test_artifacts/supply-chain

      - name: Download immutable release preflight authority
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.preflight.outputs.evidence_artifact_id }}
          digest-mismatch: error
          path: ${{ runner.temp }}/release-preflight-authority

      - name: Prove exact candidate and public PyPI bytes before GitHub Release
        env:
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          VERIFIER_DIR: ${{ runner.temp }}/release-verifier
        run: |
          set -euo pipefail
          python "${VERIFIER_DIR}/pypi_prepublication_gate.py" \
            --candidate-inventory test_artifacts/release-candidates/candidate-inventory.json \
            --dist-dir dist \
            --expected-version "${RELEASE_VERSION}" \
            --repository "${GITHUB_REPOSITORY}" \
            --commit-sha "${RELEASE_COMMIT}" \
            --release "${RELEASE_TAG}" \
            --workflow-path ".github/workflows/release.yml" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --workflow-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --output test_artifacts/release-pre-publication/pypi_before_github_release.json

      - name: Prove fresh live authority immediately before GitHub Release
        env:
          AUTHORITY_DIR: ${{ runner.temp }}/release-preflight-authority
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERIFIER_DIR: ${{ runner.temp }}/release-verifier
        run: |
          set -euo pipefail
          output_dir="test_artifacts/release-pre-publication"
          python "${VERIFIER_DIR}/release_commit_artifact_gate.py" \
            --repo "${GITHUB_REPOSITORY}" \
            --commit-sha "${RELEASE_COMMIT}" \
            --authorization-report "${AUTHORITY_DIR}/exact_commit_checks.json" \
            --authorization-ruleset-report "${AUTHORITY_DIR}/release_ruleset_snapshot.json" \
            --output "${output_dir}/live_commit_before_github_release.json" \
            --timeout-seconds 300 \
            --poll-interval-seconds 15
          python "${VERIFIER_DIR}/release_merge_receipt_gate.py" \
            --repo "${GITHUB_REPOSITORY}" \
            --commit-sha "${RELEASE_COMMIT}" \
            --required-check-report "${output_dir}/live_commit_before_github_release.json" \
            --output "${output_dir}/merge_receipt_before_github_release.json"
          python "${VERIFIER_DIR}/release_candidate_evidence_gate.py" \
            --repository "${GITHUB_REPOSITORY}" \
            --commit-sha "${RELEASE_COMMIT}" \
            --release "${RELEASE_TAG}" \
            --publication-workflow-path ".github/workflows/release.yml" \
            --publication-run-id "${GITHUB_RUN_ID}" \
            --publication-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --output "${output_dir}/candidate_before_github_release.json"
          OUTPUT="${output_dir}/tag_before_github_release.json" python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          def read(path):
              request = urllib.request.Request(
                  f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/{path}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          ref = read(f"git/ref/tags/{os.environ['RELEASE_TAG']}")
          ref_object = ref.get("object") or {}
          if ref_object.get("type") != "tag" or not isinstance(ref_object.get("sha"), str):
              raise SystemExit("release tag is no longer an annotated tag")
          tag = read(f"git/tags/{ref_object['sha']}")
          target = tag.get("object") or {}
          if target != {"sha": os.environ["RELEASE_COMMIT"], "type": "commit", "url": target.get("url")}:
              raise SystemExit("annotated release tag no longer targets the release commit")
          Path(os.environ["OUTPUT"]).write_text(
              json.dumps(
                  {
                      "commit_sha": target["sha"],
                      "schema_version": 1,
                      "status": "PASS",
                      "tag": os.environ["RELEASE_TAG"],
                      "tag_object_sha": ref_object["sha"],
                  },
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3
        with:
          body_path: release_notes.md
          files: |
            dist/*.whl
            dist/*.tar.gz
            release-candidate-sha256sums.txt
            test_artifacts/supply-chain/**/*.json
            test_artifacts/release-pre-publication/**/*.json

      - name: Upload GitHub Release publication evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-github-publication-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: test_artifacts/release-pre-publication/
          if-no-files-found: error
          retention-days: 90
          overwrite: false
