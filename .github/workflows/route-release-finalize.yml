name: Route release finalize

on:
  workflow_dispatch:
    inputs:
      release:
        description: Release candidate id, for example v0.9.0-rc1
        required: true
        default: v0.9.0-rc1
      profile:
        description: Release profile
        required: true
        type: choice
        options:
          - oss_ci
          - vendor_live
        default: oss_ci
      bundle_root:
        description: Root containing route_certification_bundle.json files
        required: true
        default: test_artifacts/route_certify
      max_age_hours:
        description: Maximum accepted bundle age in hours
        required: true
        default: "24"

permissions:
  contents: read

jobs:
  route-release-finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.28"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Finalize route release evidence
        run: |
          mkdir -p test_artifacts/route_release_finalize
          uv run dpone ops route-release-finalize \
            --release "${{ inputs.release }}" \
            --profile "${{ inputs.profile }}" \
            --bundle-root "${{ inputs.bundle_root }}" \
            --history-dir test_artifacts/route_release_finalize/history \
            --output-dir test_artifacts/route_release_finalize \
            --max-age-hours "${{ inputs.max_age_hours }}" \
            --format json
          test -f test_artifacts/route_release_finalize/route_release_finalizer.json

      - name: Upload route release finalizer artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: route-release-finalize
          path: test_artifacts/route_release_finalize/
          if-no-files-found: warn
