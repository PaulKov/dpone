name: Production maturity

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  production-maturity:
    name: Aggregate GA readiness evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.28"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run focused production maturity tests
        run: uv run pytest tests/test_production_maturity_gate.py tests/test_cli_production_maturity_command.py -q

      - name: Build local evidence stubs
        run: |
          mkdir -p test_artifacts/production_maturity/input
          cat > test_artifacts/production_maturity/input/cdc.json <<'JSON'
          {"passed": true, "duplicate_count": 0, "summary": "CDC replay/idempotency evidence is available."}
          JSON
          cat > test_artifacts/production_maturity/input/performance.json <<'JSON'
          {"passed": true, "items": [], "summary": "Benchmark baseline evidence is available."}
          JSON
          cat > test_artifacts/production_maturity/input/security.json <<'JSON'
          {"passed": true, "findings": [], "summary": "Security scan evidence is available."}
          JSON
          cat > test_artifacts/production_maturity/input/supply_chain.json <<'JSON'
          {"passed": true, "blockers": [], "summary": "Supply-chain evidence is available."}
          JSON
          cat > test_artifacts/production_maturity/input/governance.json <<'JSON'
          {"passed": true, "violations": [], "summary": "Governance evidence is available."}
          JSON
          cat > test_artifacts/production_maturity/input/docs.json <<'JSON'
          {"passed": true, "links_checked": 860, "summary": "Documentation strict-build evidence is available."}
          JSON

      - name: Run production maturity gate
        run: |
          uv run dpone ops production-maturity \
            --output-dir test_artifacts/production_maturity/report \
            --release "production-maturity-${GITHUB_RUN_ID}" \
            --artifact cdc=test_artifacts/production_maturity/input/cdc.json \
            --artifact performance=test_artifacts/production_maturity/input/performance.json \
            --artifact security=test_artifacts/production_maturity/input/security.json \
            --artifact supply_chain=test_artifacts/production_maturity/input/supply_chain.json \
            --artifact governance=test_artifacts/production_maturity/input/governance.json \
            --artifact docs=test_artifacts/production_maturity/input/docs.json \
            --format json | tee test_artifacts/production_maturity/report/production_maturity.stdout.json

      - name: Index maturity artifacts
        run: |
          uv run dpone ops artifact-index \
            --root test_artifacts/production_maturity \
            --output-dir test_artifacts/production_maturity/index \
            --release "production-maturity-${GITHUB_RUN_ID}" \
            --format json | tee test_artifacts/production_maturity/index/artifact_index.stdout.json

      - name: Upload production maturity report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-maturity-report
          path: test_artifacts/production_maturity/
