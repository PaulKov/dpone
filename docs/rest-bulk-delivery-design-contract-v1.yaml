    - final_no_effect_expired_ack
    - final_no_effect_protocol_ack
    - final_full_not_accepted_promoted
    - final_full_accepted_ack_promoted
    - final_full_promoted
    - final_full_failed_ack_promoted
    - final_full_cancelled_ack_promoted
    - final_full_expired_ack_promoted
    - final_full_protocol_ack_promoted
