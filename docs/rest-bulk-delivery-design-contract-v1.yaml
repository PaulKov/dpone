    - final_partial_cancelled_ack
    - final_partial_expired_ack
    - final_partial_protocol_ack
    - final_unknown_not_accepted
    - final_unknown_accepted_ack
    - final_unknown_success_ack
    - final_unknown_failed_ack
    - final_unknown_cancelled_ack
    - final_unknown_expired_ack
    - final_unknown_protocol_ack
  monotonic_fields:
    - revision
    - journal_epoch
    - attempt_ordinal
    - observation_ordinal
    - explicit_correction_revision
    - highest_applied_generation
    - contiguous_checkpoint_frontier
  forbidden_combinations:
    - [FINALIZED, UNDETERMINED, RUNNING]
    - [FINALIZED, UNKNOWN, RUNNING]
    - [WAITING, UNKNOWN, RUNNING]
    - [SUBMITTING, NONE_PROVEN, NOT_ACCEPTED]

continuations:
  automatic:
    - poll_receipt
  internal_automatic_states:
    - RETRY_WAIT
  poll_receipt_terminal_observations:
    - SUCCEEDED
    - FAILED
    - CANCELLED
    - EXPIRED
    - PROTOCOL_UNKNOWN
  blocked_without_receipt:
    - reconcile_delivery_key
  active_remote_cancel_supported: false

async_execution:
  sync_batch:
    max_in_flight_children: profile_bounded
  async_bulk_job:
    max_in_flight_children: 1
    parent_continuation: sequential_child_supervisor
    bounded_parallel_deferred_to: V1.1

failure_scenarios:
  request_not_started_retry:
    from: submitting
    to: retry_wait
    acknowledgement_preserved: NOT_ACCEPTED
  request_not_started_no_retry:
    from: submitting
    to: final_not_started
    acknowledgement_preserved: NOT_ACCEPTED
  success_count_mismatch_partial:
    from: verifying_success
    to: final_partial_success_ack
    acknowledgement_preserved: SUCCEEDED
  success_count_missing_unknown:
    from: verifying_success
    to: final_unknown_success_ack
    acknowledgement_preserved: SUCCEEDED
  failed_atomic_rollback_proven:
    from: verifying_failure
    to: final_no_effect_failed_ack
    acknowledgement_preserved: FAILED
  failed_partial_effect:
    from: verifying_failure
    to: final_partial_failed_ack
    acknowledgement_preserved: FAILED
  failed_effect_unknown:
    from: verifying_failure
    to: final_unknown_failed_ack
    acknowledgement_preserved: FAILED
  cancelled_effect_unknown:
    from: verifying_cancelled
    to: final_unknown_cancelled_ack
    acknowledgement_preserved: CANCELLED
  expired_effect_unknown:
    from: verifying_expired
    to: final_unknown_expired_ack
    acknowledgement_preserved: EXPIRED
  protocol_unknown_after_running:
    from: waiting
    to: final_unknown_protocol_ack
    acknowledgement_preserved: PROTOCOL_UNKNOWN

stable_error_codes:
  - REST_DELIVERY_INTENT_CONFLICT
  - REST_DELIVERY_REMOTE_EFFECT_UNKNOWN
  - REST_DELIVERY_PARTIALLY_APPLIED
  - REST_DELIVERY_UNSAFE_RETRY
  - REST_DELIVERY_SCOPE_EXCEEDS_LIMIT
  - REST_DELIVERY_COUNT_MISMATCH
  - REST_DELIVERY_RECEIPT_EXPIRED
  - REST_DELIVERY_PROTOCOL_UNKNOWN
  - REST_DELIVERY_STALE_GENERATION
  - REST_DELIVERY_OVERLAPPING_EFFECT_IN_FLIGHT
  - REST_DELIVERY_RETRY_AFTER_EXCEEDS_BUDGET
  - REST_DELIVERY_APPEND_SCOPE_ALREADY_APPLIED
  - REST_DELIVERY_JOURNAL_EPOCH_BLOCKED

error_catalog:
  REST_DELIVERY_INTENT_CONFLICT: {exit_class: 2, retryability: never, operator_action: correct_intent_or_generation, alert_severity: warning, evidence_schema: dpone.rest_delivery_operation.v1}
  REST_DELIVERY_REMOTE_EFFECT_UNKNOWN: {exit_class: 4, retryability: reconciliation_only, operator_action: inspect_and_reconcile, alert_severity: critical, evidence_schema: dpone.rest_delivery_reconciliation.v1}
  REST_DELIVERY_PARTIALLY_APPLIED: {exit_class: 4, retryability: compensation_or_reconciliation_only, operator_action: reconcile_or_compensate, alert_severity: critical, evidence_schema: dpone.rest_delivery_reconciliation.v1}
  REST_DELIVERY_UNSAFE_RETRY: {exit_class: 4, retryability: never, operator_action: reconcile_delivery_key_before_retry, alert_severity: critical, evidence_schema: dpone.rest_delivery_reconciliation.v1}
  REST_DELIVERY_SCOPE_EXCEEDS_LIMIT: {exit_class: 2, retryability: never, operator_action: shrink_scope_or_change_receiver_atomicity, alert_severity: warning, evidence_schema: dpone.rest_delivery_operation.v1}
  REST_DELIVERY_COUNT_MISMATCH: {exit_class: 4, retryability: reconciliation_only, operator_action: inspect_receiver_counts, alert_severity: critical, evidence_schema: dpone.rest_delivery_reconciliation.v1}
  REST_DELIVERY_RECEIPT_EXPIRED: {exit_class: 4, retryability: reconciliation_only, operator_action: query_delivery_key_or_reconcile, alert_severity: warning, evidence_schema: dpone.rest_delivery_reconciliation.v1}
  REST_DELIVERY_PROTOCOL_UNKNOWN: {exit_class: 4, retryability: reconciliation_only, operator_action: inspect_protocol_and_reconcile, alert_severity: critical, evidence_schema: dpone.rest_delivery_reconciliation.v1}
  REST_DELIVERY_STALE_GENERATION: {exit_class: 2, retryability: never, operator_action: inspect_newer_overlapping_generation, alert_severity: warning, evidence_schema: dpone.rest_delivery_operation.v1}
  REST_DELIVERY_OVERLAPPING_EFFECT_IN_FLIGHT: {exit_class: 4, retryability: observation_only, operator_action: observe_or_reconcile_overlap, alert_severity: warning, evidence_schema: dpone.rest_delivery_reconciliation.v1}
  REST_DELIVERY_RETRY_AFTER_EXCEEDS_BUDGET: {exit_class: 4, retryability: blocked, operator_action: extend_budget_or_wait_server_window, alert_severity: warning, evidence_schema: dpone.rest_delivery_operation.v1}
  REST_DELIVERY_APPEND_SCOPE_ALREADY_APPLIED: {exit_class: 2, retryability: never, operator_action: use_certified_correction_contract, alert_severity: warning, evidence_schema: dpone.rest_delivery_effect_tombstone.v1}
  REST_DELIVERY_JOURNAL_EPOCH_BLOCKED: {exit_class: 4, retryability: reconciliation_only, operator_action: run_restore_reconciliation_and_approve_epoch, alert_severity: critical, evidence_schema: dpone.rest_delivery_reconciliation.v1}

promotion_strategy:
  researched_contract:
    immutable: true
    status: RESEARCHED
    digest_algorithm: sha256
  approval_receipt:
    schema: dpone.rest-bulk-delivery-approval.v1
    schema_document: docs/schema/rest-bulk-delivery-approval-v1.schema.json
    references:
      - design_contract_digest
      - adr_digests
      - owner_approvals
      - evidence_requirements
    mutates_researched_contract: false
    required_before_implementation: true
  production_certification:
    separate_receipt_required: true
    required_before_cutover: true

