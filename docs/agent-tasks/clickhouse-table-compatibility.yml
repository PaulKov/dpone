required_checks:
  focused:
    - RED then GREEN strict registry, descriptors, default provenance and method decision matrix
    - Preview versus resolved versus selected plan identity and strict-warning scope tests
    - Historical v1 and v2 golden codecs, default open and wrong-version refusal with unchanged bytes
    - Two-name session races, binding, fork and inode checks
    - Candidate source-admission sequence, seal and acknowledgement-loss recovery tests
    - Source-free example, JSON exit codes, privacy and immutable diagnostics tests
    - Generated reference freshness and task-contract ownership validation
  broad:
    - Change-aware selector, Ruff lint and format, mypy and full non-live pytest
    - Import rules, layer metrics, strict cross-layer graph, clustering and exact-SHA module-size gates
    - Docs links, generated references, compatibility, language contracts and isolated strict MkDocs
  live:
    - Fresh task-owned Docker Desktop current-state resolution for a manually created unmanaged table without CREATE history
    - Cached defaults and complete overrides with persistent reload/restart/ALTER/RESET characterization and independent historical-part checks
    - Exact commit and pinned image, server, driver and SQLite identities with checksummed evidence
    - Actual settings and part-layout matrix and all four methods with rows, UUIDs and full configuration checks
    - Real response loss, paused writer, cross-role concurrency, configuration drift and fresh-process zero-replay recovery
    - Production ingress, TLS, host power-loss and full ODBC route remain UNVERIFIED
required_outputs: [implementation, tests, documentation_impact, completion_report]
completion_statuses:
  allowed: [PASS, FAIL, SKIP, N/A, UNVERIFIED]
stop_conditions:
  - Required edit falls outside owned_paths.
  - Approved specification is missing or contradicted.
  - Public-contract impact is larger than declared.
  - A live check requires unapproved credentials or environment.
  - Another writer owns the same semantic contract.
  - The revised implementation plan has not been reviewed by the maintainer.
  - Current-state characterization or structural feasibility prerequisite has not passed.
  - A proposed action changes old semantic readers, weakens budgets or mutates historical evidence.
  - A proposed action releases retained owners, cleans up candidates, enables a stock route or publishes a release.
