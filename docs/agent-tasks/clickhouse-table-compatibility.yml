acceptance_criteria:
  - The specification is approved and the revised plan is separately reviewed before execution
  - Root remains sole writer with preserved Native execution and a fresh independent final reviewer
  - Positive owned-Docker current-state characterization and defensible whole-plan graph projection precede dependent production changes
  - First-use manually created unmanaged tables need no CREATE receipt while original-operation authority remains mandatory for recovery
  - The pinned resolver uses complete cached defaults plus persisted overrides and actual topology on a bracketed non-reconnecting observation
  - Preserve existing committed Tasks 1 and 2 and unfinished Task 3 without changing historical evidence
  - Closed typed settings policy preserves verified existing settings without manual copies
  - Unknown applicable compatibility blocks by default and warn only selects an independently verified alternative
  - Shared unknowns, unknown settings, provenance gaps and uncertain effects always block or retain
  - Actual preflight holds both physical-name locks through acknowledged enrollment and publication without an unlock window or nested flock
  - Candidate CREATE completion and independent configuration readback precede the first source call
  - Explicit v3 resolved enrollment and selected PREPARED are atomic on the original authority with v1 and v2 bytes and defaults unchanged
  - Recovery is source-free and zero-replay with immutable mode, selection and explicit method-aware after-state
  - All architecture gates pass without baseline relaxation, hidden dependencies or graph padding
  - Exact-commit live evidence covers settings provenance, all four methods, warning behavior and activated faults
  - Runnable documentation distinguishes staged Python capability from stock ODBC and production certification
