required_checks:
  focused:
    - Characterize unchanged technical-column names, types, catalog injection and SCD2 overrides before same-domain policy consolidation
    - RED then GREEN strict design and typed evidence tests with old producer golden vectors unchanged
    - V1 compatibility and v2 namespace, CAS, ambiguous ACK and fresh-process tests
    - Native candidate request, privacy and no-retry tests
    - Protected observation, immutable seal and session-bound backend tests
    - Source-free recovery, source exhaustion and runnable example tests
    - Task contract validation and plan-to-file ownership consistency
  broad:
    - Change-aware validation selector, Ruff lint and format, mypy
    - Import rules, layer metrics and exact-SHA module size with no debt growth
    - Full non-live pytest suite with skip reasons preserved
    - Docs links, generated references, language contracts and strict MkDocs
    - Refresh generated metrics only through their producer and verify freshness
  live:
    - Owned Docker Desktop Linux actual candidate lifecycle and all publication methods on exact final commit
    - Actual native response-loss, paused writer, catalog drift and fresh-process recovery with zero source or SQL replay
    - Record source tree, image, server, driver, SQLite and activated faults; checksum all evidence
    - Production ingress, TLS, power-loss and full ODBC route remain UNVERIFIED
required_outputs: [implementation, tests, documentation_impact, completion_report]
completion_statuses:
  allowed: [PASS, FAIL, SKIP, N/A, UNVERIFIED]
stop_conditions:
  - Required edit falls outside owned_paths.
  - Approved specification is missing or contradicted.
  - Public-contract impact is larger than declared.
  - A live check requires unapproved credentials or environment.
  - Another writer owns the same semantic contract.
  - The written implementation plan has not been reviewed by the maintainer.
  - The pinned server grammar or type behavior requires weakening the approved profile.
  - A proposed action would mutate old evidence, migrate v1, release owners or enable a stock route.
