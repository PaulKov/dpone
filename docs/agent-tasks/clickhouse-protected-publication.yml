schema_version: 1
task_id: DPONE-CLICKHOUSE-PROTECTED-PUBLICATION
title: Protected candidate lifecycle, observation and backend composition
goal: Implement the approved single-operation Python backend without replay, v1 migration or route activation
specification: docs/feature-design-clickhouse-protected-publication.md
base_commit: f46bdceef120894a5ad1cd8fab82bb4170c601ee
integrator: root
acceptance_criteria:
  - Maintainer reviews the written implementation plan before any production edits
  - Explicit v2 fresh enrollment preserves v1 defaults and original records without migration or replacement stores
  - Target and candidate cross-role reservations are atomic and source access follows acknowledged readiness and enrollment
  - Every CREATE and INSERT is registered, sent once and durably completed before irreversible candidate sealing
  - Protected typed catalog and content observations replace synthetic fixture flags
  - One bound execution session bridges the existing kernel and publisher without nested flock or a permission reconstructed from readback
  - Pre-PREPARED restart is inspection-only and all recovery is source-free with zero SQL replay
  - Runnable documentation and exact-commit owned Docker faults cover all four publication methods and retained uncertainty
  - Root is the sole writer and a fresh independent reviewer checks the final implementation and any corrected findings
  - No owner release, cleanup, checkpoint advancement, stock ODBC activation, merge or release is included
