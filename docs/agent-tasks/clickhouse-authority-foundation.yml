schema_version: 1
task_id: DPONE-CLICKHOUSE-AUTHORITY-FOUNDATION
title: Durable dpone-only ClickHouse authority foundation
goal: Implement nonexpiring ownership and acknowledged one-shot journal transitions without route activation
specification: docs/feature-design-clickhouse-dpone-only-authority.md
base_commit: f231a05331d521937a5e813038c83bed22c4de74
integrator: root
acceptance_criteria:
  - Existing authority opens without implicit creation or ownership transfer
  - Only acknowledged claim CAS returns a dispatch grant and readback never reissues it
  - Send and no-send closure are competing irreversible durable transitions
  - Unknown and terminal publication states retain target ownership
  - Fresh processes prove contention and crash behavior against real SQLite
  - No production backend, source route or release readiness is implied
public_contract_impact:
  level: compatible
  surfaces: [Python API, documentation]
  migration_required: false
