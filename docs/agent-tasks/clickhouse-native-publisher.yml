acceptance_criteria:
  - All dispatch uses the original protected binding and acknowledged volatile grant
  - Per-subject execution exclusion cannot be selected by endpoint alias or caller lock path
  - Lost send-entry acknowledgement emits zero network calls
  - Exactly one fixed statement and positively consumed successful native EndOfStream precede terminal persistence
  - Faults and process death retain uncertain transport and target ownership without replay
  - Actual owned Docker tests prove mutation effects and response-loss quarantine on the frozen candidate
  - Observer, candidate sealing, owner release, ODBC activation and release remain outside this increment
