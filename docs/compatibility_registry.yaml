version: 1
policy:
  canonical_packages:
  - dpone.manifest
  - dpone.dag
  - dpone.runtime
  - dpone.contracts
  - dpone.ports
  - dpone.adapters
  removal_rule: Remove compatibility shims only after one dedicated deprecation release
    and zero internal usages.
entries:
- deprecated: dpone.yaml_config_handler
  canonical: dpone.dag
  scope: package
  status: deprecated-shim
  removal: after one dedicated deprecation release
  notes: Legacy DAG package kept as re-export shim during migration.
  removal_batch: cleanup-release-1
- deprecated: dpone.source
  canonical: dpone.runtime.sources
  scope: package
  status: deprecated-shim
  removal: after one dedicated deprecation release
  removal_batch: cleanup-release-1
