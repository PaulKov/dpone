schema_version: 1
task_id: DPONE-COMPOSITION-ATOMIC-PUBLISHER
title: Protected whole-snapshot ClickHouse publication state machine
goal: Implement the approved Atomic A/B snapshot publication policy and narrow injected
  ports; concrete SQL storage, gate enforcement and sink wiring remain integrator
  responsibilities.
specification: docs/feature-specs/composition-activation-execution.md
base_commit: 9720932521cf21a5488573ce7ff14d94bfc464cc
integrator: root
acceptance_criteria:
- Immutable exact-byte intent identity binds parent/attempt/epochs, protected physical
  pair, complete reconciled generation and closed ingest; reject unknown, changed
  or incomplete data.
- Four narrow injected capabilities reopen protected original authority, independent
  fresh catalog, durable exact CAS state and no-retry single EXCHANGE dispatch.
- Only acknowledged durable PREPARED to EXCHANGE_INTENT claim and exact independent
  readback permit one dispatch; uncertainty or repetition never retries EXCHANGE.
- After actual publisher closure and quiescence classify A/B as NOT_PUBLISHED and
  B/A as PUBLISHED; altered, missing or unavailable pair/content is COMMIT_UNKNOWN
  retaining ownership.
- Recovery may drain exact retained ownership during RETIRING and never grants new
  write authority.
- Empty and vanished-row full snapshots preserve complete B semantics; no DROP/ALTER/RENAME/automatic
  checkpoint or target deletion.
- Meaningful fault, concurrency, tampering, pair and compatibility tests; no mock
  result is a live pass; no budget or baseline changes.
- Keep modules cohesive under actual budget; no generic plugin system or duplicate
  native/semantic-refresh policies.
