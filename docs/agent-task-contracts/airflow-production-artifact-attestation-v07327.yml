schema_version: 1
task_id: "DPONE-AIRFLOW-PRODUCTION-ARTIFACT-ATTESTATION-07327"
title: "Production Airflow artifact attestation"
goal: "Verify one immutable signed deployment before Airflow cache activation or KPO runtime extraction."
specification: "docs/feature-design-airflow-production-artifact-attestation-v07327.md"
base_commit: "bf809640"
integrator: "Codex"

acceptance_criteria:
  - "Protected CI can prepare, externally sign, verify, and immutably publish one deployment attestation package."
  - "Stock cache materialization verifies the exact package before local installation."
  - "Stock runtime init-fetch verifies the same package before executable extraction."
  - "Tamper, replay, wrong key, revocation, partial publication, and unavailable verifier fail closed."
  - "Non-production unsigned behavior remains backward-compatible."

public_contract_impact:
  level: compatible
  surfaces:
    - "dpone airflow artifact-attestation CLI"
    - "Airflow artifact attestation and trust policy schemas"
    - "Airflow cache materialization evidence"
    - "runtime-fetch-ready attestation evidence"
  migration_required: false
  migration_notes: "Production exact deployments add a signed overlay; existing unsigned deployments remain usable only in non-production."

