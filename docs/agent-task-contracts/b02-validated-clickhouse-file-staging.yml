stop_conditions:
- Approved specification or active exact path contract is missing or contradicted.
- Required edit falls outside owned_paths or another writer owns the path.
- Scope would change generic stage dispatch, schema evolution, source route or terminal
  authority.
- A shared reader change would alter existing source-validator admission or receipt
  grammar.
- A live check needs unapproved environment or credentials.
- Required owned module would grow debt or need a budget or baseline relaxation.
- Required edit falls outside owned_paths.
- Approved specification is missing or contradicted.
- Public-contract impact is larger than declared.
- A live check requires unapproved credentials or environment.
- Another writer owns the same semantic contract.
