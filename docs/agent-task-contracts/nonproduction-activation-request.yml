schema_version: 1
task_id: DPONE-NONPRODUCTION-ACTIVATION-REQUEST
title: Bind scoped activation requests to exact execution grants
goal: Bind scoped activation requests to exact execution grants
specification: docs/feature-specs/nonproduction-composition-authority.md
base_commit: 0a340b20120a7ee5ac66b55c90a9dfff051c4a10
integrator: root
acceptance_criteria:
- Implement only the new strict dpone.composition-activation-request.nonproduction.v1
  full request plus mandatory execution_grant_sha256; no optional legacy field or
  fake production-family decoding.
- Reuse root-owned activation_request_fields structural decoder and existing base
  validation, preserving every old request byte/hash/rejection behavior.
- Canonical request digest is exact canonical UTF-8 SHA256 and covers grant; retain
  runtime_context_sha256 meaning, existing physical guards and attempt/receipt shapes.
- Require complete three-cell synthetic parent within64 workloads and exact canonical
  resource partition. This is a pure contract, not physical enrollment or signature
  authority.
- Provide a pure comparison of exact execution grant hash, parent/deployment/activation
  and full workload id/constituent/pack membership, bounded by grant limits; authentication/native-source/scope
  reconstruction remain separate mandatory operations.
- Cover strict shape, canonical bytes, altered/refingerprinted grant, phase/membership
  mismatch, old reader rejection and original legacy fixtures; no public factory or
  SQL dispatch changes.
