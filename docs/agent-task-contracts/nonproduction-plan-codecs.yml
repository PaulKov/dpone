- docs/adr/0061-shared-composition-physical-ownership.md
- Exact base commit and separate writer worktree with a complete read-only prerequisite manifest.
required_checks:
  focused:
  - RED/GREEN strict fixture/profile/object/action codecs and byte/hash vectors.
  - Pair closure, DAG, original grant limits/window and exact owner/operation projection tests.
  - Existing nonproduction authority/grant and qualification owner/operation/invocation compatibility suites.
  broad:
  - Ruff check and Ruff format --check for every owned file.
  - Cold mypy --config-file mypy.ini --no-incremental naming every owned source/test/helper.
  - Canonical module size, import rules, graph/layer observation and change-aware plan; do not change budgets
    or claim preexisting graph FAIL as PASS.
  - Exact source/prerequisite freeze and fresh independent source review; root owns the final full repository
    gate.
  live:
  - 'N/A for this codec-only writer: no SQL, signatures, seeding, reservations, runner or source-bound certification.'
required_outputs:
- implementation
- tests
- documentation_impact
- completion_report
completion_statuses:
  allowed:
  - PASS
  - FAIL
  - SKIP
  - N/A
  - UNVERIFIED
stop_conditions:
- Required edit falls outside owned_paths.
- Approved specification is missing or contradicted.
- Public-contract impact is larger than declared.
- A live check requires unapproved credentials or environment.
- Another writer owns the same semantic contract.
- Any descriptor/bound/runner/physical truth would need to be fabricated to make a test or API succeed.
- The adopted generation/order/helper rules conflict with an existing approved invariant; stop and report, without
  widening ownership.
