acceptance_criteria:
- Implement the reviewed closed 18-case inventory across the two owned live modules. No case is
  parametrized into an uncontrolled inventory. Require the exact isolated-runner opt-in, ownership
  token and loopback participant; default collection skips all 18 cases.
- Reuse OwnedDatabase, complete SQL draining/numeric failure helpers, TrustCase via composition,
  current canonical storage fixtures and the real composition_control_transaction. Never duplicate
  credential parsing or return raw DBAPI exceptions, originals or arbitrary log text.
- Observe actual external installation and exact filtered-index/catalog normalization; full original
  8 MiB public signature-bundle readback with byte lengths and independent Python/SQL hashes;
  append-only/invalid direct DML; execution replay/rebind/two documentary candidates; qualification
  once-consumption/no run rebind; complete campaign membership lower/higher limits including 64;
  full paginated history and later-original corruption; historical/current trust and A-B-A revisions;
  real ledger/service/revision/session preconditions; concurrent qualification uniqueness; concurrent
  execution ceilings; partial-write rollback; lost ACK after real commit; failed commit and unavailable
  reconciliation; missing/wrong/65th membership; installed schema drift; restricted provisioner
  permissions; effective session-option rejection and restoration.
- Use real independent SQL connections and bounded barriers for concurrency, never automatic mutation
  retries. Observe durable state after both contenders complete. Swallowing an expected error inside
  a committing context is forbidden; propagate failures so the caller rolls back the whole transaction.
- Client-boundary faults run around actual SQL inserts or caller commit. Label lost ACK only when
  real commit completed. Failed calls return no acknowledged receipt; subsequent independent reads
  distinguish absence, durable exact originals and unresolved observation.
- Use a separately provisioned restricted login for actual database/server token and no-bypass
  permission observations. EXECUTE AS USER alone cannot establish server/bulk authority. Do not
  accept file-not-found or unsupported syntax as a permission refusal. If actual bulk-path proof
  needs a new container fixture capability, report the exact requirement rather than invent PASS.
- Preserve actual ProductVersion, complete fixed case IDs, row/member counts, byte lengths/digests,
  transaction states, fixed errors, connection/commit observations and owned cleanup status.
  Sanitization and JUnit failure preservation are narrowly scoped to the new modules.
- No runtime, schema, runner, workflow, fixture-root, dependency or budget changes. If live behavior
  contradicts SQL assumptions, preserve FAIL with bounded diagnosis and report a concrete root fix.
- No local SQL, existing environment, business fixture, PyPI or credentials outside the approved
  fresh Linux synthetic runner. These tests certify storage only, not grant signatures, source reads,
  ownership, budgets or current/provider/worker execution.
