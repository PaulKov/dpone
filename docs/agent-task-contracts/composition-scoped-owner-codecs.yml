acceptance_criteria:
- APPROVED within the maintainer-approved nonproduction feature; the scoped owner reference and ADR0061
  addendum define the contract. Only seven owned paths may change. Architecture regressions require reconciliation
  before integration.
- Implement exactly the fields, APIs, closed matrix, sorted unique bounds, 8 MiB canonical owner bytes,
  fixed error reasons and recursive revalidation in docs/composition-scoped-execution-originals.md. Do
  not infer missing contract choices.
- Retain existing NP request R and original attempt A bytes, fields, hashes and validators; E is a new
  mandatory full owner original with the unchanged actual execution owner key.
- Bind every R resource exactly to its E claim and complete execution observation; use a total genuine
  DbtRelationWrite bridge, never equate logical-write hashes directly to object subject hashes.
- Retain exact full Q/E signed scope, participant directional sets and physical claim roles. Distinct
  original phase observations may differ. Qualification-only effects remain owned without becoming execution
  effects or permissions.
- 'Enforce each exact R execution cell: sqlserver_dbt_v1 binds model/unit_test MSSQL table/view writes;
  mssql_clickhouse_full_refresh_v1 binds transfer target ClickHouse table writes; postgres_mssql_full_refresh_v1
  binds transfer target MSSQL table writes. Reject cross-cell kind/connector substitutions even with internally
  rehashed originals. Other actual effects stay separate and require later source-derived proof.'
- 'Strictly wrap the ten original DbtRelationWrite fields: validate a detached exact copy with existing
  rules, reject any normalization/type mismatch, never mutate the supplied embedded original, and preserve
  canonical from_bytes equality. Legitimate pre-embedding canonicalization remains allowed.'
- Preserve sorted unique effect triples with multiple purposes per object/access allowed. Count every
  edge toward the aggregate bound; derive access/guard unions without granting an undeclared direction.
- Represent real MSSQL table/view, PostgreSQL table/enum/sequence and ClickHouse table objects. Do not
  widen the frozen two-fixture plan grammar or manufacture unsupported native qualification originals.
- Derive each full selected operation partition only from the complete revalidated envelope and its actual
  workload effects after checking the unchanged original attempt write projection.
- Embed only upstream qualification handoff facts, adjacent complete epochs and original source-seal associations;
  no additional acquisitions, receipt authority, circular hash, lifecycle state, nullable scope, or fallback.
- Reuse existing pure physical and original contracts plus frozen NonproductionPlanOriginal and NonproductionPlanEffect.
  Preserve all read-only source pins and current capability closure.
- Document what codecs cannot prove, including original acquisition, alias equality, full executable effects,
  actual source sealing, finite bounds, signatures, current trust, counters, current worker, PG authorities,
  terminal proofs and transfer.
- No storage, schema, catalog, decoder dispatch, attempt adapter, proof issuer/verifier, factory, runner,
  CLI, connector, service or public capability wiring. No live execution or SQL.
- Keep each owned module at or below 350 canonical SLOC and within unchanged repository budgets. Stop
  for a cohesive redesign if this is infeasible; no mechanical splits or metric exemptions.
- Preserve meaningful RED output before implementation and final GREEN JUnit with exact case inventory,
  byte/hash compatibility evidence, cold typing and all scoped static checks. Do not remove or weaken
  existing scenarios.
- 'Require the adopted known source-read minima: MSSQL-to-ClickHouse workloads read at least one retained
  MSSQL table/view; PostgreSQL-to-MSSQL workloads read at least one retained PostgreSQL table. Check access
  independently of purpose; native constant dbt models have no invented read minimum. Current generation/bounds/closure
  remain future protected proof.'
- Use only /tmp/dpone-composition-v3-scoped-owner at exact9974bcde380db703f616addde080b2388578fddf with
  the independent offline environment /tmp/dpone-v3-scoped-owner-env. All7944 original tracked hashes
  remain unchanged. You are not alone in the codebase; do not revert or edit other worktrees, and report
  ownership conflict. No commit or push; root integrates.
