stop_conditions:
- Required edit falls outside owned_paths.
- Approved specification is missing or contradicted.
- Public-contract impact is larger than declared.
- A live check requires unapproved credentials or environment.
- Another writer owns the same semantic contract.
- A required genuine native/helper effect cannot be represented or proved without changing a frozen plan/legacy
  type or fabricating an original.
- Any requirement would infer physical observation, proof authority, source bounds, current identity,
  permission or successful transfer from a declared digest or codec result.
- A read-only prerequisite hash changed or another writer overlaps a semantic contract; notify root before
  continuing.
- Cohesive implementation exceeds the 350 SLOC owned cap or grows existing graph debt; report exact metrics
  and a concrete architecture alternative instead of changing baselines.
