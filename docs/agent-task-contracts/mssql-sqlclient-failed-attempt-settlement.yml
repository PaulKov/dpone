  - "src/dpone/adapters/mssql_sqlclient_native_retirement_operator.py"
forbidden_paths:
  - "pyproject.toml"
  - "uv.lock"
  - "mkdocs.yml"
  - ".github/workflows"

shared_file_owner: "integrator"
dependencies:
  - "P10g exact retirement"
  - "schema-v4 native parent journal"
  - "admitted TDS state domain"
required_checks:
  focused:
    - "uv run pytest tests/test_mssql_sqlclient_failed_attempt_settlement.py tests/test_mssql_sqlclient_fresh_chunk_executor.py -q"
  broad:
    - "uv run ruff check ."
    - "uv run mypy --config-file mypy.ini"
    - "uv run pytest -m 'not integration_live' -n auto --dist loadfile"
  live:
    - "exact-source Docker narrow and 100-column retry/recovery fault matrix"
required_outputs:
  - "implementation"
  - "tests"
  - "documentation_impact"
  - "completion_report"
completion_statuses:
  allowed: ["PASS", "FAIL", "SKIP", "N/A", "UNVERIFIED"]
stop_conditions:
  - "Required edit falls outside owned_paths."
  - "Approved specification is missing or contradicted."
  - "Public-contract impact is larger than declared."
  - "A live check requires unapproved credentials or environment."
  - "Another writer owns the same semantic contract."
