acceptance_criteria:
- Add externally installed SQL trust extension and injected read-only NonproductionTrustProvider
  against the existing protected control connection/service; runtime never installs,
  updates or discovers pins from grants.
- Persist full original policy/verifier bytes and exact external hashes/current revocation
  epoch with independently selected environment and strictly append-only monotonic
  revisions; fixed renderer and strict original schema/module integrity checks.
- Read latest complete version on a fresh protected connection, verify external service/environment,
  exact original bounded byte pins and policy environment/epoch consistency. Expose
  documentary revision+snapshot for private compare-and-commit bracketing, never a
  transferable executor permit.
- Provide narrow same-ledger reread/require-equal revision capability for later admission
  transaction; no separate commit between future budget and RUNNING writes.
- Schema must prevent UPDATE/DELETE and revision rollback/reuse/ABA under normal protected
  provisioner operations, with concurrent append ordering; catalogue/permission assumptions
  explicit, not inferred from table names.
- Keep authenticator tuple API and all native/production contracts unchanged; no grant
  consumption, credential issuance, new signer or worker factory.
- Cover SQL observation shape/pin/env/epoch/revision errors, unavailable/commit/cleanup
  behavior, immutable DDL and actual renderer hashes. No fake livePASS or budget change.
