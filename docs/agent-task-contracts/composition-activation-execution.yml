acceptance_criteria:
  - Complete native and ordinary closure is checked after physical binding resolution.
  - Unknown capabilities, collisions, stale epochs and unknown attempts fail closed.
  - The cache lifecycle uses distinct complete-parent PREPARED and ACTIVE authority.
  - Protected backend and real worker integration remain explicit dependent acceptance requirements.
  - V3 provider execution requires the approved root-supervisor, RWX PVC, tmpfs profile, and reserved child-identity contract.
  - Verified runtime selection cannot fall back from v3 to native-v2 or generic execution.
  - Preserve native v2 and producer integrity; retain explicit live acceptance gaps.
