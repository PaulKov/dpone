schema_version: 1
task_id: DPONE-NONPRODUCTION-GRANT-SIGNATURE
title: Authenticate original nonproduction grants against external GitHub signer pins
goal: Implement actual offline GitHub-verifier composition, external policy refresh
  and common grant authentication without enabling scoped execution.
specification: docs/feature-specs/nonproduction-composition-authority.md
base_commit: ffc8141380caf30fc086ee5b4623f794575bbafb
integrator: root
acceptance_criteria:
- Verify exact original bounded canonical grant bytes with the existing real offline
  GitHub adapter; a caller verification report cannot authorize.
- Strictly bind external NP signer backend, fixed Actions issuer, exact workflow URL@40hexSHA
  and root-byte digest to the strictly parsed external existing runtime-artifact-trust-policy.v2.
- Require non_production trust tier and mandatory attestations; reject unsupported
  Cosign rather than claiming public-key verification authenticates issuer labels.
- Inject narrow trusted policy/revocation source, signature verifier and independent
  clock; refresh before and after verification, rejecting expiry, changes, revoked
  or foreign scope.
- Keep actual protected enrollment, phase subjects, consumption and resource counters
  explicit independent obligations; public scoped execution factories remain closed.
- Preserve all existing production/native-v2 parser behavior and immutable identities.
- Temporary verification files contain only public artifact/root/bundle bytes, bounded
  regular files, safe permissions, cleanup; no raw subprocess exception or credential
  diagnostics.
- Contract tests cover genuine adapter argv/byte boundaries, tampering, phase/common
  scope/pin/revocation/expiry races and redacted failures. Doubles are not positive
  cryptographic evidence.
public_contract_impact:
  level: compatible
  surfaces:
  - python
  - runtime
  - state
  - evidence
  - documentation
  migration_required: false
owned_paths:
