schema_version: 1
task_id: "DPONE-PROCESS-ISOLATED-MSSQL-LANES"
title: "Process-isolated MSSQL initial-load lanes"
goal: "Run parallel target-atomic MSSQL backfill lanes in spawned interpreters with serialized parent-owned ledger I/O and crash-safe cleanup."
specification: "docs/feature-design-resumable-shadow-initial-load.md"
base_commit: "fa1e02e53"
integrator: "/root"

acceptance_criteria:
  - "No Python interpreter executes concurrent pyodbc calls during a parallel target-atomic MSSQL backfill."
  - "Exactly one long-lived spawned process owns each active source/sink lane and is reused across chunks."
  - "The parent serializes lease, heartbeat, ledger completion, dispatch, stop, and result IPC."
  - "An abrupt lane exit stops new dispatch, bounds peer work, preserves durable receipts, and leaves non-success chunks resumable."
  - "Unsupported or non-serializable process bootstrap fails before chunk source or target I/O."
  - "Native crash diagnostics include Python faulthandler output without exposing row payloads or credentials."
  - "When the dead process parent's exact MSSQL session closes, campaign, chunk, and generic operation ownership is reclaimable before the five-minute scheduler retry; a partition that preserves the server session remains fenced and fails closed."
  - "A finite generic operation lease is registered and parent renewal starts immediately after successful admission, before post-admission source-boundary or schema-preplan work."
  - "Every POSIX lane completes READY, parent containment ACK, then runtime-ready before the first claim; cleanup proves that the interpreter and inherited native descendants left the validated process group."

public_contract_impact:
  level: compatible
  surfaces:
    - "parallel target-atomic MSSQL backfill runtime behavior"
    - "backfill failure, lease, and resume semantics"
    - "operator diagnostics for native lane crashes"
  migration_required: false

