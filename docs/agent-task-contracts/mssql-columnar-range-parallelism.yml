  - docs/adr-index.md
  - dpone-release-controller
  - any version or tag metadata for 0.85.0

shared_file_owner: "/root"

dependencies:
  - "ADR 0057 ClickHouse staged publication"
  - "canonical RangePartitioner and MSSQL predicate renderer"

required_checks:
  focused:
    - "uv run pytest tests/test_mssql_columnar_range_parallelism.py tests/test_runtime_typed_partitioning.py -q"
  broad:
    - "uv run python tools/agent_policy/select_checks.py --base-ref origin/master"
    - "uv run ruff check ."
    - "uv run ruff format --check ."
    - "uv run mypy --config-file mypy.ini"
    - "uv run dpone docs check-import-rules"
    - "uv run dpone docs check-layer-metrics --baseline docs/layer_metrics_baseline.json"
    - "uv run pytest -m 'not integration_live' -n auto --dist loadfile"
  live:
    - "SKIP unless an explicitly approved synthetic MSSQL/ClickHouse/object-store environment is supplied"

required_outputs:
  - implementation
  - tests
  - documentation_impact
  - completion_report

completion_statuses:
  allowed: [PASS, FAIL, SKIP, N/A, UNVERIFIED]

stop_conditions:
  - "Required edit falls outside owned_paths."
  - "Approved specification is missing or contradicted."
  - "Public-contract impact is larger than declared."
  - "Another writer owns the same semantic contract."
  - "Required edit conflicts with another active writer."
  - "Runtime cannot enforce a public option it accepts."
  - "A topology cannot preserve one publication barrier."
  - "A byte-bound claim lacks measured retained bytes."
  - "A live check requires unapproved credentials or environment."
