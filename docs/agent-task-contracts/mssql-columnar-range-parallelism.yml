  - src/dpone/runtime/sinks/clickhouse_staging_finalizer.py
  - docs/architecture.md
  - docs/engineering-standards.md
  - docs/testing/index.md
  - docs/release.md

forbidden_paths:
  - pyproject.toml
  - uv.lock
  - CHANGELOG.md
  - mkdocs.yml
  - .github/workflows
  - src/dpone/schema/etl-config.schema.json
  - src/dpone/schema/etl-batch-manifest.schema.json
  - docs/reference/configuration.md
  - docs/source-sink/mssql-to-clickhouse.md
  - docs/object-storage-staging.md
  - docs/source-sink-matrix.md
