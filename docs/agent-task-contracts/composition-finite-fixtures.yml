acceptance_criteria:
- APPROVED within the maintainer-approved feature; exact docs/nonproduction-fixture-inputs.md is normative,
  including FIN-1 and the complete independent API/type/error closure.
- Own only the10 declared paths. Move each existing column inventory once to its canonical runtime owner;
  do not duplicate literals, import tools/tests from runtime, or import runtime from contracts. Old producer
  classes stay defined at their original paths.
- Preserve all202 BCP and128 PG raw column values/order, existing list/DTO/signature/exports/mapper behavior,
  legacy initial/watermark SQL bytes and exception propagation. Existing variable BCP count compare/slice/range
  behavior including bool/negative inputs and PG str(row_id) remain unchanged.
- Guarded BCP renderer uses fixed202 columns and strict source MSSQL table plus exact int row_count0..100000.
  Five fixed decimal digits select1..N; convert the key expression to bigint BEFORE every unchanged existing
  column expression. Isolate overflow-relevant2147/2148/100000 cases and kill removal of the early conversion.
  Do not modify legacy seven-digit TOP/ROW_NUMBER renderer.
- Fixed PG canonical rows return exactly two initial128-expression vectors or one watermark3 vector with
  explicit71/72/73/74 serial/identity values; no fabricated nextval obligation. Guarded PG DDL/helper
  resolution remains outside this pure slice.
- Implement exact frozen NonproductionFixtureInput fields/API and dpone.nonproduction-fixture-input.v1
  canonical1MiB codec. Parameters are immutable profile pairs; implementation descriptors have the exact
  closed path set; seed_steps are generation-ordered immutable pairs, never sorted by ID.
- Construction takes the fixture plan and closed seed originals before input/route/qualification/grant
  hashes exist. Full readback revalidates the complete original grant-bound pair, exact route/input digest/size
  and bounded predecessor source writers. Reject unsupported ancestor writers. Return the exact existing
  selected route item only as documentary data.
- Use exactly the reviewed8 new fixed reason tokens and preserve inherited subvalue/parser/complete-pair
  errors and Python call-binding errors. Wrong schema/noncanonical shared parser ingress stays outward
  document; do not alter shared helpers.
- Capture explicit baseline producer inputs, full emitted SQL/event bytes and all-value immutable golden
  digests BEFORE edits. Keep original/final evidence and complete test inventory. Do not regenerate changed
  golden expectations from the new implementation.
- Run meaningful RED/GREEN and mutant-isolation tests, unchanged tool/PG projection/codec/wire compatibility,
  cold explicit10-file typing, Ruff/format and canonical size/import/graph observations. Every owned file<=350SLOC;
  no compression, baseline/budget/exclusion changes.
- Use only prepared isolated /tmp/dpone-composition-v3-finite-fixtures and /tmp/dpone-v3-finite-fixtures-env
  with locked/no-sync/offline commands. All7942 unowned tracked originals remain exact; do not edit/revert
  other worktrees. No commit/push/live/SQL/PyPI. Root integrates/docs/reviews.
- No new authority, policy, clock, credentials, real generation, bound reservation, counter, seal/transfer,
  adapter, public factory or CLI. Actual source closure/native-dbt finite bounds/full campaign remain
  UNVERIFIED.
